<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>حسابگران آرمان</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>


  <style>

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }


    html,
    body {

      margin: 0;
      padding: 0;

      min-height: 100%;

      font-family:
        Tahoma,
        Arial,
        sans-serif;

      background:

        radial-gradient(
          circle at top right,
          rgba(46,125,255,.18),
          transparent 32%
        ),

        radial-gradient(
          circle at bottom left,
          rgba(153,137,53,.12),
          transparent 30%
        ),

        #07101d;

      color: #f5f7fb;

    }


    body {

      min-height: 100vh;

      overflow-x: hidden;

    }


    button,
    input {

      font-family: inherit;

    }


    .app {

      width: 100%;

      max-width: 1180px;

      margin: 0 auto;

      padding: 18px;

    }


    .glass {

      background:

        linear-gradient(
          135deg,
          rgba(255,255,255,.09),
          rgba(255,255,255,.035)
        );

      border:
        1px solid
        rgba(255,255,255,.10);

      box-shadow:

        0 20px 60px
        rgba(0,0,0,.28),

        inset 0 1px 0
        rgba(255,255,255,.05);

      backdrop-filter:
        blur(20px);

      -webkit-backdrop-filter:
        blur(20px);

      border-radius: 26px;

    }


    .header {

      padding: 22px;

      margin-bottom: 18px;

      position: relative;

      overflow: hidden;

    }


    .header::after {

      content: "";

      position: absolute;

      width: 180px;
      height: 180px;

      left: -70px;
      top: -80px;

      border-radius: 50%;

      background:
        rgba(197,165,72,.09);

      filter: blur(10px);

    }


    .brand {

      display: flex;

      align-items: center;

      gap: 14px;

    }


    .logo {

      width: 62px;
      height: 62px;

      border-radius: 19px;

      display: flex;

      align-items: center;
      justify-content: center;

      background:

        linear-gradient(
          145deg,
          rgba(197,165,72,.28),
          rgba(25,115,255,.16)
        );

      border:
        1px solid
        rgba(255,255,255,.12);

      box-shadow:

        inset 0 1px 0
        rgba(255,255,255,.12),

        0 10px 30px
        rgba(0,0,0,.2);

      font-size: 28px;

    }


    .brand h1 {

      margin: 0;

      font-size: 21px;

      letter-spacing: -.5px;

    }


    .brand p {

      margin: 7px 0 0;

      color: #9ca9bc;

      font-size: 12px;

    }


    .status {

      display: inline-flex;

      align-items: center;

      gap: 7px;

      margin-top: 17px;

      padding: 7px 12px;

      border-radius: 999px;

      background:
        rgba(38,195,123,.08);

      border:
        1px solid
        rgba(38,195,123,.18);

      color: #7ee0b2;

      font-size: 11px;

    }


    .status-dot {

      width: 7px;
      height: 7px;

      border-radius: 50%;

      background: #46d391;

      box-shadow:
        0 0 12px
        rgba(70,211,145,.8);

    }


    .hero {

      padding: 25px;

      margin-bottom: 18px;

      position: relative;

      overflow: hidden;

    }


    .hero::before {

      content: "";

      position: absolute;

      width: 240px;
      height: 240px;

      right: -90px;
      top: -100px;

      border-radius: 50%;

      background:
        rgba(35,125,255,.14);

      filter: blur(30px);

    }


    .hero-title {

      position: relative;

      z-index: 1;

      color: #98a8bd;

      font-size: 12px;

      margin-bottom: 8px;

    }


    .hero-value {

      position: relative;

      z-index: 1;

      font-size: 34px;

      font-weight: 700;

      letter-spacing: -1px;

    }


    .hero-sub {

      position: relative;

      z-index: 1;

      margin-top: 9px;

      color: #8f9bad;

      font-size: 12px;

    }


    .stats {

      display: grid;

      grid-template-columns:
        repeat(4,1fr);

      gap: 14px;

      margin-bottom: 18px;

    }


    .stat {

      padding: 19px;

      min-height: 120px;

    }


    .stat-label {

      color: #8795aa;

      font-size: 11px;

      margin-bottom: 14px;

    }


    .stat-value {

      font-size: 26px;

      font-weight: 700;

    }


    .stat-icon {

      font-size: 21px;

      margin-bottom: 9px;

    }


    .section {

      margin-bottom: 18px;

    }


    .section-head {

      display: flex;

      justify-content: space-between;

      align-items: center;

      margin-bottom: 12px;

      padding: 0 3px;

    }


    .section-head h2 {

      margin: 0;

      font-size: 16px;

    }


    .section-head span {

      color: #7f8da2;

      font-size: 11px;

    }


    .overview {

      display: grid;

      grid-template-columns:
        repeat(3,1fr);

      gap: 14px;

    }


    .overview-card {

      padding: 20px;

    }


    .circle-wrap {

      display: flex;

      align-items: center;

      gap: 18px;

    }


    .circle {

      width: 84px;
      height: 84px;

      flex: 0 0 84px;

      border-radius: 50%;

      display: flex;

      align-items: center;
      justify-content: center;

      position: relative;

      background:

        conic-gradient(
          #4b91ff
          var(--percent),
          rgba(255,255,255,.08)
          var(--percent)
        );

    }


    .circle::before {

      content: "";

      position: absolute;

      width: 62px;
      height: 62px;

      border-radius: 50%;

      background: #0b1727;

    }


    .circle-value {

      position: relative;

      z-index: 1;

      font-size: 16px;

      font-weight: 700;

    }


    .circle-text h3 {

      margin: 0 0 7px;

      font-size: 13px;

    }


    .circle-text p {

      margin: 0;

      color: #7f8da2;

      font-size: 11px;

      line-height: 1.7;

    }


    .financial {

      display: grid;

      grid-template-columns:
        repeat(3,1fr);

      gap: 14px;

    }


    .money-card {

      padding: 21px;

    }


    .money-label {

      color: #8795aa;

      font-size: 11px;

      margin-bottom: 10px;

    }


    .money-value {

      font-size: 21px;

      font-weight: 700;

    }


    .money-unit {

      color: #7f8da2;

      font-size: 10px;

      margin-top: 7px;

    }


    .tabs {

      display: flex;

      gap: 8px;

      overflow-x: auto;

      padding-bottom: 5px;

      margin-bottom: 14px;

    }


    .tabs::-webkit-scrollbar {

      display: none;

    }


    .tab {

      flex: 0 0 auto;

      border: 0;

      color: #93a0b2;

      background:
        rgba(255,255,255,.045);

      border:
        1px solid
        rgba(255,255,255,.07);

      border-radius: 999px;

      padding: 10px 16px;

      cursor: pointer;

      font-size: 11px;

    }


    .tab.active {

      color: #fff;

      background:

        linear-gradient(
          135deg,
          rgba(43,126,255,.28),
          rgba(197,165,72,.14)
        );

      border-color:
        rgba(84,146,255,.28);

    }


    .search {

      width: 100%;

      padding: 14px 17px;

      margin-bottom: 12px;

      border-radius: 17px;

      outline: none;

      color: #fff;

      background:
        rgba(255,255,255,.045);

      border:
        1px solid
        rgba(255,255,255,.08);

    }


    .search::placeholder {

      color: #66758b;

    }


    .list {

      display: grid;

      gap: 11px;

    }


    .item {

      padding: 17px;

    }


    .item-top {

      display: flex;

      justify-content: space-between;

      gap: 12px;

      align-items: flex-start;

    }


    .item-title {

      font-size: 13px;

      font-weight: 700;

    }


    .item-sub {

      margin-top: 6px;

      color: #7e8ca1;

      font-size: 10px;

      line-height: 1.8;

    }


    .badge {

      flex: 0 0 auto;

      padding: 5px 9px;

      border-radius: 999px;

      font-size: 9px;

      white-space: nowrap;

    }


    .badge-green {

      color: #83e1b5;

      background:
        rgba(47,196,126,.09);

      border:
        1px solid
        rgba(47,196,126,.16);

    }


    .badge-blue {

      color: #83b6ff;

      background:
        rgba(56,128,255,.10);

      border:
        1px solid
        rgba(56,128,255,.17);

    }


    .badge-gold {

      color: #dec778;

      background:
        rgba(203,171,72,.09);

      border:
        1px solid
        rgba(203,171,72,.17);

    }


    .badge-red {

      color: #ff9d9d;

      background:
        rgba(255,86,86,.08);

      border:
        1px solid
        rgba(255,86,86,.15);

    }


    .empty {

      padding: 35px;

      text-align: center;

      color: #758398;

      font-size: 12px;

    }


    .loading {

      min-height: 100vh;

      display: flex;

      align-items: center;

      justify-content: center;

      padding: 25px;

    }


    .loading-box {

      width: 100%;

      max-width: 420px;

      padding: 30px;

      text-align: center;

    }


    .spinner {

      width: 42px;
      height: 42px;

      border-radius: 50%;

      border:
        3px solid
        rgba(255,255,255,.10);

      border-top-color:
        #5d9bff;

      animation:
        spin .8s linear infinite;

      margin:
        0 auto 18px;

    }


    @keyframes spin {

      to {
        transform: rotate(360deg);
      }

    }


    .error-box {

      width: 100%;

      max-width: 650px;

      padding: 25px;

    }


    .error-title {

      color: #ffb0b0;

      font-size: 16px;

      margin-bottom: 13px;

    }


    .error-text {

      color: #a7b1c0;

      font-size: 12px;

      line-height: 2;

      white-space: pre-wrap;

      word-break: break-word;

      direction: ltr;

      text-align: left;

      background:
        rgba(0,0,0,.18);

      padding: 13px;

      border-radius: 12px;

    }


    .retry {

      margin-top: 16px;

      border: 0;

      padding: 11px 18px;

      border-radius: 12px;

      color: white;

      background:

        linear-gradient(
          135deg,
          #287cf0,
          #3d65c9
        );

      cursor: pointer;

    }


    .footer {

      text-align: center;

      color: #56667c;

      font-size: 9px;

      padding: 10px;

    }


    @media (max-width:800px) {

      .stats {

        grid-template-columns:
          repeat(2,1fr);

      }


      .overview {

        grid-template-columns:
          1fr;

      }


      .financial {

        grid-template-columns:
          1fr;

      }

    }


    @media (max-width:480px) {

      .app {

        padding: 11px;

      }


      .stats {

        gap: 9px;

      }


      .stat {

        padding: 15px;

      }


      .hero-value {

        font-size: 29px;

      }


      .circle {

        width: 75px;
        height: 75px;

        flex-basis: 75px;

      }


      .circle::before {

        width: 55px;
        height: 55px;

      }

    }

  </style>

</head>


<body>


  <div id="root">

    <div class="loading">

      <div class="glass loading-box">

        <div class="spinner"></div>

        <div>
          در حال اتصال به داشبورد حسابگران آرمان...
        </div>

      </div>

    </div>

  </div>



  <script>

    /* =================================================
       API CONFIG
    ================================================= */

    const API_URL =
      'https://script.google.com/macros/s/AKfycbzK62xIUIm8VyTektiy9EKOZBnMeXb1bxIKtcCxKfABIYFezMNEH6yfcrWAeL34zmI/exec';


    const API_KEY =
      'HesabgaranArman_2026_Bot_7xK9pQ2';


    /* =================================================
       TELEGRAM
    ================================================= */

    const tg =
      window.Telegram &&
      window.Telegram.WebApp
        ? window.Telegram.WebApp
        : null;


    if (tg) {

      try {

        tg.ready();

        tg.expand();

        tg.setHeaderColor(
          '#07101d'
        );

        tg.setBackgroundColor(
          '#07101d'
        );

      } catch (error) {

        console.warn(
          'Telegram WebApp setup:',
          error
        );

      }

    }


    /* =================================================
       HELPERS
    ================================================= */

    function escapeHtml(value) {

      if (
        value === null ||
        value === undefined
      ) {

        return '';

      }


      return String(value)

        .replace(
          /&/g,
          '&amp;'
        )

        .replace(
          /</g,
          '&lt;'
        )

        .replace(
          />/g,
          '&gt;'
        )

        .replace(
          /"/g,
          '&quot;'
        )

        .replace(
          /'/g,
          '&#039;'
        );

    }


    function formatMoney(value) {

      const number =
        Number(value || 0);


      return number.toLocaleString(
        'fa-IR'
      );

    }


    function formatDate(value) {

      if (!value) {
        return '—';
      }


      return String(value);

    }


    function getPercent(
      value,
      total
    ) {

      if (!total) {
        return 0;
      }


      return Math.max(
        0,
        Math.min(
          100,
          Math.round(
            (value / total) * 100
          )
        )
      );

    }


    function statusClass(status) {

      const value =
        String(status || '');


      if (

        value.includes(
          'انجام شده'
        ) ||

        value.includes(
          'فعال'
        ) ||

        value.includes(
          'دریافت شده'
        )

      ) {

        return 'badge-green';

      }


      if (

        value.includes(
          'در حال انجام'
        ) ||

        value.includes(
          'امروز'
        )

      ) {

        return 'badge-blue';

      }


      if (

        value.includes(
          'فوری'
        ) ||

        value.includes(
          'تا ۳ روز'
        )

      ) {

        return 'badge-red';

      }


      return 'badge-gold';

    }


    /* =================================================
       ERROR
    ================================================= */

    function showError(error) {

      console.error(
        'Dashboard error:',
        error
      );


      const message =
        error &&
        error.message

          ? error.message

          : String(
              error ||
              'خطای نامشخص'
            );


      document.getElementById(
        'root'
      ).innerHTML = `

        <div class="loading">

          <div class="glass error-box">

            <div class="error-title">
              ⚠️ خطا در دریافت اطلاعات داشبورد
            </div>

            <div class="error-text">
              ${escapeHtml(message)}
            </div>

            <button
              class="retry"
              onclick="loadDashboard()"
            >
              تلاش مجدد
            </button>

          </div>

        </div>

      `;

    }


    /* =================================================
       LOAD DASHBOARD
    ================================================= */

    async function loadDashboard() {

      try {

        /*
         * Telegram initData
         */
        const initData =
          tg &&
          tg.initData
            ? tg.initData
            : '';


        if (!initData) {

          throw new Error(
            'Telegram initData دریافت نشد. لطفاً داشبورد را از داخل ربات Telegram باز کنید.'
          );

        }


        /*
         * API URL
         */
        const url =
          API_URL +

          '?action=getDashboard' +

          '&key=' +
          encodeURIComponent(
            API_KEY
          ) +

          '&initData=' +
          encodeURIComponent(
            initData
          ) +

          '&_=' +
          Date.now();


        console.log(
          'Dashboard request started.'
        );


        /*
         * Request
         */
        const response =
          await fetch(
            url,
            {
              method:
                'GET',

              cache:
                'no-store'
            }
          );


        /*
         * Always read raw text first.
         * This makes debugging much easier.
         */
        const raw =
          await response.text();


        console.log(
          'API RAW RESPONSE:',
          raw
        );


        if (!response.ok) {

          throw new Error(
            'HTTP ' +
            response.status +
            '\n' +
            raw
          );

        }


        /*
         * Parse JSON
         */
        let result;


        try {

          result =
            JSON.parse(
              raw
            );

        } catch (error) {

          throw new Error(
            'پاسخ سرور JSON معتبر نیست.\n\n' +
            raw
          );

        }


        if (!result) {

          throw new Error(
            'پاسخ خالی از سرور دریافت شد.'
          );

        }


        if (!result.ok) {

          throw new Error(
            result.error ||
            'سرور درخواست را رد کرد.'
          );

        }


        if (!result.data) {

          throw new Error(
            'پاسخ سرور دریافت شد اما data وجود ندارد.'
          );

        }


        /*
         * Validate
         */
        validateDashboard(
          result.data
        );


        console.log(
          'Dashboard data:',
          result.data
        );


        /*
         * Render
         */
        renderDashboard(
          result.data,
          result.user
        );


      } catch (error) {

        showError(
          error
        );

      }

    }


    /* =================================================
       VALIDATE DASHBOARD
    ================================================= */

    function validateDashboard(
      data
    ) {

      if (
        !data.Summary ||
        typeof data.Summary !== 'object'
      ) {

        throw new Error(
          'ساختار Summary در داده‌ها پیدا نشد.'
        );

      }


      const arrays = [

        'Clients',

        'Accounting',

        'Tax',

        'Receivables'

      ];


      arrays.forEach(
        function(key) {

          if (
            !Array.isArray(
              data[key]
            )
          ) {

            throw new Error(
              'بخش ' +
              key +
              ' در داده‌های داشبورد وجود ندارد.'
            );

          }

        }
      );

    }


    /* =================================================
       RENDER DASHBOARD
    ================================================= */

    function renderDashboard(
      data,
      user
    ) {

      const summary =
        data.Summary;


      const clients =
        data.Clients || [];


      const accounting =
        data.Accounting || [];


      const tax =
        data.Tax || [];


      const receivables =
        data.Receivables || [];


      const totalReceivables =
        Number(
          summary.TotalReceivables || 0
        );


      const totalCollected =
        Number(
          summary.TotalCollected || 0
        );


      const remaining =
        Number(
          summary.RemainingReceivables || 0
        );


      const collectionPercent =
        getPercent(
          totalCollected,
          totalReceivables
        );


      const accountingDone =
        Number(
          summary.AccountingCompleted || 0
        );


      const accountingTotal =
        Number(
          summary.AccountingCount || 0
        );


      const accountingPercent =
        getPercent(
          accountingDone,
          accountingTotal
        );


      const taxDone =
        Number(
          summary.TaxCompleted || 0
        );


      const taxTotal =
        Number(
          summary.TaxCount || 0
        );


      const taxPercent =
        getPercent(
          taxDone,
          taxTotal
        );


      const userName =
        user &&
        user.first_name

          ? user.first_name

          : 'مدیر';


      document.getElementById(
        'root'
      ).innerHTML = `

        <div class="app">


          <!-- HEADER -->

          <div class="glass header">

            <div class="brand">

              <div class="logo">
                📊
              </div>

              <div>

                <h1>
                  حسابگران آرمان
                </h1>

                <p>
                  داشبورد مدیریت مالی، حسابداری و مالیاتی
                </p>

              </div>

            </div>


            <div class="status">

              <span class="status-dot"></span>

              اتصال امن برقرار است

            </div>

          </div>


          <!-- HERO -->

          <div class="glass hero">

            <div class="hero-title">
              خوش آمدید، ${escapeHtml(
                userName
              )}
            </div>


            <div class="hero-value">

              ${formatMoney(
                remaining
              )}

              <span
                style="
                  font-size:12px;
                  color:#7f8da2;
                  font-weight:normal;
                "
              >
                تومان
              </span>

            </div>


            <div class="hero-sub">
              مانده مطالبات قابل وصول
            </div>

          </div>


          <!-- STATS -->

          <div class="stats">


            <div class="glass stat">

              <div class="stat-icon">
                👥
              </div>

              <div class="stat-label">
                مشتریان
              </div>

              <div class="stat-value">
                ${formatMoney(
                  summary.ClientsCount
                )}
              </div>

            </div>


            <div class="glass stat">

              <div class="stat-icon">
                📒
              </div>

              <div class="stat-label">
                کارهای حسابداری
              </div>

              <div class="stat-value">
                ${formatMoney(
                  summary.AccountingCount
                )}
              </div>

            </div>


            <div class="glass stat">

              <div class="stat-icon">
                ⚖️
              </div>

              <div class="stat-label">
                پرونده‌های مالیاتی
              </div>

              <div class="stat-value">
                ${formatMoney(
                  summary.TaxCount
                )}
              </div>

            </div>


            <div class="glass stat">

              <div class="stat-icon">
                💰
              </div>

              <div class="stat-label">
                کل دریافتنی
              </div>

              <div class="stat-value">
                ${formatMoney(
                  totalReceivables
                )}
              </div>

            </div>


          </div>


          <!-- OVERVIEW -->

          <div class="section">

            <div class="section-head">

              <h2>
                نمای کلی
              </h2>

              <span>
                وضعیت فعلی
              </span>

            </div>


            <div class="overview">


              <div class="glass overview-card">

                <div class="circle-wrap">


                  <div
                    class="circle"
                    style="
                      --percent:${collectionPercent * 3.6}deg;
                    "
                  >

                    <div class="circle-value">
                      ${collectionPercent}٪
                    </div>

                  </div>


                  <div class="circle-text">

                    <h3>
                      وصول مطالبات
                    </h3>

                    <p>

                      دریافت شده:
                      ${formatMoney(
                        totalCollected
                      )}
                      تومان

                      <br>

                      مانده:
                      ${formatMoney(
                        remaining
                      )}
                      تومان

                    </p>

                  </div>


                </div>

              </div>


              <div class="glass overview-card">

                <div class="circle-wrap">


                  <div
                    class="circle"
                    style="
                      --percent:${accountingPercent * 3.6}deg;
                    "
                  >

                    <div class="circle-value">
                      ${accountingPercent}٪
                    </div>

                  </div>


                  <div class="circle-text">

                    <h3>
                      حسابداری
                    </h3>

                    <p>

                      انجام شده:
                      ${accountingDone}
                      از
                      ${accountingTotal}

                      <br>

                      در حال انجام:
                      ${Math.max(
                        0,
                        accountingTotal -
                        accountingDone
                      )}

                    </p>

                  </div>


                </div>

              </div>


              <div class="glass overview-card">

                <div class="circle-wrap">


                  <div
                    class="circle"
                    style="
                      --percent:${taxPercent * 3.6}deg;
                    "
                  >

                    <div class="circle-value">
                      ${taxPercent}٪
                    </div>

                  </div>


                  <div class="circle-text">

                    <h3>
                      مالیاتی
                    </h3>

                    <p>

                      انجام شده:
                      ${taxDone}
                      از
                      ${taxTotal}

                      <br>

                      در حال انجام:
                      ${Math.max(
                        0,
                        taxTotal -
                        taxDone
                      )}

                    </p>

                  </div>


                </div>

              </div>


            </div>

          </div>


          <!-- FINANCIAL -->

          <div class="section">

            <div class="section-head">

              <h2>
                وضعیت مالی
              </h2>

              <span>
                تومان
              </span>

            </div>


            <div class="financial">


              <div class="glass money-card">

                <div class="money-label">
                  کل دریافتنی
                </div>

                <div class="money-value">
                  ${formatMoney(
                    totalReceivables
                  )}
                </div>

                <div class="money-unit">
                  مجموع مطالبات
                </div>

              </div>


              <div class="glass money-card">

                <div class="money-label">
                  دریافت شده
                </div>

                <div class="money-value">
                  ${formatMoney(
                    totalCollected
                  )}
                </div>

                <div class="money-unit">
                  وصول شده
                </div>

              </div>


              <div class="glass money-card">

                <div class="money-label">
                  مانده
                </div>

                <div class="money-value">
                  ${formatMoney(
                    remaining
                  )}
                </div>

                <div class="money-unit">
                  قابل وصول
                </div>

              </div>


            </div>

          </div>


          <!-- WORK -->

          <div class="section">

            <div class="section-head">

              <h2>
                کارها و پرونده‌ها
              </h2>

              <span>
                ${accounting.length + tax.length}
                مورد
              </span>

            </div>


            <input
              id="searchInput"
              class="search"
              type="search"
              placeholder="🔎 جستجوی مشتری، پرونده یا کار..."
              oninput="filterItems()"
            >


            <div class="tabs">


              <button
                class="tab active"
                data-tab="all"
                onclick="setTab('all', this)"
              >
                همه
              </button>


              <button
                class="tab"
                data-tab="accounting"
                onclick="setTab('accounting', this)"
              >
                حسابداری
              </button>


              <button
                class="tab"
                data-tab="tax"
                onclick="setTab('tax', this)"
              >
                مالیاتی
              </button>


              <button
                class="tab"
                data-tab="clients"
                onclick="setTab('clients', this)"
              >
                مشتریان
              </button>


            </div>


            <div
              id="itemsList"
              class="list"
            ></div>


          </div>


          <div class="footer">
            حسابگران آرمان • داشبورد مدیریت
          </div>


        </div>

      `;


      window.dashboardState = {

        data:
          data,

        activeTab:
          'all'

      };


      renderItems();

    }


    /* =================================================
       TAB
    ================================================= */

    function setTab(
      tab,
      button
    ) {

      window.dashboardState.activeTab =
        tab;


      document
        .querySelectorAll(
          '.tab'
        )
        .forEach(
          function(item) {

            item.classList.remove(
              'active'
            );

          }
        );


      if (button) {

        button.classList.add(
          'active'
        );

      }


      renderItems();

    }


    /* =================================================
       SEARCH
    ================================================= */

    function filterItems() {

      renderItems();

    }


    /* =================================================
       RENDER ITEMS
    ================================================= */

    function renderItems() {

      const state =
        window.dashboardState;


      if (!state) {
        return;
      }


      const data =
        state.data;


      const tab =
        state.activeTab;


      const searchElement =
        document.getElementById(
          'searchInput'
        );


      const search =
        searchElement

          ? searchElement.value
              .trim()
              .toLowerCase()

          : '';


      let items = [];


      /*
       * Accounting
       */
      if (
        tab === 'all' ||
        tab === 'accounting'
      ) {

        data.Accounting
          .forEach(
            function(item) {

              items.push({

                type:
                  'accounting',

                title:
                  item[
                    'نام مراجعه کننده'
                  ],

                sub:
                  '📒 ' +
                  (
                    item[
                      'نوع کار'
                    ] || ''
                  ) +
                  ' • ' +
                  (
                    item[
                      'شرح کار'
                    ] || ''
                  ),

                status:
                  item[
                    'وضعیت'
                  ] ||
                  'نامشخص',

                extra:
                  'سررسید: ' +
                  formatDate(
                    item[
                      'تاریخ سررسید'
                    ]
                  )

              });

            }
          );

      }


      /*
       * Tax
       */
      if (
        tab === 'all' ||
        tab === 'tax'
      ) {

        data.Tax
          .forEach(
            function(item) {

              items.push({

                type:
                  'tax',

                title:
                  item[
                    'نام مراجعه کننده'
                  ],

                sub:
                  '⚖️ ' +
                  (
                    item[
                      'نوع پرونده'
                    ] || ''
                  ) +
                  ' • ' +
                  (
                    item[
                      'مرحله پرونده'
                    ] || ''
                  ),

                status:
                  item[
                    'وضعیت'
                  ] ||
                  'نامشخص',

                extra:
                  'سررسید: ' +
                  formatDate(
                    item[
                      'تاریخ سررسید'
                    ]
                  )

              });

            }
          );

      }


      /*
       * Clients
       */
      if (
        tab === 'clients'
      ) {

        data.Clients
          .forEach(
            function(item) {

              items.push({

                type:
                  'client',

                title:
                  item[
                    'نام شخص/شرکت'
                  ],

                sub:
                  '👤 ' +
                  (
                    item[
                      'نوع شخصیت'
                    ] || ''
                  ) +
                  ' • ' +
                  (
                    item[
                      'نوع فعالیت'
                    ] || ''
                  ) +
                  ' • ' +
                  (
                    item[
                      'نوع خدمات'
                    ] || ''
                  ),

                status:
                  item[
                    'وضعیت همکاری'
                  ] ||
                  'نامشخص',

                extra:
                  item[
                    'شهر'
                  ]
                    ? '📍 ' +
                      item[
                        'شهر'
                      ]
                    : ''

              });

            }
          );

      }


      /*
       * Search
       */
      if (search) {

        items =
          items.filter(
            function(item) {

              const text =

                (
                  item.title +
                  ' ' +
                  item.sub +
                  ' ' +
                  item.status +
                  ' ' +
                  item.extra
                )
                .toLowerCase();


              return text.includes(
                search
              );

            }
          );

      }


      const list =
        document.getElementById(
          'itemsList'
        );


      if (!list) {
        return;
      }


      if (!items.length) {

        list.innerHTML = `

          <div class="glass empty">

            موردی برای نمایش وجود ندارد.

          </div>

        `;

        return;

      }


      list.innerHTML =

        items
          .map(
            function(item) {

              const badge =

                item.type ===
                'accounting'

                  ? '📒 حسابداری'

                  : item.type === 'tax'

                    ? '⚖️ مالیاتی'

                    : '👤 مشتری';


              return `

                <div class="glass item">

                  <div class="item-top">

                    <div>

                      <div class="item-title">

                        ${escapeHtml(
                          item.title
                        )}

                      </div>


                      <div class="item-sub">

                        ${escapeHtml(
                          item.sub
                        )}

                        <br>

                        ${escapeHtml(
                          item.extra
                        )}

                      </div>

                    </div>


                    <div
                      class="badge ${statusClass(
                        item.status
                      )}"
                    >

                      ${escapeHtml(
                        item.status
                      )}

                    </div>

                  </div>


                  <div
                    style="
                      margin-top:11px;
                      color:#66758b;
                      font-size:9px;
                    "
                  >

                    ${badge}

                  </div>


                </div>

              `;

            }
          )
          .join('');

    }


    /* =================================================
       START
    ================================================= */

    loadDashboard();

  </script>

</body>

</html>
