<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>حسابگران آرمان</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

/* =========================================================
   BASE
   ========================================================= */

:root{
    --bg:#071522;
    --bg2:#0b1c2d;

    --card:rgba(24,65,105,.30);
    --card2:rgba(31,84,135,.36);

    --border:rgba(119,180,239,.18);

    --blue:#3b82f6;
    --blue2:#2563eb;
    --azure:#38bdf8;

    --olive:#8f9f4d;
    --gold:#d8b86c;

    --green:#4ade80;
    --red:#fb7185;
    --orange:#fb923c;

    --text:#f5f9ff;
    --muted:#9eb1c5;

    --radius:22px;
}

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;

    background:
        radial-gradient(
            circle at 8% 5%,
            rgba(37,99,235,.19),
            transparent 27%
        ),
        radial-gradient(
            circle at 92% 15%,
            rgba(56,189,248,.12),
            transparent 28%
        ),
        radial-gradient(
            circle at 50% 100%,
            rgba(214,184,108,.075),
            transparent 35%
        ),
        linear-gradient(
            145deg,
            #06121e,
            #091a2b 48%,
            #071522
        );

    color:var(--text);

    font-family:
        Tahoma,
        Arial,
        sans-serif;
}

body{
    overflow-x:hidden;
}

button,
input{
    font:inherit;
}

button{
    cursor:pointer;
}


/* =========================================================
   APP
   ========================================================= */

.app{
    width:min(1450px,100%);
    margin:auto;
    padding:22px;
}


/* =========================================================
   HEADER
   ========================================================= */

.header{
    position:relative;
    overflow:hidden;

    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:20px;

    padding:19px 23px;
    margin-bottom:20px;

    background:
        linear-gradient(
            135deg,
            rgba(37,99,235,.17),
            rgba(31,84,135,.10),
            rgba(255,255,255,.035)
        );

    border:1px solid var(--border);

    border-radius:28px;

    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);

    box-shadow:
        0 20px 60px rgba(0,0,0,.27),
        inset 0 1px rgba(255,255,255,.07);
}

.header::before{
    content:"";

    position:absolute;

    width:300px;
    height:300px;

    right:-110px;
    top:-170px;

    background:
        radial-gradient(
            circle,
            rgba(59,130,246,.25),
            transparent 68%
        );

    pointer-events:none;
}

.header::after{
    content:"";

    position:absolute;

    width:180px;
    height:180px;

    left:-80px;
    bottom:-120px;

    background:
        radial-gradient(
            circle,
            rgba(214,184,108,.11),
            transparent 70%
        );

    pointer-events:none;
}

.brand{
    position:relative;
    z-index:2;

    display:flex;
    align-items:center;

    gap:15px;
}

.logo{
    width:54px;
    height:54px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:17px;

    background:
        linear-gradient(
            145deg,
            rgba(59,130,246,.23),
            rgba(56,189,248,.09),
            rgba(214,184,108,.10)
        );

    border:1px solid rgba(120,184,240,.20);

    box-shadow:
        0 0 30px rgba(37,99,235,.16),
        inset 0 1px rgba(255,255,255,.10);

    font-size:24px;
}

.brand h1{
    margin:0;

    font-family:
        "Noto Nastaliq Urdu",
        "IranNastaliq",
        serif;

    font-size:27px;
    font-weight:600;
    line-height:1.7;

    color:#f8fbff;

    text-shadow:
        0 2px 15px rgba(37,99,235,.25);
}

.header-status{
    position:relative;
    z-index:2;

    display:flex;
    align-items:center;

    gap:8px;

    color:#b9cadb;
    font-size:12px;
}

.status-dot{
    width:9px;
    height:9px;

    border-radius:50%;

    background:var(--green);

    box-shadow:
        0 0 12px rgba(74,222,128,.75);
}


/* =========================================================
   HERO
   فقط Orb — هیچ عنوان یا زیرعنوانی ندارد
   ========================================================= */

.hero{
    position:relative;

    display:flex;
    align-items:center;
    justify-content:center;

    min-height:245px;

    margin-bottom:20px;

    overflow:hidden;

    background:
        linear-gradient(
            135deg,
            rgba(31,84,135,.30),
            rgba(19,52,83,.20),
            rgba(255,255,255,.035)
        );

    border:1px solid var(--border);

    border-radius:var(--radius);

    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);

    box-shadow:
        0 20px 60px rgba(0,0,0,.23),
        inset 0 1px rgba(255,255,255,.055);
}

.hero::before{
    content:"";

    position:absolute;

    width:520px;
    height:520px;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    background:
        radial-gradient(
            circle,
            rgba(37,99,235,.10),
            transparent 67%
        );

    pointer-events:none;
}


/* =========================================================
   ORB
   ========================================================= */

.active-orb-wrap{
    position:relative;

    width:205px;
    height:205px;

    display:flex;
    align-items:center;
    justify-content:center;

    z-index:2;
}


/* بزرگ‌ترین هاله */

.active-orb-aura{
    position:absolute;

    inset:-45px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(56,189,248,.24),
            rgba(37,99,235,.10) 38%,
            transparent 70%
        );

    filter:blur(19px);

    animation:
        auraPulse 6s ease-in-out infinite,
        auraColor 22s ease-in-out infinite;

    pointer-events:none;
}


/* حلقه بیرونی */

.active-orb-ring{
    position:absolute;

    inset:2px;

    border-radius:50%;

    border:
        1px solid rgba(112,192,255,.20);

    box-shadow:
        0 0 28px rgba(37,99,235,.13);

    animation:
        ringRotate 18s linear infinite;
}


/* حلقه دوم بسیار ظریف */

.active-orb-ring::before{
    content:"";

    position:absolute;

    inset:13px;

    border-radius:50%;

    border:
        1px dashed rgba(123,198,255,.13);

    animation:
        ringRotateReverse 24s linear infinite;
}


/* خود گوی */

.active-orb{
    position:relative;

    width:154px;
    height:154px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    overflow:hidden;

    background:
        radial-gradient(
            circle at 30% 21%,
            rgba(255,255,255,.72) 0%,
            rgba(255,255,255,.18) 7%,
            transparent 22%
        ),
        radial-gradient(
            circle at 53% 53%,
            #42b7ff 0%,
            #2478df 33%,
            #1450b6 63%,
            #071f57 100%
        );

    border:
        1px solid rgba(180,228,255,.46);

    box-shadow:
        inset -20px -24px 37px rgba(0,0,0,.38),
        inset 12px 10px 28px rgba(255,255,255,.17),

        0 0 28px rgba(40,151,255,.34),
        0 0 55px rgba(40,151,255,.20),
        0 0 90px rgba(40,151,255,.11);

    animation:
        orbFloat 5.5s ease-in-out infinite,
        orbColor 22s ease-in-out infinite;

    transition:
        transform .45s ease,
        box-shadow .45s ease;

    z-index:3;
}


/* لایه چرخان روی گوی */

.active-orb::before{
    content:"";

    position:absolute;

    width:200%;
    height:200%;

    left:-100%;
    top:-100%;

    border-radius:50%;

    background:
        conic-gradient(
            from 0deg,

            transparent 0deg,

            rgba(255,255,255,.08) 42deg,

            transparent 90deg,

            rgba(255,255,255,.035) 165deg,

            transparent 220deg,

            rgba(255,255,255,.07) 315deg,

            transparent 360deg
        );

    animation:
        orbSurface 16s linear infinite;

    pointer-events:none;
}


/* نور داخلی */

.active-orb::after{
    content:"";

    position:absolute;

    inset:10px;

    border-radius:50%;

    background:
        radial-gradient(
            circle at 38% 31%,
            rgba(255,255,255,.13),
            transparent 48%
        );

    pointer-events:none;
}


/* انعکاس شیشه‌ای */

.orb-highlight{
    position:absolute;

    width:49px;
    height:24px;

    top:20px;
    left:29px;

    border-radius:50%;

    background:
        rgba(255,255,255,.29);

    filter:blur(5px);

    transform:rotate(-28deg);

    opacity:.80;

    z-index:5;
}


/* محتوای داخل */

.orb-content{
    position:relative;

    z-index:10;

    display:flex;
    flex-direction:column;
    align-items:center;

    text-align:center;

    text-shadow:
        0 2px 12px rgba(0,0,0,.50);
}

.orb-number{
    font-family:
        Arial,
        Tahoma,
        sans-serif;

    font-size:42px;

    line-height:1;

    font-weight:900;

    color:#fff;

    letter-spacing:-1px;
}

.orb-label{
    margin-top:9px;

    color:
        rgba(255,255,255,.92);

    font-size:11px;

    font-weight:500;
}


/* نقاط نور اطراف Orb */

.orb-particle{
    position:absolute;

    width:5px;
    height:5px;

    border-radius:50%;

    background:#8bd8ff;

    box-shadow:
        0 0 10px #38bdf8,
        0 0 20px rgba(56,189,248,.6);

    z-index:4;

    animation:
        particlePulse 3s ease-in-out infinite;
}

.p1{
    top:17px;
    right:45px;
}

.p2{
    bottom:27px;
    left:34px;

    animation-delay:1.2s;
}

.p3{
    top:84px;
    right:4px;

    width:4px;
    height:4px;

    animation-delay:2s;
}


/* =========================================================
   ORB ANIMATIONS
   ========================================================= */

@keyframes orbFloat{

    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-6px);
    }
}

@keyframes orbSurface{

    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(360deg);
    }
}

@keyframes ringRotate{

    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(360deg);
    }
}

@keyframes ringRotateReverse{

    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(-360deg);
    }
}

@keyframes auraPulse{

    0%,100%{
        transform:scale(.88);
        opacity:.43;
    }

    50%{
        transform:scale(1.10);
        opacity:.86;
    }
}


/*
   تغییر رنگ بسیار آهسته و ظریف:
   آبی → فیروزه‌ای → آبی-بنفش → آبی
*/

@keyframes orbColor{

    0%{
        filter:
            hue-rotate(0deg)
            saturate(1);
    }

    20%{
        filter:
            hue-rotate(9deg)
            saturate(1.03);
    }

    40%{
        filter:
            hue-rotate(19deg)
            saturate(1.05);
    }

    60%{
        filter:
            hue-rotate(-7deg)
            saturate(1.02);
    }

    80%{
        filter:
            hue-rotate(-15deg)
            saturate(1.04);
    }

    100%{
        filter:
            hue-rotate(0deg)
            saturate(1);
    }
}

@keyframes auraColor{

    0%{
        filter:
            hue-rotate(0deg)
            blur(19px);
    }

    25%{
        filter:
            hue-rotate(12deg)
            blur(20px);
    }

    50%{
        filter:
            hue-rotate(20deg)
            blur(19px);
    }

    75%{
        filter:
            hue-rotate(-10deg)
            blur(20px);
    }

    100%{
        filter:
            hue-rotate(0deg)
            blur(19px);
    }
}

@keyframes particlePulse{

    0%,100%{
        opacity:.30;
        transform:scale(.8);
    }

    50%{
        opacity:1;
        transform:scale(1.3);
    }
}

.active-orb-wrap:hover .active-orb{

    transform:
        translateY(-5px)
        scale(1.045);

    box-shadow:
        inset -20px -24px 37px rgba(0,0,0,.38),
        inset 12px 10px 28px rgba(255,255,255,.19),

        0 0 40px rgba(40,151,255,.48),
        0 0 75px rgba(40,151,255,.28),
        0 0 110px rgba(40,151,255,.15);
}


/* =========================================================
   STATS
   ========================================================= */

.stats{
    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:14px;

    margin-bottom:20px;
}

.stat{
    position:relative;
    overflow:hidden;

    padding:20px;

    background:
        linear-gradient(
            145deg,
            rgba(27,78,126,.29),
            rgba(20,55,90,.19)
        );

    border:1px solid var(--border);

    border-radius:20px;

    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);

    box-shadow:
        inset 0 1px rgba(255,255,255,.045);

    transition:
        transform .25s ease,
        border-color .25s ease,
        box-shadow .25s ease;
}

.stat:hover{
    transform:translateY(-3px);

    border-color:
        rgba(59,130,246,.35);

    box-shadow:
        0 15px 35px rgba(0,0,0,.17),
        0 0 25px rgba(37,99,235,.07);
}

.stat-label{
    color:#9eb1c5;
    font-size:11px;
}

.stat-value{
    margin-top:9px;

    font-size:25px;

    font-weight:900;

    color:#f2f7fc;
}

.stat-note{
    margin-top:5px;

    color:#70869d;

    font-size:10px;
}


/* =========================================================
   TOOLBAR
   ========================================================= */

.toolbar{
    display:flex;

    gap:12px;

    margin-bottom:18px;
}

.search{
    flex:1;

    height:48px;

    padding:0 17px;

    color:#f3f8ff;

    background:
        linear-gradient(
            135deg,
            rgba(31,84,135,.27),
            rgba(255,255,255,.035)
        );

    border:1px solid var(--border);

    border-radius:16px;

    outline:none;

    backdrop-filter:blur(14px);
}

.search::placeholder{
    color:#6f8499;
}

.search:focus{
    border-color:
        rgba(59,130,246,.45);

    box-shadow:
        0 0 25px rgba(37,99,235,.10);
}


/* =========================================================
   TABS
   ========================================================= */

.tabs{
    display:flex;

    gap:8px;

    overflow-x:auto;

    padding-bottom:3px;
}

.tab{
    flex:0 0 auto;

    padding:11px 17px;

    border:1px solid var(--border);

    border-radius:13px;

    background:
        rgba(255,255,255,.035);

    color:#8fa5ba;

    transition:.22s;
}

.tab:hover{
    color:#dcecff;

    border-color:
        rgba(59,130,246,.28);
}

.tab.active{
    color:white;

    border-color:
        rgba(59,130,246,.42);

    background:
        linear-gradient(
            135deg,
            rgba(37,99,235,.29),
            rgba(56,189,248,.11)
        );

    box-shadow:
        0 0 25px rgba(37,99,235,.11),
        inset 0 1px rgba(255,255,255,.07);
}


/* =========================================================
   SECTION
   ========================================================= */

.section{
    margin-bottom:20px;
}

.section-title{
    display:flex;

    align-items:center;
    justify-content:space-between;

    margin-bottom:13px;

    font-size:17px;
    font-weight:800;
}

.section-title span{
    color:#8298ad;

    font-size:11px;

    font-weight:normal;
}


/* =========================================================
   CARDS
   ========================================================= */

.items{
    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:13px;
}

.card{
    position:relative;
    overflow:hidden;

    padding:18px;

    background:
        linear-gradient(
            145deg,
            rgba(31,84,135,.28),
            rgba(16,48,79,.19),
            rgba(255,255,255,.025)
        );

    border:1px solid var(--border);

    border-radius:19px;

    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);

    box-shadow:
        inset 0 1px rgba(255,255,255,.04);

    transition:
        transform .22s ease,
        border-color .22s ease,
        box-shadow .22s ease;
}

.card:hover{
    transform:translateY(-2px);

    border-color:
        rgba(59,130,246,.30);

    box-shadow:
        0 15px 35px rgba(0,0,0,.16);
}

.card-head{
    display:flex;

    align-items:flex-start;
    justify-content:space-between;

    gap:12px;

    margin-bottom:12px;
}

.card-title{
    font-weight:800;
    font-size:14px;
}

.card-subtitle{
    color:#8298ad;

    font-size:11px;

    margin-top:5px;
}

.card-row{
    display:flex;

    justify-content:space-between;

    gap:10px;

    padding:7px 0;

    border-bottom:
        1px solid rgba(255,255,255,.045);

    font-size:11px;
}

.card-row:last-child{
    border-bottom:0;
}

.card-row span:first-child{
    color:#71879d;
}

.card-row span:last-child{
    color:#d9e7f4;

    text-align:left;
}


/* =========================================================
   BADGES
   ========================================================= */

.badge{
    display:inline-flex;

    align-items:center;
    justify-content:center;

    padding:5px 9px;

    border-radius:999px;

    font-size:10px;

    white-space:nowrap;

    border:1px solid rgba(255,255,255,.08);
}

.badge-urgent{
    color:#ffd3da;

    background:
        rgba(251,113,133,.12);

    border-color:
        rgba(251,113,133,.24);
}

.badge-high{
    color:#ffe0bd;

    background:
        rgba(251,146,60,.11);

    border-color:
        rgba(251,146,60,.22);
}

.badge-normal{
    color:#c9d7e5;

    background:
        rgba(255,255,255,.045);
}

.badge-done{
    color:#b9f7ce;

    background:
        rgba(74,222,128,.10);

    border-color:
        rgba(74,222,128,.20);
}


/* =========================================================
   URGENT
   ========================================================= */

.urgent-section{
    position:relative;
    overflow:hidden;

    margin-bottom:22px;

    padding:20px;

    border-radius:24px;

    background:
        linear-gradient(
            135deg,
            rgba(37,99,235,.11),
            rgba(251,113,133,.055),
            rgba(214,184,108,.035)
        );

    border:1px solid rgba(103,156,220,.20);

    box-shadow:
        0 20px 55px rgba(0,0,0,.19);
}

.urgent-section::before{
    content:"";

    position:absolute;

    width:260px;
    height:260px;

    top:-170px;
    right:-80px;

    background:
        radial-gradient(
            circle,
            rgba(59,130,246,.17),
            transparent 70%
        );

    pointer-events:none;
}

.urgent-header{
    position:relative;
    z-index:1;

    display:flex;

    align-items:center;
    justify-content:space-between;

    margin-bottom:15px;
}

.urgent-title-wrap{
    display:flex;

    align-items:center;

    gap:11px;
}

.urgent-icon{
    width:42px;
    height:42px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:13px;

    background:
        linear-gradient(
            135deg,
            rgba(37,99,235,.18),
            rgba(251,113,133,.10)
        );

    border:1px solid rgba(103,156,220,.20);

    font-size:18px;

    box-shadow:
        0 0 22px rgba(37,99,235,.09);
}

.urgent-title{
    font-size:16px;
    font-weight:900;
}

.urgent-subtitle{
    margin-top:4px;

    color:#8499ad;

    font-size:10px;
}

.urgent-count{
    min-width:35px;
    height:35px;

    display:flex;

    align-items:center;
    justify-content:center;

    padding:0 10px;

    border-radius:12px;

    color:#d9ecff;

    background:
        rgba(37,99,235,.14);

    border:1px solid rgba(59,130,246,.25);

    font-weight:900;
}

.urgent-grid{
    position:relative;
    z-index:1;

    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:12px;
}

.urgent-card{
    position:relative;
    overflow:hidden;

    padding:16px;

    border-radius:17px;

    background:
        rgba(3,18,31,.32);

    border:1px solid rgba(115,166,218,.12);

    transition:.2s;
}

.urgent-card:hover{
    border-color:
        rgba(59,130,246,.34);

    transform:translateY(-2px);

    box-shadow:
        0 10px 30px rgba(0,0,0,.15);
}

.urgent-card-top{
    display:flex;

    justify-content:space-between;

    gap:10px;

    margin-bottom:10px;
}

.urgent-client{
    font-size:13px;
    font-weight:800;
}

.urgent-task{
    color:#d7e5f2;

    font-size:12px;

/* =========================================================

   ========================================================= */

.touch-light{
    position:fixed;

    width:105px;
    height:105px;

    border-radius:50%;

    pointer-events:none;

    z-index:99999;

    transform:
        translate(-50%,-50%);

    opacity:1;

    background:
        radial-gradient(
            circle,
            var(--touch-main) 0%,
            var(--touch-second) 24%,
            var(--touch-third) 45%,
            transparent 72%
        );

    box-shadow:
        0 0 25px var(--touch-glow),
        0 0 48px var(--touch-glow2),
        0 0 80px var(--touch-glow3);

    animation:
        touchFade
        760ms
        cubic-bezier(.2,.8,.2,1)
        forwards;

    will-change:
        transform,
        opacity;
}

.touch-light::before{
    content:"";

    position:absolute;

    inset:13px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(255,255,255,.22),
            transparent 67%
        );
}

.touch-light::after{
    content:"";

    position:absolute;

    inset:-9px;

    border-radius:50%;

    border:1px solid var(--touch-border);

    box-shadow:
        0 0 20px var(--touch-glow2),
        0 0 38px var(--touch-glow3),
        inset 0 0 14px var(--touch-second);

    animation:
        touchRing
        760ms
        ease-out
        forwards;
}

@keyframes touchFade{

    from{
        opacity:1;

        transform:
            translate(-50%,-50%)
            scale(.25);
    }

    to{
        opacity:0;

        transform:
            translate(-50%,-50%)
            scale(1.75);
    }
}

@keyframes touchRing{

    from{
        opacity:1;

        transform:scale(.35);
    }

    to{
        opacity:0;

        transform:scale(1.9);
    }
}

/* =========================================================
   HELPERS
   ========================================================= */

function escapeHtml(value){

    return String(value ?? '')
        .replace(/&/g,'&amp;')
        .replace(/</g,'&lt;')
        .replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;')
        .replace(/'/g,'&#039;');

}


function toNumber(value){

    if(
        value === null ||
        value === undefined ||
        value === ''
    ){
        return 0;
    }

    if(
        typeof value === 'number'
    ){
        return isFinite(value)
            ? value
            : 0;
    }

    const text =
        String(value)
            .replace(/[٬,]/g,'')
            .replace(/[^\d.-]/g,'');

    const number =
        Number(text);

    return isFinite(number)
        ? number
        : 0;

}


function formatNumber(value){

    return new Intl.NumberFormat(
        'fa-IR'
    ).format(
        Math.round(
            toNumber(value)
        )
    );

}


function tomanDisplayValue(value){

    return toNumber(value) / 10;

}


function formatToman(value){

    return (
        formatNumber(
            tomanDisplayValue(value)
        ) +
        ' تومان'
    );

}


function formatDate(value){

    if(!value){
        return '—';
    }

    return String(value);

}


function normalizeText(value){

    return String(value || '')
        .replace(/ي/g,'ی')
        .replace(/ك/g,'ک')
        .replace(/\u200c/g,' ')
        .trim()
        .toLowerCase();

}


function matchesSearch(item){

    const query =
        normalizeText(
            document
                .getElementById('search')
                ?.value || ''
        );

    if(!query){
        return true;
    }

    return Object
        .values(item || {})
        .join(' ')
        .toLowerCase()
        .includes(query);

}


/* =========================================================
   STATUS
   ========================================================= */

function isCompleted(item){

    const status =
        normalizeText(
            item?.['وضعیت']
        );

    return (
        status.includes('انجام شده') &&
        !status.includes('انجام نشده')
    );

}


function isUnfinished(item){

    return !isCompleted(item);

}


function priorityLevel(item){

    const priority =
        normalizeText(
            item?.['الویت']
        );

    if(
        priority.includes('فوری')
    ){
        return 3;
    }

    if(
        priority.includes('بالا')
    ){
        return 2;
    }

    if(
        priority.includes('عادی')
    ){
        return 1;
    }

    return 0;

}


function servicePriorityScore(item){

    if(
        isCompleted(item)
    ){
        return 0;
    }

    return 10 +
        priorityLevel(item);

}


function sortServices(items){

    return [...items].sort(
        (a,b)=>{

            const scoreA =
                servicePriorityScore(a);

            const scoreB =
                servicePriorityScore(b);

            if(
                scoreA !== scoreB
            ){
                return scoreB - scoreA;
            }

            const daysA =
                toNumber(
                    a?.['روزهای باقی مانده']
                );

            const daysB =
                toNumber(
                    b?.['روزهای باقی مانده']
                );

            return daysA - daysB;

        }
    );

}


/* =========================================================
   IMPORTANT TASKS
   ========================================================= */

function getImportantUnfinishedTasks(dashboard){

    const accounting =
        Array.isArray(
            dashboard?.Accounting
        )
            ? dashboard.Accounting
            : [];

    const tax =
        Array.isArray(
            dashboard?.Tax
        )
            ? dashboard.Tax
            : [];

    return [

        ...accounting.map(
            item=>({
                ...item,
                __type:'حسابداری'
            })
        ),

        ...tax.map(
            item=>({
                ...item,
                __type:'مالیاتی'
            })
        )

    ]

    .filter(
        item=>{

            return (
                priorityLevel(item) >= 2 &&
                isUnfinished(item)
            );

        }
    )

    .sort(
        (a,b)=>{

            const priorityDiff =
                priorityLevel(b) -
                priorityLevel(a);

            if(
                priorityDiff !== 0
            ){
                return priorityDiff;
            }

            const daysA =
                toNumber(
                    a?.['روزهای باقی مانده']
                );

            const daysB =
                toNumber(
                    b?.['روزهای باقی مانده']
                );

            return daysA - daysB;

        }
    );

}

/* =========================================================
   API
   همان منطق نسخه سالم قبلی
   ========================================================= */

async function loadDashboard(){

    const content =
        document.getElementById(
            'appContent'
        );

    try{

        if(!tg){

            throw new Error(
                'این داشبورد باید از داخل Telegram باز شود.'
            );

        }

        const initData =
            tg.initData || '';

        if(!initData){

            throw new Error(
                'Telegram initData دریافت نشد. داشبورد را از داخل ربات باز کنید.'
            );

        }

        const url =
            API_URL +
            '?action=getDashboard' +
            '&key=' +
            encodeURIComponent(API_KEY) +
            '&initData=' +
            encodeURIComponent(initData);

        const response =
            await fetch(
                url,
                {
                    method:'GET',
                    cache:'no-store'
                }
            );

        const result =
            await response.json();

        if(
            !result ||
            result.ok !== true
        ){

            throw new Error(
                result?.error ||
                result?.message ||
                'دریافت اطلاعات داشبورد ناموفق بود.'
            );

        }

        if(
            !result.data
        ){

            throw new Error(
                'اطلاعات داشبورد خالی است.'
            );

        }

        renderDashboard(
            result.data
        );

    }catch(error){

        console.error(error);

        content.innerHTML = `

            <div class="error">

                <strong>
                    خطا در دریافت اطلاعات داشبورد
                </strong>

                <div style="margin-top:8px;">

                    ${escapeHtml(
                        error?.message ||
                        String(error)
                    )}

                </div>

                <button
                    class="retry"
                    onclick="loadDashboard()"
                >
                    تلاش مجدد
                </button>

            </div>

        `;

    }

}

    }

let lastTouchPalette = -1;


function getRandomTouchPalette(){

    let index;

    do{

        index =
            Math.floor(
                Math.random() *
                touchPalettes.length
            );

    }while(
        touchPalettes.length > 1 &&
        index === lastTouchPalette
    );

    lastTouchPalette =
        index;

    return touchPalettes[index];

}


function createTouchLight(x,y){

    const palette =
        getRandomTouchPalette();

    const light =
        document.createElement('div');

    light.className =
        'touch-light';

    light.style.left =
        `${x}px`;

    light.style.top =
        `${y}px`;

    light.style.setProperty(
        '--touch-main',
        palette.main
    );

    light.style.setProperty(
        '--touch-second',
        palette.second
    );

    light.style.setProperty(
        '--touch-third',
        palette.third
    );

    light.style.setProperty(
        '--touch-glow',
        palette.glow
    );

    light.style.setProperty(
        '--touch-glow2',
        palette.glow2
    );

    light.style.setProperty(
        '--touch-glow3',
        palette.glow3
    );

    light.style.setProperty(
        '--touch-border',
        palette.border
    );

    document.body.appendChild(
        light
    );

    setTimeout(
        ()=>{
            light.remove();
        },
        800
    );

}


document.addEventListener(
    'pointerdown',
    event=>{

        if(
            event.pointerType === 'mouse' &&
            event.button !== 0
        ){
            return;
        }

        createTouchLight(
            event.clientX,
            event.clientY
        );

    },
    {
        passive:true
    }
);
