<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>حسابگران آرمان</title>

  <!-- Telegram Mini App -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>

    /* ==========================================================
       ROOT
    ========================================================== */

    :root {

      --bg: #07131b;
      --bg2: #0b1d25;

      --blue: #38bdf8;
      --blue2: #2563eb;

      --gold: #d6b56d;
      --gold2: #f0d28a;

      --olive: #89964a;
      --olive2: #a8b85d;

      --text: #f5f7f4;
      --muted: #9caeb4;

      --glass: rgba(255,255,255,.065);
      --glass2: rgba(255,255,255,.09);

      --border: rgba(255,255,255,.09);

      --green: #65d6a0;
      --red: #ff6675;

      --shadow:
        0 20px 60px rgba(0,0,0,.35);

      --radius: 22px;

    }


    /* ==========================================================
       RESET
    ========================================================== */

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      background: var(--bg);
      min-height: 100%;
    }

    body {

      margin: 0;

      min-height: 100vh;

      background:
        radial-gradient(
          circle at 85% 5%,
          rgba(56,189,248,.10),
          transparent 28%
        ),
        radial-gradient(
          circle at 10% 20%,
          rgba(137,150,74,.09),
          transparent 25%
        ),
        radial-gradient(
          circle at 80% 85%,
          rgba(214,181,109,.07),
          transparent 30%
        ),
        linear-gradient(
          145deg,
          var(--bg),
          var(--bg2)
        );

      color: var(--text);

      font-family:
        Tahoma,
        Arial,
        sans-serif;

      overflow-x: hidden;

    }


    button,
    input {
      font-family: inherit;
    }


    /* ==========================================================
       ROOT
    ========================================================== */

    #root {

      width: 100%;
      min-height: 100vh;

    }


    /* ==========================================================
       APP
    ========================================================== */

    .app {

      width: 100%;
      max-width: 920px;

      margin: 0 auto;

      padding:
        14px
        14px
        30px;

    }


    /* ==========================================================
       GLASS
    ========================================================== */

    .hero,
    .section,
    .stat,
    .circle-card,
    .item,
    .client {

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.075),
          rgba(255,255,255,.025)
        );

      border:
        1px solid
        var(--border);

      box-shadow:
        var(--shadow);

      backdrop-filter:
        blur(18px);

      -webkit-backdrop-filter:
        blur(18px);

    }


    /* ==========================================================
       HERO
    ========================================================== */

    .hero {

      position: relative;

      overflow: hidden;

      padding: 20px;

      border-radius:
        28px;

      margin-bottom: 14px;

    }


    .hero::before {

      content: "";

      position: absolute;

      width: 220px;
      height: 220px;

      top: -120px;
      left: -80px;

      background:
        radial-gradient(
          circle,
          rgba(56,189,248,.20),
          transparent 68%
        );

      pointer-events: none;

    }


    .hero::after {

      content: "";

      position: absolute;

      width: 190px;
      height: 190px;

      bottom: -120px;
      right: -60px;

      background:
        radial-gradient(
          circle,
          rgba(214,181,109,.13),
          transparent 68%
        );

      pointer-events: none;

    }


    .hero-top {

      position: relative;
      z-index: 2;

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 12px;

    }


    .brand {

      display: flex;

      align-items: center;

      gap: 12px;

      min-width: 0;

    }


    .brand-icon {

      flex: 0 0 auto;

      width: 52px;
      height: 52px;

      display: flex;

      align-items: center;
      justify-content: center;

      border-radius: 17px;

      color: var(--gold2);

      font-size: 28px;

      background:
        linear-gradient(
          145deg,
          rgba(214,181,109,.18),
          rgba(56,189,248,.08)
        );

      border:
        1px solid
        rgba(214,181,109,.25);

      box-shadow:
        inset 0 0 25px rgba(255,255,255,.025),
        0 0 30px rgba(214,181,109,.05);

    }


    .brand h1 {

      margin: 0;

      font-size: 19px;

      font-weight: 800;

      letter-spacing: -.5px;

    }


    .brand p {

      margin: 5px 0 0;

      color: var(--muted);

      font-size: 10px;

    }


    .connection {

      flex: 0 0 auto;

      display: flex;

      align-items: center;

      gap: 6px;

      padding: 7px 10px;

      border-radius: 999px;

      color: #bdeed8;

      background:
        rgba(101,214,160,.08);

      border:
        1px solid
        rgba(101,214,160,.16);

      font-size: 9px;

      white-space: nowrap;

    }


    .pulse {

      width: 7px;
      height: 7px;

      border-radius: 50%;

      background: var(--green);

      box-shadow:
        0 0 0 0 rgba(101,214,160,.5);

      animation:
        pulse 1.8s infinite;

    }


    @keyframes pulse {

      0% {
        box-shadow:
          0 0 0 0 rgba(101,214,160,.5);
      }

      70% {
        box-shadow:
          0 0 0 7px rgba(101,214,160,0);
      }

      100% {
        box-shadow:
          0 0 0 0 rgba(101,214,160,0);
      }

    }


    .user-line {

      position: relative;
      z-index: 2;

      display: flex;

      justify-content: space-between;

      align-items: center;

      gap: 10px;

      margin-top: 18px;

      padding-top: 14px;

      border-top:
        1px solid
        rgba(255,255,255,.065);

      color: var(--muted);

      font-size: 9px;

    }


    .user-name {

      color: var(--gold2);

      font-weight: 700;

    }


    /* ==========================================================
       STATS
    ========================================================== */

    .stats {

      display: grid;

      grid-template-columns:
        repeat(4, minmax(0,1fr));

      gap: 10px;

      margin-bottom: 14px;

    }


    .stat {

      position: relative;

      overflow: hidden;

      min-width: 0;

      padding: 15px 11px;

      border-radius: 19px;

      text-align: center;

    }


    .stat::after {

      content: "";

      position: absolute;

      width: 80px;
      height: 80px;

      top: -45px;
      right: -35px;

      background:
        radial-gradient(
          circle,
          rgba(56,189,248,.12),
          transparent 70%
        );

    }


    .stat-icon {

      position: relative;
      z-index: 1;

      margin-bottom: 7px;

      font-size: 16px;

      color: var(--blue);

    }


    .stat-number {

      position: relative;
      z-index: 1;

      color: var(--text);

      font-size: 17px;

      font-weight: 800;

      line-height: 1.25;

      direction: rtl;

      word-break: break-word;

    }


    .stat-label {

      position: relative;
      z-index: 1;

      margin-top: 5px;

      color: var(--muted);

      font-size: 8px;

    }


    /* ==========================================================
       SECTION
    ========================================================== */

    .section {

      padding: 16px;

      margin-bottom: 14px;

      border-radius: var(--radius);

    }


    .section-title {

      display: flex;

      align-items: baseline;

      justify-content: space-between;

      gap: 10px;

      margin-bottom: 14px;

    }


    .section-title h2 {

      margin: 0;

      font-size: 14px;

      font-weight: 800;

    }


    .section-title span {

      color: var(--muted);

      font-size: 8px;

    }


    /* ==========================================================
       OVERVIEW
    ========================================================== */

    .overview {

      display: grid;

      grid-template-columns:
        repeat(2,minmax(0,1fr));

      gap: 12px;

    }


    .circle-card {

      padding: 18px 12px;

      border-radius: 20px;

      text-align: center;

    }


    .donut {

      width: 120px;
      height: 120px;

      margin: 0 auto 13px;

      border-radius: 50%;

      display: flex;

      align-items: center;
      justify-content: center;

      position: relative;

      box-shadow:
        0 0 35px rgba(56,189,248,.07);

    }


    .donut::before {

      content: "";

      position: absolute;

      inset: 9px;

      border-radius: 50%;

      background:
        linear-gradient(
          145deg,
          #0a1c25,
          #07131b
        );

      box-shadow:
        inset 0 0 20px rgba(0,0,0,.5);

    }


    .donut-center {

      position: relative;
      z-index: 2;

    }


    .donut-number {

      font-size: 22px;

      font-weight: 900;

      color: var(--text);

    }


    .donut-label {

      margin-top: 2px;

      color: var(--muted);

      font-size: 8px;

    }


    .legend {

      display: flex;

      justify-content: center;

      gap: 14px;

      flex-wrap: wrap;

    }


    .legend-item {

      display: flex;

      align-items: center;

      gap: 5px;

      color: var(--muted);

      font-size: 8px;

    }


    .legend-dot {

      width: 7px;
      height: 7px;

      border-radius: 50%;

      display: inline-block;

    }


    .legend-dot.blue {
      background: var(--blue);
    }


    .legend-dot.olive {
      background: var(--olive2);
    }


    .legend-dot.gold {
      background: var(--gold2);
    }


    /* ==========================================================
       SEARCH
    ========================================================== */

    .search {

      display: block;

      width: 100%;

      border: 1px solid
        rgba(255,255,255,.08);

      outline: none;

      border-radius: 15px;

      background:
        rgba(255,255,255,.045);

      color: var(--text);

      padding:
        12px
        14px;

      font-size: 10px;

      direction: rtl;

      transition:
        .2s ease;

      margin-bottom: 10px;

    }


    .search::placeholder {

      color:
        #71858b;

    }


    .search:focus {

      border-color:
        rgba(56,189,248,.35);

      background:
        rgba(255,255,255,.065);

      box-shadow:
        0 0 0 3px
        rgba(56,189,248,.05);

    }


    /* ==========================================================
       TABS
    ========================================================== */

    .tabs {

      display: flex;

      gap: 6px;

      overflow-x: auto;

      scrollbar-width: none;

      padding-bottom: 2px;

      margin-bottom: 10px;

    }


    .tabs::-webkit-scrollbar {
      display: none;
    }


    .tab {

      flex: 0 0 auto;

      border: 1px solid
        rgba(255,255,255,.07);

      background:
        rgba(255,255,255,.035);

      color: var(--muted);

      padding:
        8px
        12px;

      border-radius: 12px;

      cursor: pointer;

      font-size: 9px;

      transition:
        .2s ease;

    }


    .tab:hover {

      border-color:
        rgba(56,189,248,.2);

    }


    .tab.active {

      color: #07131b;

      background:
        linear-gradient(
          135deg,
          var(--blue),
          #74d9ff
        );

      border-color:
        transparent;

      font-weight: 800;

      box-shadow:
        0 7px 20px
        rgba(56,189,248,.12);

    }


    /* ==========================================================
       ITEMS
    ========================================================== */

    .items {

      display: grid;

      gap: 9px;

    }


    .item {

      position: relative;

      overflow: hidden;

      padding: 14px;

      border-radius: 18px;

      border-right:
        3px solid
        var(--blue);

    }


    .item.priority-high {

      border-right-color:
        var(--red);

    }


    .item.priority-medium {

      border-right-color:
        var(--gold);

    }


    .item.priority-low {

      border-right-color:
        var(--olive2);

    }


    .item-head {

      display: flex;

      align-items: flex-start;

      justify-content: space-between;

      gap: 10px;

    }


    .item-title {

      min-width: 0;

      color: var(--text);

      font-size: 11px;

      font-weight: 800;

      line-height: 1.8;

    }


    .item-code {

      display: inline-block;

      direction: ltr;

      margin-left: 5px;

      color: var(--blue);

      font-size: 8px;

      font-weight: 700;

      opacity: .8;

    }


    .item-description {

      margin-top: 8px;

      color: var(--muted);

      font-size: 9px;

      line-height: 1.9;

    }


    .badge {

      flex: 0 0 auto;

      padding:
        5px
        8px;

      border-radius: 999px;

      font-size: 7px;

      white-space: nowrap;

      border: 1px solid
        rgba(255,255,255,.08);

    }


    .badge-done {

      color: #9de7c1;

      background:
        rgba(101,214,160,.08);

      border-color:
        rgba(101,214,160,.16);

    }


    .badge-progress {

      color: #8edfff;

      background:
        rgba(56,189,248,.08);

      border-color:
        rgba(56,189,248,.16);

    }


    .badge-pending {

      color: #d8c58f;

      background:
        rgba(214,181,109,.08);

      border-color:
        rgba(214,181,109,.16);

    }


    .item-meta {

      display: grid;

      grid-template-columns:
        repeat(2,minmax(0,1fr));

      gap: 7px;

      margin-top: 12px;

    }


    .meta {

      min-width: 0;

      padding: 8px;

      border-radius: 11px;

      background:
        rgba(255,255,255,.025);

      border:
        1px solid
        rgba(255,255,255,.045);

    }


    .meta-label {

      color: #71858b;

      font-size: 7px;

      margin-bottom: 4px;

    }


    .meta-value {

      color: #dbe6e8;

      font-size: 8px;

      line-height: 1.7;

      word-break: break-word;

    }


    /* ==========================================================
       CLIENTS
    ========================================================== */

    .client {

      display: grid;

      grid-template-columns:
        auto
        minmax(0,1fr)
        auto;

      align-items: center;

      gap: 10px;

      padding: 13px;

      border-radius: 18px;

    }


    .avatar {

      width: 43px;
      height: 43px;

      border-radius: 15px;

      display: flex;

      align-items: center;
      justify-content: center;

      color: var(--gold2);

      background:
        linear-gradient(
          145deg,
          rgba(214,181,109,.16),
          rgba(56,189,248,.08)
        );

      border:
        1px solid
        rgba(214,181,109,.16);

      font-size: 16px;

      font-weight: 900;

    }


    .client-info {

      min-width: 0;

    }


    .client-name {

      color: var(--text);

      font-size: 10px;

      font-weight: 800;

      line-height: 1.7;

      word-break: break-word;

    }


    .client-type {

      margin-top: 3px;

      color: var(--muted);

      font-size: 8px;

      line-height: 1.6;

    }


    .client-fee {

      text-align: left;

      direction: rtl;

      min-width: 70px;

    }


    .fee-number {

      color: var(--gold2);

      font-size: 9px;

      font-weight: 800;

      white-space: nowrap;

    }


    .fee-label {

      margin-top: 3px;

      color: #71858b;

      font-size: 7px;

    }


    /* ==========================================================
       LOADING
    ========================================================== */

    .loading {

      min-height: 100vh;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      gap: 13px;

      padding: 30px;

      text-align: center;

    }


    .loading-text {

      color: var(--muted);

      font-size: 10px;

      line-height: 2;

    }


    .loading-spinner {

      width: 42px;
      height: 42px;

      border-radius: 50%;

      border:
        3px solid
        rgba(255,255,255,.07);

      border-top-color:
        var(--blue);

      border-right-color:
        var(--gold);

      animation:
        spin .8s linear infinite;

    }


    @keyframes spin {

      to {
        transform: rotate(360deg);
      }

    }


    /* ==========================================================
       FOOTER
    ========================================================== */

    footer {

      padding:
        8px
        5px
        20px;

      text-align: center;

      color: #5f747b;

      font-size: 8px;

    }


    footer strong {

      color: var(--gold);

      margin-right: 5px;

    }


    /* ==========================================================
       TOUCH LIGHT
    ========================================================== */

    .touch-light {

      position: fixed;

      width: 8px;
      height: 8px;

      border-radius: 50%;

      transform:
        translate(-50%,-50%);

      pointer-events: none;

      z-index: 99999;

      animation:
        touchLight .85s ease-out forwards;

    }


    @keyframes touchLight {

      0% {

        opacity: .9;

        transform:
          translate(-50%,-50%)
          scale(.7);

      }

      100% {

        opacity: 0;

        transform:
          translate(-50%,-50%)
          scale(1.8);

      }

    }


    /* ==========================================================
       RESPONSIVE
    ========================================================== */

    @media (max-width: 600px) {

      .app {

        padding:
          10px
          10px
          24px;

      }

      .hero {

        padding: 17px;

      }

      .brand h1 {

        font-size: 17px;

      }

      .brand p {

        font-size: 8px;

      }

      .connection {

        font-size: 8px;

        padding:
          6px
          8px;

      }

      .stats {

        gap: 7px;

      }

      .stat {

        padding:
          12px
          7px;

      }

      .stat-number {

        font-size: 15px;

      }

      .stat-label {

        font-size: 7px;

      }

    }


    @media (max-width: 380px) {

      .hero-top {

        align-items: flex-start;

      }

      .connection {

        display: none;

      }

      .stats {

        grid-template-columns:
          repeat(2,minmax(0,1fr));

      }

      .overview {

        grid-template-columns:
          1fr;

      }

      .item-head {

        flex-direction: column;

      }

      .badge {

        align-self: flex-start;

      }

    }


  </style>

</head>


<body>


  <!-- ========================================================
       ROOT
  ========================================================= -->

  <div id="root">

    <div class="loading">

      <div class="loading-spinner"></div>

      <div class="loading-text">
        در حال اتصال به داشبورد حسابگران آرمان...
      </div>

    </div>

  </div>


  <script>

    /* ==========================================================
       CONFIG
    ========================================================== */

    const GAS_API =
      "https://script.google.com/macros/s/AKfycbzK62xIUIm8VyTektiy9EKOZBnMeXb1bxIKtcCxKfABIYFezMNEH6yfcrWAeL34zmI/exec";


    /* ==========================================================
       TELEGRAM
    ========================================================== */

    const tg =
      window.Telegram?.WebApp || null;


    if (tg) {

      tg.ready();

      tg.expand();

      try {

        tg.setHeaderColor("#07131b");

        tg.setBackgroundColor("#07131b");

      } catch (e) {}

    }


    /* ==========================================================
       STATE
    ========================================================== */

    let dashboard = null;

    let activeTab = "all";

    let searchText = "";


    /* ==========================================================
       HELPERS
    ========================================================== */

    function esc(value) {

      if (
        value === null ||
        value === undefined
      ) {

        return "";

      }

      return String(value)

        .replaceAll(
          "&",
          "&amp;"
        )

        .replaceAll(
          "<",
          "&lt;"
        )

        .replaceAll(
          ">",
          "&gt;"
        )

        .replaceAll(
          '"',
          "&quot;"
        )

        .replaceAll(
          "'",
          "&#039;"
        );

    }


    function arr(value) {

      return Array.isArray(value)
        ? value
        : [];

    }


    /* ==========================================================
       NORMALIZE
    ========================================================== */

    function normalizeKey(value) {

      return String(
        value ?? ""
      )

      .replace(
        /[\u200c\u200d\u200e\u200f\ufeff]/g,
        ""
      )

      .replace(
        /\s+/g,
        ""
      )

      .replace(
        /[_\-]/g,
        ""
      )

      .trim()

      .toLowerCase();

    }


    /* ==========================================================
       OBJECT GETTER
    ========================================================== */

    function get(
      obj,
      ...keys
    ) {

      if (
        !obj ||
        typeof obj !== "object"
      ) {

        return "";

      }


      const objectKeys =
        Object.keys(obj);


      for (
        const wantedKey of keys
      ) {

        const wanted =
          normalizeKey(
            wantedKey
          );


        for (
          const realKey of objectKeys
        ) {

          if (
            normalizeKey(
              realKey
            ) === wanted
          ) {

            const value =
              obj[realKey];


            if (
              value !== undefined &&
              value !== null &&
              value !== ""
            ) {

              return value;

            }

          }

        }

      }


      return "";

    }


    /* ==========================================================
       PARSE RESPONSE
    ========================================================== */

    function parseDashboardData(
      result
    ) {

      let data =
        result?.data;


      if (
        typeof data === "string"
      ) {

        const text =
          data.trim();


        if (text) {

          try {

            data =
              JSON.parse(text);

          } catch (e) {

            throw new Error(
              "اطلاعات دریافتی از سرور قابل پردازش نیست."
            );

          }

        }

      }


      if (
        data &&
        typeof data === "object" &&
        data.data &&
        !data.Summary
      ) {

        let nested =
          data.data;


        if (
          typeof nested === "string"
        ) {

          try {

            nested =
              JSON.parse(
                nested
              );

          } catch (e) {

            throw new Error(
              "ساختار اطلاعات داشبورد نامعتبر است."
            );

          }

        }


        if (
          nested &&
          typeof nested === "object"
        ) {

          data =
            nested;

        }

      }


      if (
        !data ||
        typeof data !== "object"
      ) {

        throw new Error(
          "اطلاعات داشبورد دریافت نشد."
        );

      }


      if (
        !data.Summary &&
        !data.Clients &&
        !data.Accounting &&
        !data.Tax &&
        !data.Receivables

        );

      }


      return data;

    /* ==========================================================
       MONEY
    ========================================================== */

    function numericValue(
      value
    ) {

      if (
        value === null ||
        value === undefined ||
        value === ""
      ) {

        return NaN;

      }


      const normalized =
        String(value)

          .replaceAll(
            ",",
            ""
          )

          .replace(
            /[^\d.-]/g,
            ""
          );


      return Number(
        normalized
      );

    }


    function formatMoney(
      value
    ) {

      const n =
        numericValue(
          value
        );


      if (
        !Number.isFinite(n)
      ) {

        return "—";

      }


      if (n === 0) {

        return "۰";

      }


      return new Intl.NumberFormat(
        "fa-IR"
      ).format(n);

    }


    function formatMoneyShort(
      value
    ) {

      const n =
        numericValue(
          value
        );


      if (
        !Number.isFinite(n)
      ) {

        return "—";

      }


      if (
        n >= 1000000000
      ) {

        return (
          new Intl.NumberFormat(
            "fa-IR",
            {
              maximumFractionDigits: 1
            }
          ).format(
            n / 1000000000
          )
          +
          " میلیارد"
        );

      }


      if (
        n >= 1000000
      ) {

        return (
          new Intl.NumberFormat(
            "fa-IR",
            {
              maximumFractionDigits: 1
            }
          ).format(
            n / 1000000
          )
          +
          " میلیون"
        );

      }


      return formatMoney(
        n
      );

    }


    /* ==========================================================
       STATUS
    ========================================================== */

    function statusClass(
      status
    ) {

      const s =
        String(
          status || ""
        );


      if (
        s.includes(
          "انجام شده"

        return "badge-done";

      }


      if (
        s.includes(
          "در حال انجام"

      }


      return "badge-pending";

    }


    function priorityClass(
      priority
    ) {

      const p =
        String(
          priority || ""
        );


      if (
        p.includes("بالا") ||
        p.includes("فوری")
      ) {

        return "priority-high";

      }


      if (
        p.includes("متوسط")
      ) {

        return "priority-medium";

      }


      return "priority-low";

    function statusIcon(
      status

      const s =
        String(

      if (

    /* ==========================================================
       LOAD DASHBOARD
    ========================================================== */

    function loadDashboard() {

      if (
        !tg ||
        !tg.initData
      ) {

        showError(
          "داشبورد را از داخل ربات تلگرام باز کنید."
        );

        return;

      }


      const callbackName =
        "dashboardCallback_" +
        Date.now() +
        "_" +
        Math.floor(
          Math.random() *
          100000
        );


      window[callbackName] =
        function(result) {

          try {

            if (
              !result ||
              !result.ok
            ) {

              throw new Error(
                result?.error ||
                "خطا در دریافت اطلاعات"
              );

            }


            dashboard =
              parseDashboardData(
                result
              );


            console.log(
              "Dashboard loaded:",
              dashboard
            );


            render();


          } catch (err) {

            console.error(
              "Dashboard error:",
              err
            );


            showError(
              err.message
            );


          } finally {

            delete window[
              callbackName
            ];

          }

        };


      const script =
        document.createElement(
          "script"
        );


      const url =
        GAS_API +
        "?action=getDashboard" +
        "&initData=" +
        encodeURIComponent(
          tg.initData
        ) +
        "&callback=" +
        encodeURIComponent(
          callbackName
        ) +
        "&t=" +
        Date.now();


      script.src =
        url;


      script.onerror =
        function() {

          showError(
            "ارتباط با سرور داشبورد برقرار نشد."
          );

        };


      document.body.appendChild(
        script
      );

    }

          </div>


          <div class="client-info">

            <div class="client-name">
              ${esc(name)}
            </div>


            <div class="client-type">

              ${esc(type)}

              ·

              ${esc(activity)}

            </div>


            ${
              serviceType
                ? `
                  <div
                    style="
                      margin-top:4px;
                      color:#71858b;
                      font-size:8px;
                    "
                  >
                    ${esc(serviceType)}
                  </div>
                `
                : ""
            }


            ${
              city
                ? `
                  <div
                    style="
                      margin-top:3px;
                      color:#657a80;
                      font-size:8px;
                    "
                  >
                    📍 ${esc(city)}
                  </div>
                `
                : ""
            }

          </div>


          <div class="client-fee">

            <div class="fee-number">

              ${
                hasFee
                  ? formatMoney(fee)
                  : "موردی"
              }

            </div>


            <div class="fee-label">

              ${
                hasFee
                  ? "حق‌الزحمه"
                  : "نوع همکاری"
              }

            </div>


            <div
              style="
                margin-top:5px;
                color:${
                  status === "فعال"
                    ? "#65d6a0"
                    : "#ff6675"
                };
                font-size:8px;
              "
            >

              ${esc(
                status || "—"
              )}

            </div>

          </div>


        </div>

      `;

    }


    /* ==========================================================
       START
    ========================================================== */

    function startDashboard() {

      loadDashboard();

    }


    if (
      document.readyState ===
      "loading"
    ) {

      document.addEventListener(
        "DOMContentLoaded",
        startDashboard
      );

    } else {

      startDashboard();

    }

  </script>

</body>

</html>
