<!DOCTYPE html>

<html
  lang="fa"
  dir="rtl"
>

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
  >

  <title>
    حسابگران آرمان
  </title>

  <script
    src="https://telegram.org/js/telegram-web-app.js"
  ></script>


  <style>

    :root {

      --bg:
        #07131b;

      --bg2:
        #0b1d25;

      --blue:
        #38bdf8;

      --blue2:
        #2563eb;

      --gold:
        #d6b56d;

      --gold2:
        #f0d28a;

      --olive:
        #89964a;

      --olive2:
        #a8b85d;

      --text:
        #f5f7f4;

      --muted:
        #9caeb4;

      --glass:
        rgba(255,255,255,.065);

      --border:
        rgba(255,255,255,.10);

      --success:
        #65d6a0;

      --danger:
        #ff6675;

      --warning:
        #f4c96b;

    }


    * {

      box-sizing:
        border-box;

      -webkit-tap-highlight-color:
        transparent;

    }


    html {

      background:
        var(--bg);

      min-height:
        100%;

    }


    body {

      margin:
        0;

      min-height:
        100vh;

      color:
        var(--text);

      font-family:
        Tahoma,
        Arial,
        sans-serif;

      background:

        radial-gradient(
          circle at 8% 4%,
          rgba(56,189,248,.15),
          transparent 30%
        )

        ,

        radial-gradient(
          circle at 92% 8%,
          rgba(214,181,109,.13),
          transparent 28%
        )

        ,

        radial-gradient(
          circle at 50% 100%,
          rgba(137,150,74,.11),
          transparent 35%
        )

        ,

        linear-gradient(
          145deg,
          var(--bg),
          var(--bg2)
        );

      overflow-x:
        hidden;

    }


    button,
    input {

      font:
        inherit;

    }


    button {

      cursor:
        pointer;

    }


    .app {

      width:
        min(1180px, 100%);

      margin:
        auto;

      padding:
        16px;

    }


    .glass {

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.085),
          rgba(255,255,255,.035)
        );

      border:
        1px solid var(--border);

      box-shadow:
        0 20px 60px rgba(0,0,0,.30);

      backdrop-filter:
        blur(18px);

      -webkit-backdrop-filter:
        blur(18px);

    }


    /* HERO */

    .hero {

      position:
        relative;

      overflow:
        hidden;

      padding:
        24px;

      border-radius:
        28px;

      margin-bottom:
        16px;

    }


    .hero::before {

      content:
        "";

      position:
        absolute;

      width:
        250px;

      height:
        250px;

      left:
        -100px;

      top:
        -150px;

      border-radius:
        50%;

      background:
        radial-gradient(
          circle,
          rgba(56,189,248,.22),
          transparent 68%
        );

    }


    .hero::after {

      content:
        "";

      position:
        absolute;

      width:
        250px;

      height:
        250px;

      right:
        -110px;

      bottom:
        -160px;

      border-radius:
        50%;

      background:
        radial-gradient(
          circle,
          rgba(214,181,109,.17),
          transparent 68%
        );

    }


    .hero-content {

      position:
        relative;

      z-index:
        2;

      display:
        flex;

      align-items:
        center;

      justify-content:
        space-between;

      gap:
        15px;

    }


    .brand {

      display:
        flex;

      align-items:
        center;

      gap:
        14px;

    }


    .brand-logo {

      width:
        54px;

      height:
        54px;

      display:
        grid;

      place-items:
        center;

      border-radius:
        17px;

      background:
        linear-gradient(
          145deg,
          rgba(214,181,109,.20),
          rgba(56,189,248,.13)
        );

      border:
        1px solid
        rgba(240,210,138,.24);

      font-size:
        25px;

    }


    .brand-title {

      margin:
        0;

      font-size:
        23px;

      font-weight:
        800;

    }


    .brand-subtitle {

      margin-top:
        6px;

      color:
        var(--muted);

      font-size:
        12px;

    }


    .secure {

      padding:
        8px 11px;

      border-radius:
        999px;

      background:
        rgba(101,214,160,.08);

      border:
        1px solid
        rgba(101,214,160,.16);

      color:
        var(--success);

      font-size:
        10px;

      white-space:
        nowrap;

    }


    .secure-dot {

      display:
        inline-block;

      width:
        7px;

      height:
        7px;

      margin-left:
        5px;

      border-radius:
        50%;

      background:
        var(--success);

      box-shadow:
        0 0 12px
        rgba(101,214,160,.75);

    }


    /* LOADING */

    .loading {

      min-height:
        75vh;

      display:
        grid;

      place-items:
        center;

      text-align:
        center;

    }


    .loader-box {

      padding:
        32px;

      border-radius:
        25px;

      width:
        min(350px,100%);

    }


    .spinner {

      width:
        45px;

      height:
        45px;

      margin:
        0 auto 18px;

      border-radius:
        50%;

      border:
        3px solid
        rgba(255,255,255,.10);

      border-top-color:
        var(--blue);

      animation:
        spin .8s linear infinite;

    }


    @keyframes spin {

      to {
        transform:
          rotate(360deg);
      }

    }


    .loading-title {

      font-size:
        16px;

      font-weight:
        800;

      margin-bottom:
        8px;

    }


    .loading-text {

      color:
        var(--muted);

      font-size:
        11px;

      line-height:
        1.9;

    }


    /* ERROR */

    .error-box {

      margin-top:
        25px;

      padding:
        24px;

      border-radius:
        23px;

      text-align:
        center;

      background:
        rgba(255,102,117,.06);

      border:
        1px solid
        rgba(255,102,117,.18);

    }


    .error-icon {

      font-size:
        32px;

      margin-bottom:
        12px;

    }


    .error-title {

      font-size:
        17px;

      font-weight:
        800;

      margin-bottom:
        10px;

    }


    .error-message {

      color:
        #ffb4bc;

      line-height:
        2;

      font-size:
        12px;

      white-space:
        pre-wrap;

      word-break:
        break-word;

    }


    .error-debug {

      direction:
        ltr;

      text-align:
        left;

      margin-top:
        15px;

      padding:
        12px;

      border-radius:
        12px;

      background:
        rgba(0,0,0,.22);

      color:
        #b8c8cc;

      font:
        10px/1.6
        Consolas,
        monospace;

      white-space:
        pre-wrap;

      word-break:
        break-word;

      max-height:
        220px;

      overflow:
        auto;

    }


    .retry {

      margin-top:
        17px;

      padding:
        11px 19px;

      border:
        0;

      border-radius:
        13px;

      background:
        linear-gradient(
          135deg,
          var(--blue2),
          var(--blue)
        );

      color:
        white;

      font-weight:
        700;

    }


    /* STATS */

    .stats {

      display:
        grid;

      grid-template-columns:
        repeat(4,1fr);

      gap:
        12px;

      margin-bottom:
        16px;

    }


    .stat {

      padding:
        18px;

      border-radius:
        21px;

    }


    .stat-label {

      color:
        var(--muted);

      font-size:
        11px;

      margin-bottom:
        10px;

    }


    .stat-value {

      font-size:
        24px;

      font-weight:
        800;

    }


    .stat-note {

      margin-top:
        8px;

      color:
        var(--muted);

      font-size:
        9px;

    }


    /* SECTIONS */

    .section {

      margin-bottom:
        16px;

    }


    .section-title {

      display:
        flex;

      align-items:
        center;

      justify-content:
        space-between;

      margin:
        0 3px 11px;

    }


    .section-title h2 {

      margin:
        0;

      font-size:
        16px;

    }


    .section-title span {

      color:
        var(--muted);

      font-size:
        10px;

    }


    /* OVERVIEW */

    .overview {

      display:
        grid;

      grid-template-columns:
        repeat(3,1fr);

      gap:
        12px;

    }


    .chart-card {

      padding:
        18px;

      border-radius:
        22px;

      text-align:
        center;

    }


    .chart {

      width:
        120px;

      height:
        120px;

      margin:
        0 auto 15px;

      border-radius:
        50%;

      display:
        grid;

      place-items:
        center;

      position:
        relative;

    }


    .chart::after {

      content:
        "";

      position:
        absolute;

      inset:
        13px;

      border-radius:
        50%;

      background:
        #0c2028;

    }


    .chart-center {

      position:
        relative;

      z-index:
        2;

    }


    .chart-number {

      font-size:
        21px;

      font-weight:
        800;

    }


    .chart-label {

      margin-top:
        4px;

      color:
        var(--muted);

      font-size:
        9px;

    }


    .chart-name {

      font-weight:
        800;

      font-size:
        12px;

    }


    .chart-detail {

      margin-top:
        6px;

      color:
        var(--muted);

      font-size:
        9px;

    }


    /* FINANCIAL */

    .financial {

      display:
        grid;

      grid-template-columns:
        repeat(3,1fr);

      gap:
        12px;

    }


    .money-card {

      padding:
        20px;

      border-radius:
        22px;

    }


    .money-label {

      color:
        var(--muted);

      font-size:
        11px;

    }


    .money-value {

      margin-top:
        11px;

      font-size:
        21px;

      font-weight:
        800;

      line-height:
        1.5;

    }


    .gold {
      color:
        var(--gold2);
    }


    .green {
      color:
        var(--success);
    }


    .red {
      color:
        var(--danger);
    }


    /* SEARCH */

    .toolbar {

      margin-bottom:
        10px;

    }


    .search {

      width:
        100%;

      padding:
        12px 14px;

      border-radius:
        14px;

      border:
        1px solid
        var(--border);

      background:
        rgba(255,255,255,.05);

      color:
        var(--text);

      outline:
        none;

      direction:
        rtl;

    }


    .search::placeholder {

      color:
        #71858d;

    }


    /* TABS */

    .tabs {

      display:
        flex;

      gap:
        7px;

      overflow-x:
        auto;

      scrollbar-width:
        none;

      margin-bottom:
        12px;

    }


    .tabs::-webkit-scrollbar {
      display:
        none;
    }


    .tab {

      flex:
        0 0 auto;

      padding:
        9px 14px;

      border-radius:
        999px;

      border:
        1px solid
        var(--border);

      background:
        rgba(255,255,255,.045);

      color:
        var(--muted);

      font-size:
        10px;

    }


    .tab.active {

      color:
        white;

      border-color:
        rgba(56,189,248,.30);

      background:
        linear-gradient(
          135deg,
          rgba(37,99,235,.25),
          rgba(56,189,248,.10)
        );

    }


    /* CARDS */

    .service-list {

      display:
        grid;

      grid-template-columns:
        repeat(2,1fr);

      gap:
        12px;

    }


    .service-card,
    .client-card {

      padding:
        18px;

      border-radius:
        22px;

    }


    .service-top {

      display:
        flex;

      justify-content:
        space-between;

      gap:
        10px;

      align-items:
        flex-start;

    }


    .service-name,
    .client-name {

      font-size:
        13px;

      font-weight:
        800;

      line-height:
        1.7;

    }


    .service-type,
    .client-meta {

      color:
        var(--muted);

      font-size:
        9px;

      margin-top:
        4px;

      line-height:
        1.7;

    }


    .badge {

      flex:
        0 0 auto;

      padding:
        6px 8px;

      border-radius:
        9px;

      font-size:
        8px;

    }


    .badge.success {

      color:
        var(--success);

      background:
        rgba(101,214,160,.09);

    }


    .badge.warning {

      color:
        var(--warning);

      background:
        rgba(244,201,107,.09);

    }


    .badge.danger {

      color:
        var(--danger);

      background:
        rgba(255,102,117,.09);

    }


    .badge.info {

      color:
        var(--blue);

      background:
        rgba(56,189,248,.09);

    }


    .service-grid,
    .client-details {

      display:
        grid;

      grid-template-columns:
        repeat(2,1fr);

      gap:
        8px;

      margin-top:
        14px;

    }


    .mini {

      padding:
        9px;

      border-radius:
        11px;

      background:
        rgba(255,255,255,.035);

      border:
        1px solid
        rgba(255,255,255,.05);

      min-width:
        0;

    }


    .mini-label {

      color:
        #71858d;

      font-size:
        8px;

      margin-bottom:
        5px;

    }


    .mini-value {

      color:
        #e9efed;

      font-size:
        10px;

      font-weight:
        700;

      line-height:
        1.6;

      word-break:
        break-word;

    }


    .empty {

      grid-column:
        1 / -1;

      padding:
        35px;

      text-align:
        center;

      color:
        var(--muted);

      border-radius:
        22px;

    }


    .footer {

      padding:
        18px;

      text-align:
        center;

      color:
        #63777e;

      font-size:
        9px;

    }


    @media (
      max-width:760px
    ) {

      .stats {

        grid-template-columns:
          repeat(2,1fr);

      }


      .overview {

        grid-template-columns:
          1fr;

      }


      .financial {

        grid-template-columns:
          1fr;

      }


      .service-list {

        grid-template-columns:
          1fr;

      }

    }


    @media (
      max-width:430px
    ) {

      .hero-content {

        align-items:
          flex-start;

        flex-direction:
          column;

      }


      .brand-title {

        font-size:
          19px;

      }


      .brand-logo {

        width:
          47px;

        height:
          47px;

      }

    }

  </style>

</head>


<body>


  <div class="app">

    <div
      id="loading"
      class="loading"
    >

      <div
        class="loader-box glass"
      >

        <div class="spinner"></div>

        <div class="loading-title">

          در حال اتصال به حسابگران آرمان

        </div>

        <div class="loading-text">

          در حال بررسی امنیت Telegram و دریافت اطلاعات داشبورد...

        </div>

      </div>

    </div>


    <div
      id="content"
      style="display:none;"
    ></div>

  </div>


  <script>

    /* ==================================================
       CONFIG
       ================================================== */

    const API_URL =
      'https://script.google.com/macros/s/AKfycbzK62xIUIm8VyTektiy9EKOZBnMeXb1bxIKtcCxKfABIYFezMNEH6yfcrWAeL34zmI/exec';


    const API_KEY =
      'HesabgaranArman_2026_Bot_7xK9pQ2';


    /* ==================================================
       STATE
       ================================================== */

    let dashboard =
      null;


    let activeTab =
      'all';


    let searchText =
      '';


    /* ==================================================
       TELEGRAM
       ================================================== */

    const tg =
      window.Telegram &&
      window.Telegram.WebApp
        ? window.Telegram.WebApp
        : null;


    /* ==================================================
       START
       ================================================== */

    document.addEventListener(
      'DOMContentLoaded',
      function () {

        if (tg) {

          try {

            tg.ready();

            tg.expand();

            tg.setHeaderColor(
              '#07131b'
            );

            tg.setBackgroundColor(
              '#07131b'
            );

          }

          catch (error) {

            console.warn(
              error
            );

          }

        }


        loadDashboard();

      }
    );


    /* ==================================================
       LOAD DASHBOARD
       ================================================== */

    async function loadDashboard() {

      try {

        showLoading();


        console.log(
          '===== DASHBOARD START ====='
        );


        if (!tg) {

          throw new Error(
            'Telegram WebApp پیدا نشد. این صفحه باید از داخل Telegram باز شود.'
          );

        }


        const initData =
          tg.initData || '';


        console.log(
          'initData exists:',
          Boolean(initData)
        );


        if (!initData) {

          throw new Error(
            'Telegram initData دریافت نشد. Mini App را از داخل ربات باز کنید.'
          );

        }


        const url =
          API_URL +
          '?action=getDashboard' +
          '&key=' +
          encodeURIComponent(
            API_KEY
          ) +
          '&initData=' +
          encodeURIComponent(
            initData
          ) +
          '&_=' +
          Date.now();


        console.log(
          'API:',
          API_URL
        );


        const response =
          await fetch(
            url,
            {
              method:
                'GET',

              cache:
                'no-store'
            }
          );


        console.log(
          'HTTP:',
          response.status
        );


        const raw =
          await response.text();


        console.log(
          '===== API RAW ====='
        );

        console.log(
          raw
        );

        console.log(
          '==================='
        );


        if (
          !response.ok
        ) {

          throw new Error(
            'HTTP ' +
            response.status +
            ': ' +
            raw
          );

        }


        if (
          !raw ||
          !raw.trim()
        ) {

          throw new Error(
            'سرور پاسخ خالی ارسال کرد.'
          );

        }


        let result;


        try {

          result =
            JSON.parse(
              raw
            );

        }

        catch (error) {

          console.error(
            'JSON PARSE ERROR:',
            error
          );


          throw new Error(
            'پاسخ سرور JSON معتبر نیست:\n\n' +
            raw
          );

        }


        console.log(
          '===== API PARSED ====='
        );

        console.log(
          result
        );

        console.log(
          '======================'
        );


        if (
          result.ok !== true
        ) {

          throw new Error(
            result.message ||
            result.error ||
            'Apps Script خطای نامشخصی برگرداند.'
          );

        }


        if (
          !result.data ||
          typeof result.data !== 'object'
        ) {

          throw new Error(
            'در پاسخ سرور بخش data وجود ندارد.'
          );

        }


        const data =
          result.data;


        if (
          !data.Summary
        ) {

          throw new Error(
            'بخش Summary در Dashboard وجود ندارد.'
          );

        }


        if (
          !Array.isArray(
            data.Clients
          )
        ) {

          throw new Error(
            'بخش Clients در Dashboard وجود ندارد.'
          );

        }


        if (
          !Array.isArray(
            data.Accounting
          )
        ) {

          throw new Error(
            'بخش Accounting در Dashboard وجود ندارد.'
          );

        }


        if (
          !Array.isArray(
            data.Tax
          )
        ) {

          throw new Error(
            'بخش Tax در Dashboard وجود ندارد.'
          );

        }


        if (
          !Array.isArray(
            data.Receivables
          )
        ) {

          throw new Error(
            'بخش Receivables در Dashboard وجود ندارد.'
          );

        }


        dashboard =
          data;


        console.log(
          'Dashboard loaded successfully.'
        );


        render();


      }

      catch (error) {

        console.error(
          '===== DASHBOARD ERROR ====='
        );

        console.error(
          error
        );

        console.error(
          '==========================='
        );


        showDashboardError(
          error
        );

      }

    }


    /* ==================================================
       ERROR
       ================================================== */

    function showDashboardError(
      error
    ) {

      const message =
        error &&
        error.message
          ? String(
              error.message
            )
          : String(
              error ||
              'خطای نامشخص'
            );


      const content =
        document.getElementById(
          'content'
        );


      const loading =
        document.getElementById(
          'loading'
        );


      if (loading) {

        loading.style.display =
          'none';

      }


      if (!content) {

        return;

      }


      content.style.display =
        'block';


      content.innerHTML = `

        <div class="error-box glass">

          <div class="error-icon">
            ⚠️
          </div>

          <div class="error-title">
            خطا در دریافت اطلاعات داشبورد
          </div>

          <div class="error-message">
            ${escapeHtml(message)}
          </div>

          <div class="error-debug">
            API:
            ${escapeHtml(API_URL)}

            \n\n

            Time:
            ${escapeHtml(
              new Date().toString()
            )}
          </div>

          <button
            class="retry"
            onclick="location.reload()"
          >
            تلاش مجدد
          </button>

        </div>

      `;

    }


    /* ==================================================
       RENDER
       ================================================== */

    function render() {

      const content =
        document.getElementById(
          'content'
        );


      content.style.display =
        'block';


      content.innerHTML =

        renderHero() +

        renderStats() +

        renderOverview() +

        renderFinancial() +

        renderServices() +

        `

          <div class="footer">

            حسابگران آرمان · سامانه مدیریت اطلاعات مؤسسه

          </div>

        `;


      document.getElementById(
        'loading'
      ).style.display =
        'none';


      bindEvents();

    }


    /* ==================================================
       HERO
       ================================================== */

    function renderHero() {

      return `

        <section class="hero glass">

          <div class="hero-content">

            <div class="brand">

              <div class="brand-logo">
                🏛️
              </div>

              <div>

                <h1 class="brand-title">
                  حسابگران آرمان
                </h1>

                <div class="brand-subtitle">
                  سامانه مدیریت اطلاعات مؤسسه
                </div>

              </div>

            </div>

            <div class="secure">

              <span class="secure-dot"></span>

              اتصال امن Telegram

            </div>

          </div>

        </section>

      `;

    }


    /* ==================================================
       STATS
       ================================================== */

    function renderStats() {

      const s =
        dashboard.Summary;


      return `

        <section class="stats">

          ${statCard(
            'مراجعین',
            s.ClientsCount,
            s.ActiveClients + ' فعال'
          )}

          ${statCard(
            'کارهای حسابداری',
            s.AccountingCount,
            s.AccountingCompleted + ' انجام شده'
          )}

          ${statCard(
            'پرونده‌های مالیاتی',
            s.TaxCount,
            s.TaxCompleted + ' انجام شده'
          )}

          ${statCard(
            'مانده دریافتنی',
            formatMoneyShort(
              s.RemainingReceivables
            ),
            formatMoneyShort(
              s.TotalCollected
            ) + ' دریافت شده'
          )}

        </section>

      `;

    }


    function statCard(
      label,
      value,
      note
    ) {

      return `

        <div class="stat glass">

          <div class="stat-label">
            ${escapeHtml(label)}
          </div>

          <div class="stat-value">
            ${escapeHtml(
              typeof value === 'number'
                ? number(value)
                : String(value)
            )}
          </div>

          <div class="stat-note">
            ${escapeHtml(
              String(note)
            )}
          </div>

        </div>

      `;

    }


    /* ==================================================
       OVERVIEW
       ================================================== */

    function renderOverview() {

      const s =
        dashboard.Summary;


      return `

        <section class="section">

          <div class="section-title">

            <h2>
              نمای کلی
            </h2>

            <span>
              وضعیت فعلی
            </span>

          </div>

          <div class="overview">

            ${chartCard(
              'مراجعین',
              s.ActiveClients,
              s.ClientsCount
            )}

            ${chartCard(
              'حسابداری',
              s.AccountingCompleted,
              s.AccountingCount
            )}

            ${chartCard(
              'مالیاتی',
              s.TaxCompleted,
              s.TaxCount
            )}

          </div>

        </section>

      `;

    }


    function chartCard(
      title,
      done,
      total
    ) {

      const d =
        Number(done) || 0;


      const t =
        Number(total) || 0;


      const percent =
        t > 0
          ? Math.round(
              d / t * 100
            )
          : 0;


      return `

        <div class="chart-card glass">

          <div
            class="chart"
            style="
              background:
              conic-gradient(
                var(--blue)
                ${percent}%,
                rgba(255,255,255,.08)
                ${percent}% 100%
              );
            "
          >

            <div class="chart-center">

              <div class="chart-number">
                ${number(percent)}%
              </div>

              <div class="chart-label">
                ${number(d)}
                از
                ${number(t)}
              </div>

            </div>

          </div>

          <div class="chart-name">
            ${escapeHtml(title)}
          </div>

          <div class="chart-detail">
            انجام شده
          </div>

        </div>

      `;

    }


    /* ==================================================
       FINANCIAL
       ================================================== */

    function renderFinancial() {

      const s =
        dashboard.Summary;


      return `

        <section class="section">

          <div class="section-title">

            <h2>
              وضعیت مالی
            </h2>

            <span>
              دریافتنی‌ها
            </span>

          </div>

          <div class="financial">

            <div class="money-card glass">

              <div class="money-label">
                کل دریافتنی
              </div>

              <div class="money-value gold">
                ${formatMoney(
                  s.TotalReceivables
                )}
              </div>

            </div>

            <div class="money-card glass">

              <div class="money-label">
                دریافت شده
              </div>

              <div class="money-value green">
                ${formatMoney(
                  s.TotalCollected
                )}
              </div>

            </div>

            <div class="money-card glass">

              <div class="money-label">
                مانده دریافتنی
              </div>

              <div class="money-value red">
                ${formatMoney(
                  s.RemainingReceivables
                )}
              </div>

            </div>

          </div>

        </section>

      `;

    }


    /* ==================================================
       SERVICES
       ================================================== */

    function renderServices() {

      const items =
        getFilteredItems();


      return `

        <section class="section">

          <div class="section-title">

            <h2>
              خدمات و پیگیری‌ها
            </h2>

            <span>
              ${number(
                items.length
              )} مورد
            </span>

          </div>

          <div class="toolbar">

            <input
              id="searchInput"
              class="search"
              type="search"
              placeholder="جستجو..."
              value="${escapeHtml(
                searchText
              )}"
            >

          </div>

          <div class="tabs">

            ${tab(
              'all',
              'همه'
            )}

            ${tab(
              'accounting',
              'حسابداری'
            )}

            ${tab(
              'tax',
              'مالیاتی'
            )}

            ${tab(
              'clients',
              'مراجعین'
            )}

          </div>

          <div class="service-list">

            ${
              items.length
                ? items
                    .map(
                      renderItem
                    )
                    .join('')
                : `
                  <div class="empty glass">
                    موردی پیدا نشد.
                  </div>
                `
            }

          </div>

        </section>

      `;

    }


    function tab(
      id,
      title
    ) {

      return `

        <button
          class="tab ${
            activeTab === id
              ? 'active'
              : ''
          }"
          data-tab="${id}"
          type="button"
        >
          ${escapeHtml(title)}
        </button>

      `;

    }


    /* ==================================================
       FILTER
       ================================================== */

    function getFilteredItems() {

      let items = [];


      if (
        activeTab === 'all' ||
        activeTab === 'tax'
      ) {

        dashboard.Tax.forEach(
          function (item) {

            items.push({

              type:
                'tax',

              data:
                item

            });

          }
        );

      }


      if (
        activeTab === 'all' ||
        activeTab === 'accounting'
      ) {

        dashboard.Accounting.forEach(
          function (item) {

            items.push({

              type:
                'accounting',

              data:
                item

            });

          }
        );

      }


      if (
        activeTab === 'all' ||
        activeTab === 'clients'
      ) {

        dashboard.Clients.forEach(
          function (item) {

            items.push({

              type:
                'client',

              data:
                item

            });

          }
        );

      }


      const q =
        normalize(
          searchText
        );


      if (!q) {

        return items;

      }


      return items.filter(
        function (item) {

          return normalize(
            JSON.stringify(
              item.data
            )
          ).includes(q);

        }
      );

    }


    /* ==================================================
       ITEM RENDER
       ================================================== */

    function renderItem(
      item
    ) {

      if (
        item.type === 'tax'
      ) {

        return renderTax(
          item.data
        );

      }


      if (
        item.type === 'accounting'
      ) {

        return renderAccounting(
          item.data
        );

      }


      return renderClient(
        item.data
      );

    }


    /* ==================================================
       TAX
       ================================================== */

    function renderTax(d) {

      return `

        <article class="service-card glass">

          <div class="service-top">

            <div>

              <div class="service-name">

                ${escapeHtml(
                  d['نام مراجعه کننده']
                )}

              </div>

              <div class="service-type">

                ${escapeHtml(
                  d['نوع پرونده']
                )}

                ·

                ${escapeHtml(
                  d['مرحله پرونده']
                )}

              </div>

            </div>

            ${badge(
              d['وضعیت'],
              d['الویت']
            )}

          </div>

          <div class="service-grid">

            ${mini(
              'دوره مالی',
              d['دوره مالی']
            )}

            ${mini(
              'سررسید',
              d['تاریخ سررسید']
            )}

            ${mini(
              'روز باقی‌مانده',
              d['روزهای باقی مانده']
            )}

            ${mini(
              'منتظر',
              d['منتظر چه کسی']
            )}

          </div>

          <div
            class="mini"
            style="margin-top:8px"
          >

            <div class="mini-label">
              شرح کار
            </div>

            <div class="mini-value">

              ${escapeHtml(
                d['شرح کار']
              )}

            </div>

          </div>

        </article>

      `;

    }


    /* ==================================================
       ACCOUNTING
       ================================================== */

    function renderAccounting(d) {

      return `

        <article class="service-card glass">

          <div class="service-top">

            <div>

              <div class="service-name">

                ${escapeHtml(
                  d['نام مراجعه کننده']
                )}

              </div>

              <div class="service-type">

                ${escapeHtml(
                  d['نوع کار']
                )}

              </div>

            </div>

            ${badge(
              d['وضعیت'],
              d['الویت']
            )}

          </div>

          <div class="service-grid">

            ${mini(
              'دوره مالی',
              d['دوره مالی']
            )}

            ${mini(
              'سررسید',
              d['تاریخ سررسید']
            )}

            ${mini(
              'روز باقی‌مانده',
              d['روزهای باقی مانده']
            )}

            ${mini(
              'منتظر',
              d['منتظر چه کسی']
            )}

          </div>

          <div
            class="mini"
            style="margin-top:8px"
          >

            <div class="mini-label">
              شرح کار
            </div>

            <div class="mini-value">

              ${escapeHtml(
                d['شرح کار']
              )}

            </div>

          </div>

        </article>

      `;

    }


    /* ==================================================
       CLIENT
       ================================================== */

    function renderClient(d) {

      return `

        <article class="client-card glass">

          <div class="service-top">

            <div>

              <div class="client-name">

                ${escapeHtml(
                  d['نام شخص/شرکت']
                )}

              </div>

              <div class="client-meta">

                ${escapeHtml(
                  d['نوع شخصیت']
                )}

                ·

                ${escapeHtml(
                  d['نوع فعالیت']
                )}

              </div>

            </div>

            ${badge(
              d['وضعیت همکاری'],
              ''
            )}

          </div>

          <div class="client-details">

            ${mini(
              'خدمات',
              d['نوع خدمات']
            )}

            ${mini(
              'صورتحساب',
              d['نوع صورتحساب']
            )}

            ${mini(
              'حق‌الزحمه',
              d['حق الزحمه ماهانه']
                ? formatMoney(
                    d['حق الزحمه ماهانه']
                  )
                : '—'
            )}

            ${mini(
              'شروع همکاری',
              d['تاریخ شروع همکاری']
            )}

            ${mini(
              'موبایل',
              d['شماره موبایل']
            )}

            ${mini(
              'شهر',
              d['شهر']
            )}

          </div>

        </article>

      `;

    }


    /* ==================================================
       BADGE
       ================================================== */

    function badge(
      status,
      priority
    ) {

      const s =
        String(
          status ||
          ''
        );


      const p =
        String(
          priority ||
          ''
        );


      let cls =
        'info';


      if (
        s.includes(
          'انجام نشده'
        ) ||
        s.includes(
          'دریافت نشده'
        )
      ) {

        cls =
          'warning';

      }


      if (
        p.includes(
          'فوری'
        )
      ) {

        cls =
          'danger';

      }


      if (
        s.includes(
          'انجام شده'
        ) ||
        s.includes(
          'فعال'
        ) ||
        s.includes(
          'دریافت شده'
        )
      ) {

        cls =
          'success';

      }


      return `

        <span class="badge ${cls}">

          ${escapeHtml(
            p ||
            s ||
            '—'
          )}

        </span>

      `;

    }


    /* ==================================================
       MINI
       ================================================== */

    function mini(
      label,
      value
    ) {

      if (
        value === null ||
        value === undefined ||
        value === ''
      ) {

        value =
          '—';

      }


      return `

        <div class="mini">

          <div class="mini-label">

            ${escapeHtml(
              label
            )}

          </div>

          <div class="mini-value">

            ${escapeHtml(
              String(value)
            )}

          </div>

        </div>

      `;

    }


    /* ==================================================
       EVENTS
       ================================================== */

    function bindEvents() {

      const input =
        document.getElementById(
          'searchInput'
        );


      if (input) {

        input.addEventListener(
          'input',
          function (event) {

            searchText =
              event.target.value;

            render();

          }
        );

      }


      document
        .querySelectorAll(
          '[data-tab]'
        )
        .forEach(
          function (button) {

            button.addEventListener(
              'click',
              function () {

                activeTab =
                  button.dataset.tab;

                render();

              }
            );

          }
        );

    }


    /* ==================================================
       LOADING
       ================================================== */

    function showLoading() {

      const loading =
        document.getElementById(
          'loading'
        );


      const content =
        document.getElementById(
          'content'
        );


      if (loading) {

        loading.style.display =
          'grid';

      }


      if (content) {

        content.style.display =
          'none';

      }

    }


    /* ==================================================
       NUMBER
       ================================================== */

    function number(
      value
    ) {

      const n =
        Number(value);


      if (
        !isFinite(n)
      ) {

        return '۰';

      }


      return n.toLocaleString(
        'fa-IR'
      );

    }


    /* ==================================================
       MONEY
       ================================================== */

    function formatMoney(
      value
    ) {

      const n =
        Number(value) || 0;


      return (
        n.toLocaleString(
          'fa-IR'
        ) +
        ' ریال'
      );

    }


    function formatMoneyShort(
      value
    ) {

      const n =
        Number(value) || 0;


      if (
        n >= 1000000000
      ) {

        return (
          (
            n / 1000000000
          ).toLocaleString(
            'fa-IR',
            {
              maximumFractionDigits:
                1
            }
          ) +
          ' میلیارد'
        );

      }


      if (
        n >= 1000000
      ) {

        return (
          (
            n / 1000000
          ).toLocaleString(
            'fa-IR',
            {
              maximumFractionDigits:
                1
            }
          ) +
          ' میلیون'
        );

      }


      if (
        n >= 1000
      ) {

        return (
          (
            n / 1000
          ).toLocaleString(
            'fa-IR',
            {
              maximumFractionDigits:
                1
            }
          ) +
          ' هزار'
        );

      }


      return number(n);

    }


    /* ==================================================
       NORMALIZE
       ================================================== */

    function normalize(
      value
    ) {

      return String(
        value ||
        ''
      )
        .toLowerCase()
        .replace(
          /ي/g,
          'ی'
        )
        .replace(
          /ى/g,
          'ی'
        )
        .replace(
          /ك/g,
          'ک'
        )
        .replace(
          /\u200c/g,
          ' '
        )
        .trim();

    }


    /* ==================================================
       ESCAPE HTML
       ================================================== */

    function escapeHtml(
      value
    ) {

      if (
        value === null ||
        value === undefined
      ) {

        return '—';

      }


      return String(value)

        .replace(
          /&/g,
          '&amp;'
        )

        .replace(
          /</g,
          '&lt;'
        )

        .replace(
          />/g,
          '&gt;'
        )

        .replace(
          /"/g,
          '&quot;'
        )

        .replace(
          /'/g,
          '&#039;'
        );

    }

  </script>

</body>

</html>
