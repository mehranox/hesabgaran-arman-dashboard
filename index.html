<!DOCTYPE html>
<html lang="fa" dir="rtl">

<meta charset="UTF-8">

<meta

<style>

:root {

  --bg:#071522;
  --bg2:#0b1c2d;

  --blue:#3b82f6;
  --blue2:#2563eb;
  --azure:#38bdf8;

  --olive:#8f9f4d;
  --gold:#d8b86c;

  --green:#4ade80;
  --red:#fb7185;
  --orange:#fb923c;

  --text:#f5f9ff;
  --muted:#9eb1c5;

  --radius:22px;
}


* {
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}


html,
body {

  margin:0;
  padding:0;

  min-height:100%;

  background:
    radial-gradient(
      circle at 50% -10%,
      rgba(56,189,248,.08),
      transparent 40%
    ),
    linear-gradient(
      145deg,
      var(--bg),
      var(--bg2)
    );

  color:var(--text);

  font-family:
    Tahoma,
    Arial,
    sans-serif;
}


body {
  overflow-x:hidden;
}


button,
input {
  font-family:inherit;
}


.app {

  width:min(1180px, 100%);

  margin:auto;

  padding:
    20px
    18px
    40px;
}


/* =========================
   HEADER
========================= */

.header {

  display:flex;

  align-items:center;
  justify-content:space-between;

  gap:15px;

  padding:
    10px 5px
    25px;
}


.brand {

  display:flex;

  align-items:center;

  gap:12px;
}


.logo {

  width:52px;
  height:52px;

  display:flex;

  align-items:center;
  justify-content:center;

  border-radius:16px;

  background:
    linear-gradient(
      145deg,
      rgba(216,184,108,.22),
      rgba(59,130,246,.18)
    );

  border:
    1px solid
    rgba(216,184,108,.3);

  font-size:27px;

  box-shadow:
    0 10px 30px
    rgba(0,0,0,.2);
}


.brand-title {

  font-family:
    "Noto Nastaliq Urdu",
    serif;

  font-size:25px;

  color:#fff;

  line-height:1.8;
}


.brand-status {

  color:var(--green);

  font-size:11px;

  margin-top:2px;
}


/* =========================
   HERO
========================= */

.hero {

  position:relative;

  min-height:245px;

  overflow:hidden;

  border-radius:30px;

  display:flex;

  align-items:center;
  justify-content:center;

  margin-bottom:18px;

  background:
    radial-gradient(
      circle at 50% 45%,
      rgba(59,130,246,.13),
      transparent 42%
    ),
    linear-gradient(
      145deg,
      rgba(255,255,255,.055),
      rgba(255,255,255,.018)
    );

  border:
    1px solid
    rgba(255,255,255,.08);

  box-shadow:
    0 25px 80px
    rgba(0,0,0,.3);

  isolation:isolate;
}


.hero::before {

  content:"";

  position:absolute;

  inset:-30%;

  background:
    radial-gradient(
      circle,
      rgba(56,189,248,.07),
      transparent 45%
    );

  animation:
    heroPulse 7s ease-in-out infinite;

  z-index:-1;
}


@keyframes heroPulse {

  0%,100% {
    transform:scale(1);
    opacity:.5;
  }

  50% {
    transform:scale(1.18);
    opacity:1;
  }
}


.orb {

  position:relative;

  width:154px;
  height:154px;

  border-radius:50%;

  background:
    conic-gradient(
      from 0deg,
      var(--blue),
      var(--azure),
      var(--olive),
      var(--gold),
      var(--blue)
    );

  animation:
    orbRotate 14s linear infinite;

  box-shadow:
    0 0 35px
    rgba(56,189,248,.3),

    0 0 80px
    rgba(59,130,246,.12);
}


.orb::before {

  content:"";

  position:absolute;

  inset:9px;

  border-radius:50%;

  background:
    radial-gradient(
      circle at 30% 25%,
      rgba(255,255,255,.25),
      transparent 15%
    ),
    radial-gradient(
      circle at center,
      #112d43,
      #071522 72%
    );

  border:
    1px solid
    rgba(255,255,255,.08);
}


.orb::after {

  content:"";

  position:absolute;

  inset:-14px;

  border-radius:50%;

  border:
    1px solid
    rgba(56,189,248,.15);

  box-shadow:
    0 0 35px
    rgba(56,189,248,.12);
}


@keyframes orbRotate {

  to {
    transform:rotate(360deg);
  }
}


/* =========================
   STATS
========================= */

.stats {

  display:grid;

  grid-template-columns:
    repeat(4,1fr);

  gap:12px;

  margin-bottom:18px;
}


.stat {

  padding:18px;

  border-radius:var(--radius);

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.055),
      rgba(255,255,255,.018)
    );

  border:
    1px solid
    rgba(255,255,255,.07);

  box-shadow:
    0 15px 40px
    rgba(0,0,0,.16);
}


.stat-label {

  color:var(--muted);

  font-size:12px;

  margin-bottom:10px;
}


.stat-value {

  font-size:25px;

  font-weight:700;
}


.stat-value.blue {
  color:var(--azure);
}


.stat-value.green {
  color:var(--green);
}


.stat-value.gold {
  color:var(--gold);
}


.stat-value.orange {
  color:var(--orange);
}


/* =========================
   SECTION
========================= */

.section {

  margin-bottom:18px;
}


.section-title {

  display:flex;

  align-items:center;

  justify-content:space-between;

  margin-bottom:12px;

  font-size:16px;

  font-weight:700;
}


.section-title span {

  color:var(--muted);

  font-size:11px;

  font-weight:400;
}


/* =========================
   CARD
========================= */

.card {

  padding:17px;

  border-radius:var(--radius);

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.05),
      rgba(255,255,255,.015)
    );

  border:

    rgba(255,255,255,.07);

  box-shadow:
    0 15px 40px
    rgba(0,0,0,.15);

  margin-bottom:10px;
}


.card-top {

  display:flex;

  justify-content:space-between;

  align-items:flex-start;

  gap:12px;
}


.card-title {

  font-weight:700;

  font-size:14px;

  line-height:1.8;
}


.card-sub {

  color:var(--muted);

  font-size:12px;

  line-height:1.8;

  margin-top:5px;
}


.badge {

  flex:none;

  padding:

  border-radius:999px;

  font-size:10px;

  border:
    1px solid
    rgba(255,255,255,.1);
}


.badge-red {

  color:#fecdd3;

  background:
    rgba(251,113,133,.12);
}


.badge-orange {

  color:#fed7aa;

  background:
    rgba(251,146,60,.12);
}


.badge-blue {

  color:#bae6fd;

  background:
    rgba(56,189,248,.10);
}


.badge-green {

  color:#bbf7d0;

  background:
    rgba(74,222,128,.10);
}


/* =========================
   FINANCIAL
========================= */

.finance-grid {

  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:12px;
}


.finance-box {

  padding:18px;

  border-radius:18px;

  background:
    rgba(255,255,255,.035);

  border:
    1px solid
    rgba(255,255,255,.06);
}


.finance-label {

  font-size:11px;

  color:var(--muted);

  margin-bottom:9px;
}


.finance-value {

  font-size:19px;

  font-weight:700;
}


/* =========================
   SEARCH
========================= */

.search {

  width:100%;

  padding:
    15px 17px;

  border-radius:18px;

  border:
    1px solid
    rgba(255,255,255,.08);

  outline:none;

  color:#fff;

  background:
    rgba(255,255,255,.045);

  margin-bottom:15px;

  font-size:13px;
}


.search::placeholder {

}


.search:focus {

  border-color:
    rgba(56,189,248,.4);

  box-shadow:
    0 0 0 3px
    rgba(56,189,248,.06);
}


/* =========================
   TABS
========================= */

.tabs {

  display:flex;

  gap:8px;

  overflow-x:auto;

  scrollbar-width:none;

  margin-bottom:15px;
}


.tabs::-webkit-scrollbar {
  display:none;
}


.tab {

  flex:none;

  border:none;

  color:var(--muted);

  background:
    rgba(255,255,255,.035);

  border:
    1px solid
    rgba(255,255,255,.06);

  border-radius:13px;

  padding:
    10px 14px;

  cursor:pointer;

  font-size:12px;
}


.tab.active {

  color:#fff;

  background:
    linear-gradient(
      135deg,
      rgba(59,130,246,.25),
      rgba(56,189,248,.1)
    );

  border-color:
    rgba(56,189,248,.3);
}


/* =========================
   EMPTY
========================= */

.empty {

  padding:40px 20px;

  text-align:center;

  color:var(--muted);

  border-radius:20px;

  border:
    1px dashed
    rgba(255,255,255,.08);
}


/* =========================
   LOADING
========================= */

.loading {

  min-height:220px;

  display:flex;

  align-items:center;

  justify-content:center;

  color:var(--muted);

  font-size:13px;
}


.spinner {

  width:26px;
  height:26px;

  border-radius:50%;

  border:
    2px solid
    rgba(255,255,255,.1);

  border-top-color:
    var(--azure);

  animation:
    spin .8s linear infinite;

  margin-left:10px;
}


@keyframes spin {

  to {
    transform:rotate(360deg);
  }
}


/* =========================
   ERROR
========================= */

.error-box {

  padding:22px;

  border-radius:20px;

  background:
    rgba(251,113,133,.07);

  border:
    1px solid
    rgba(251,113,133,.18);

  color:#fecdd3;

  line-height:2;

  font-size:12px;
}


.error-title {

  font-weight:700;

  color:#fff;

  margin-bottom:8px;

  font-size:15px;
}


/* =========================
   FOOTER
========================= */

.footer {

  text-align:center;

  color:#60758a;

  font-size:10px;

  padding:20px;
}


/* =========================
   TOUCH LIGHT
========================= */

.touch-light {

  position:fixed;

  width:130px;
  height:130px;

  border-radius:50%;

  pointer-events:none;

  transform:
    translate(-50%,-50%)
    scale(.4);

  opacity:.3;

  filter:blur(18px);

  z-index:9999;

  animation:
    touchLight .75s ease-out forwards;
}


@keyframes touchLight {

  0% {
    transform:
      translate(-50%,-50%)
      scale(.35);

    opacity:.3;
  }

  100% {
    transform:
      translate(-50%,-50%)
      scale(2.5);

    opacity:0;
  }
}


/* =========================
   RESPONSIVE
========================= */

@media(max-width:900px) {

  .stats {
    grid-template-columns:

}


@media(max-width:700px) {

    padding:14px 12px 30px;

  }

  .finance-grid {
    grid-template-columns:

  }

}


@media(max-width:420px) {

    height:46px;

  }

  .orb {
    width:135px;

  }

  .stats {
    gap:8px;
  }

  .stat {
    padding:14px;
  }

  .stat-value {
    font-size:21px;
  }

}

</style>

<body>

<script>

/* =========================================================
   CONFIG
========================================================= */

const API_URL =
  'https://script.google.com/macros/s/AKfycbzK62xIUIm8VyTektiy9EKOZBnMeXb1bxIKtcCxKfABIYFezMNEH6yfcrWAeL34zmI/exec';


const API_KEY =
  'HesabgaranArman_2026_Bot_7xK9pQ2';


/* =========================================================
   TELEGRAM
========================================================= */

const tg =
  window.Telegram &&
  window.Telegram.WebApp
    ? window.Telegram.WebApp
    : null;


if (tg) {

  tg.ready();

  tg.expand();

}


/* =========================================================
   STATE
========================================================= */

let dashboard = null;

let activeTab = 'overview';

let searchTerm = '';


/* =========================================================
   LOAD DASHBOARD
========================================================= */

async function loadDashboard() {

  const content =
    document.getElementById('content');

  const urgent =
    document.getElementById('urgentContent');


  if (!tg) {

    showFatalError(
      'این صفحه باید از داخل Telegram باز شود.'
    );

    return;
  }


  /*
   * مهم‌ترین قسمت:
   * فقط initData خام Telegram
   */

  const initData =
    tg.initData || '';


  if (!initData) {

    showFatalError(
      'Telegram initData دریافت نشد.<br><br>' +

      'لطفاً داشبورد را مستقیماً از دکمه «ورود به داشبورد» داخل ربات باز کنید و لینک Web App را در مرورگر معمولی باز نکنید.'
    );

    return;
  }


  try {

    const response =
      await fetch(
        API_URL,
        {
          method:'POST',

          headers:{
            'Content-Type':
              'text/plain;charset=utf-8'
          },

          body:JSON.stringify({

            action:'getDashboard',

            key:API_KEY,

            initData:initData

          })
        }
      );


    if (!response.ok) {

      throw new Error(
        'HTTP ' + response.status
      );
    }


    const result =
      await response.json();


    if (!result.ok) {

      if (
        result.error ===
        'INVALID_INIT_DATA'
      ) {

        throw new Error(
          result.message ||
          'Telegram initData معتبر نیست.'
        );
      }


      if (
        result.error ===
        'ACCESS_DENIED'
      ) {

        throw new Error(
          'این حساب Telegram اجازه ورود به داشبورد را ندارد.'
        );
      }


      throw new Error(
        result.message ||
        'خطا در دریافت اطلاعات.'
      );
    }


    dashboard =
      result.data;


    updateStats();

    renderUrgent();

    renderContent();

  } catch (error) {

    console.error(error);

    showFatalError(
      error.message ||
      'خطا در ارتباط با سرور.'
    );
  }

}


/* =========================================================
   ERROR
========================================================= */

function showFatalError(message) {

  const html = `

    <div class="error-box">

      <div class="error-title">
        ⚠️ خطا در ورود به داشبورد
      </div>

      ${message}

    </div>

  `;


  document.getElementById(
    'content'
  ).innerHTML = html;


  document.getElementById(
    'urgentContent'
  ).innerHTML = html;

}


/* =========================================================
   NUMBER
========================================================= */

function num(value) {

  const n =
    Number(value || 0);

  return n.toLocaleString('fa-IR');

}


/* =========================================================
   MONEY
========================================================= */

function money(value) {

  /*
   * داده‌ها از backend ریال هستند.
   * نمایش تومان.
   */

  const toman =
    Number(value || 0) / 10;


  return toman.toLocaleString(
    'fa-IR'
  ) + ' تومان';
}


/* =========================================================
   NORMALIZE
========================================================= */

function normalize(value) {

  return String(value || '')
    .replace(/ي/g,'ی')
    .replace(/ى/g,'ی')
    .replace(/ك/g,'ک')
    .replace(/\u200c/g,'')
    .toLowerCase()
    .trim();
}


/* =========================================================
   PRIORITY
========================================================= */

function priorityValue(value) {

  const v =
    normalize(value);


  if (
    v.includes('فوری')
  ) return 3;


  if (
    v.includes('بالا')
  ) return 2;


  return 1;
}


/* =========================================================
   COMPLETED
========================================================= */

function completed(item) {

  const status =
    normalize(
      item['وضعیت']
    );


  return (
    status.includes('انجام شده') &&
    !status.includes('انجام نشده')
  );
}


/* =========================================================
   DAYS
========================================================= */

function daysRemaining(item) {

  const value =
    Number(
      item['روزهای باقی مانده']
    );


  if (!isNaN(value)) {
    return value;
  }


  return 999999;
}


/* =========================================================
   GET ALL TASKS
========================================================= */

function allTasks() {

  const accounting =
    (dashboard.Accounting || [])
      .map(function(item) {

        return {
          ...item,
          __type:'حسابداری'
        };

      });


  const tax =
    (dashboard.Tax || [])
      .map(function(item) {

        return {
          ...item,
          __type:'مالیاتی'
        };

      });


  return [
    ...accounting,
    ...tax
  ];
}


/* =========================================================
   URGENT
========================================================= */

function renderUrgent() {

  const container =
    document.getElementById(
      'urgentContent'
    );


  let tasks =
    allTasks()
      .filter(function(item) {

        return (
          priorityValue(
            item['الویت']
          ) >= 2 &&
          !completed(item)
        );

      });


  tasks.sort(function(a,b) {

    const p =
      priorityValue(
        b['الویت']
      ) -
      priorityValue(
        a['الویت']
      );


    if (p !== 0) {
      return p;
    }


    return (
      daysRemaining(a) -
      daysRemaining(b)
    );

  });


  tasks =
    tasks.slice(0,8);


  if (!tasks.length) {

    container.innerHTML = `

      <div class="empty">
        کار فوری یا با اولویت بالا وجود ندارد.
      </div>

    `;

    return;
  }


  container.innerHTML =
    tasks
      .map(renderTask)
      .join('');
}


/* =========================================================
   TASK CARD
========================================================= */

function renderTask(item) {

  const priority =
    priorityValue(
      item['الویت']
    );


  let badgeClass =
    'badge-blue';


  if (priority === 3) {
    badgeClass =
      'badge-red';
  }

  else if (priority === 2) {
    badgeClass =
      'badge-orange';
  }


  return `

    <div class="card">

      <div class="card-top">

        <div>

          <div class="card-title">
            ${escapeHtml(
              item['نام مراجعه کننده'] ||
              'بدون نام'
            )}
          </div>

          <div class="card-sub">
            ${escapeHtml(
              item['شرح کار'] ||
              ''
            )}
          </div>

          <div class="card-sub">
            ${escapeHtml(
              item.__type ||
              ''
            )}
            ${item['تاریخ سررسید']
              ? ' • سررسید: ' +
                escapeHtml(
                  item['تاریخ سررسید']
                )
              : ''}
          </div>

        </div>


        <div class="
          badge
          ${badgeClass}
        ">

          ${escapeHtml(
            item['الویت'] ||
            'عادی'
          )}

        </div>

      </div>

    </div>

  `;
}


/* =========================================================
   STATS
========================================================= */

function updateStats() {

  const s =
    dashboard.Summary || {};


  document.getElementById(
    'activeClients'
  ).textContent =
    num(
      s.ActiveClients || 0
    );


  document.getElementById(
    'accountingCount'
  ).textContent =
    num(
      s.AccountingCount || 0
    );


  document.getElementById(
    'taxCount'
  ).textContent =
    num(
      s.TaxCount || 0
    );


  document.getElementById(
    'remainingReceivables'
  ).textContent =
    money(
      s.RemainingReceivables || 0
    );


  document.getElementById(
    'totalReceivables'
  ).textContent =
    money(
      s.TotalReceivables || 0
    );


  document.getElementById(
    'totalCollected'
  ).textContent =
    money(
      s.TotalCollected || 0
    );


  document.getElementById(
    'remainingFinance'
  ).textContent =
    money(
      s.RemainingReceivables || 0
    );
}


/* =========================================================
   SEARCH
========================================================= */

function matchesSearch(item) {

  if (!searchTerm) {
    return true;
  }


  const q =
    normalize(searchTerm);


  return Object.values(item)
    .some(function(value) {

      return normalize(value)
        .includes(q);

    });
}


/* =========================================================
   CONTENT
========================================================= */

function renderContent() {

  const container =
    document.getElementById(
      'content'
    );


  let items = [];


  if (activeTab === 'accounting') {

    items =
      (dashboard.Accounting || [])
        .filter(matchesSearch);

    container.innerHTML =
      renderTaskList(items);

    return;
  }


  if (activeTab === 'tax') {

    items =
      (dashboard.Tax || [])
        .filter(matchesSearch);

    container.innerHTML =
      renderTaskList(items);

    return;
  }


  if (activeTab === 'clients') {

    items =
      (dashboard.Clients || [])
        .filter(matchesSearch);

    container.innerHTML =
      renderClients(items);

    return;
  }


  if (activeTab === 'receivables') {

    items =
      (dashboard.Receivables || [])
        .filter(matchesSearch);

    container.innerHTML =
      renderReceivables(items);

    return;
  }


  /*
   * overview
   */

  items =
    allTasks()
      .filter(function(item) {

        return (
          !completed(item) &&
          matchesSearch(item)
        );

      });


  items.sort(function(a,b) {

    const p =
      priorityValue(
        b['الویت']
      ) -
      priorityValue(
        a['الویت']
      );


    if (p !== 0) {
      return p;
    }


    return (
      daysRemaining(a) -
      daysRemaining(b)
    );

  });


  container.innerHTML =
    renderTaskList(
      items.slice(0,12)
    );
}


/* =========================================================
   TASK LIST
========================================================= */

function renderTaskList(items) {

  if (!items.length) {

    return `

      <div class="empty">
        موردی برای نمایش وجود ندارد.
      </div>

    `;
  }


  return items
    .map(renderTask)
    .join('');
}


/* =========================================================
   CLIENTS
========================================================= */

function renderClients(items) {

  if (!items.length) {

    return `

      <div class="empty">
        مشتری‌ای پیدا نشد.
      </div>

    `;
  }


  return items
    .map(function(item) {

      return `

        <div class="card">

          <div class="card-top">

            <div>

              <div class="card-title">
                ${escapeHtml(
                  item['نام شخص/شرکت'] ||
                  'بدون نام'
                )}
              </div>

              <div class="card-sub">
                ${escapeHtml(
                  item['نوع فعالیت'] ||
                  ''
                )}
              </div>

              <div class="card-sub">
                ${escapeHtml(
                  item['نوع خدمات'] ||
                  ''
                )}
              </div>

            </div>

            <div class="badge badge-blue">
              ${escapeHtml(
                item['وضعیت همکاری'] ||
                ''
              )}
            </div>

          </div>

        </div>

      `;

    })
    .join('');
}


/* =========================================================
   RECEIVABLES
========================================================= */

function renderReceivables(items) {

  if (!items.length) {

    return `

      <div class="empty">
        موردی برای نمایش وجود ندارد.
      </div>

    `;
  }


  return items
    .map(function(item) {

      return `

        <div class="card">

          <div class="card-top">

            <div>

              <div class="card-title">
                ${escapeHtml(
                  item['نام مراجعه کننده'] ||
                  'بدون نام'
                )}
              </div>

              <div class="card-sub">
                ${escapeHtml(
                  item['نوع خدمات'] ||
                  ''
                )}
              </div>

              <div class="card-sub">
                سررسید:
                ${escapeHtml(
                  item['تاریخ سررسید'] ||
                  '-'
                )}
              </div>

            </div>


            <div class="badge badge-orange">

              ${money(
                item['مبلغ دریافتنی'] || 0
              )}

            </div>

          </div>

        </div>

      `;

    })
    .join('');
}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value) {

  return String(value ?? '')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');
}


/* =========================================================
   TABS
========================================================= */

document
  .querySelectorAll('.tab')
  .forEach(function(tab) {

    tab.addEventListener(
      'click',
      function() {

        document
          .querySelectorAll('.tab')
          .forEach(function(t) {

            t.classList.remove(
              'active'
            );

          });


        tab.classList.add(
          'active'
        );


        activeTab =
          tab.dataset.tab;


        renderContent();

      }
    );

  });


/* =========================================================
   SEARCH EVENT
========================================================= */

document
  .getElementById('search')
  .addEventListener(
    'input',
    function(e) {

      searchTerm =
        e.target.value;

      renderContent();

    }
  );


/* =========================================================
   TOUCH LIGHT
========================================================= */

document.addEventListener(
  'pointerdown',
  function(e) {

    const light =
      document.createElement(
        'div'
      );


    light.className =
      'touch-light';


    light.style.left =
      e.clientX + 'px';


    light.style.top =
      e.clientY + 'px';


    light.style.background =
      'radial-gradient(circle, rgba(56,189,248,.5), transparent 70%)';


    document.body.appendChild(
      light
    );


    setTimeout(function() {

      light.remove();

    },800);

  },
  {
    passive:true
  }
);


/* =========================================================
   START
========================================================= */

loadDashboard();

</script>
