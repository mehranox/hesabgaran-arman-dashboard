<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             maximum-scale=1.0,
             user-scalable=no">

  <meta
    name="theme-color"
    content="#424d2d">

  <title>
    داشبورد حسابگران آرمان
  </title>

  <script
    src="https://telegram.org/js/telegram-web-app.js">
  </script>


  <style>

    @import url(
      'https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap'
    );


    :root {

      --olive:
        #687548;

      --olive-dark:
        #424d2d;

      --olive-light:
        #eef1e7;

      --gold:
        #b99550;

      --gold-light:
        #f6efdf;

      --text:
        #252820;

      --muted:
        #777b70;

      --bg:
        #f5f6f1;

      --white:
        #ffffff;

      --danger:
        #b94b4b;

      --success:
        #557e59;

      --border:
        #e6e8df;

      --shadow:
        0 8px 24px
        rgba(45, 54, 30, .07);

    }


    * {

      box-sizing:
        border-box;

      -webkit-tap-highlight-color:
        transparent;

    }


    html {

      background:
        var(--bg);

    }


    body {

      margin:
        0;

      padding:
        0;

      min-height:
        100vh;

      background:
        var(--bg);

      color:
        var(--text);

      font-family:
        'Vazirmatn',
        Tahoma,
        Arial,
        sans-serif;

    }


    button {

      font-family:
        inherit;

    }


    #app {

      width:
        100%;

      max-width:
        760px;

      margin:
        0 auto;

      padding:
        16px;

    }


    /* ==================================================
       LOADING
    ================================================== */


    .loading,
    .error-box {

      min-height:
        85vh;

      display:
        flex;

      flex-direction:
        column;

      justify-content:
        center;

      align-items:
        center;

      text-align:
        center;

      padding:
        30px 18px;

    }


    .loading h3,
    .error-box h3 {

      margin:
        18px 0 8px;

      font-size:
        18px;

      font-weight:
        800;

    }


    .loading p,
    .error-box p {

      margin:
        0;

      color:
        var(--muted);

      font-size:
        13px;

      line-height:
        2;

      white-space:
        pre-line;

    }


    .spinner {

      width:
        42px;

      height:
        42px;

      border:
        4px solid #dfe4d5;

      border-top-color:
        var(--olive);

      border-radius:
        50%;

      animation:
        spin .8s linear infinite;

    }


    @keyframes spin {

      to {

        transform:
          rotate(360deg);

      }

    }


    /* ==================================================
       ERROR
    ================================================== */


    .error-icon {

      width:
        62px;

      height:
        62px;

      display:
        flex;

      align-items:
        center;

      justify-content:
        center;

      border-radius:
        50%;

      background:
        #f9e7e7;

      color:
        var(--danger);

      font-size:
        28px;

      font-weight:
        800;

    }


    .retry-btn {

      margin-top:
        18px;

      padding:
        12px 28px;

      border:
        0;

      border-radius:
        12px;

      background:
        var(--olive);

      color:
        white;

      font-size:
        14px;

      font-weight:
        700;

    }


    .retry-btn:active {

      transform:
        scale(.98);

    }


    /* ==================================================
       TOPBAR
    ================================================== */


    .topbar {

      display:
        flex;

      justify-content:
        space-between;

      align-items:
        center;

      gap:
        12px;

      margin-bottom:
        18px;

    }


    .brand {

      display:
        flex;

      align-items:
        center;

      gap:
        10px;

      min-width:
        0;

    }


    .brand-logo {

      width:
        45px;

      height:
        45px;

      flex:
        0 0 45px;

      display:
        flex;

      align-items:
        center;

      justify-content:
        center;

      border-radius:
        13px;

      background:
        var(--olive);

      color:
        white;

      font-size:
        20px;

      font-weight:
        800;

    }


    .brand h1 {

      margin:
        0;

      font-size:
        16px;

      font-weight:
        800;

    }


    .brand p {

      margin:
        3px 0 0;

      color:
        var(--muted);

      font-size:
        10px;

    }


    .date-badge {

      padding:
        8px 10px;

      background:
        var(--gold-light);

      border:
        1px solid #eadfc8;

      border-radius:
        10px;

      color:
        #80652e;

      font-size:
        10px;

      white-space:
        nowrap;

    }


    /* ==================================================
       WELCOME
    ================================================== */


    .welcome {

      margin-bottom:
        16px;

      padding:
        23px 20px;

      background:
        linear-gradient(
          135deg,
          var(--olive-dark),
          var(--olive)
        );

      color:
        white;

      border-radius:
        20px;

      box-shadow:
        var(--shadow);

    }


    .welcome small {

      opacity:
        .78;

      font-size:
        11px;

    }


    .welcome h2 {

      margin:
        7px 0 4px;

      font-size:
        21px;

      font-weight:
        800;

    }


    .welcome p {

      margin:
        0;

      opacity:
        .85;

      font-size:
        12px;

      line-height:
        2;

    }


    /* ==================================================
       SECTION
    ================================================== */


    .section-title {

      display:
        flex;

      align-items:
        center;

      justify-content:
        space-between;

      margin:
        22px 2px 10px;

    }


    .section-title h3 {

      margin:
        0;

      font-size:
        14px;

      font-weight:
        800;

    }


    .section-title span {

      color:
        var(--muted);

      font-size:
        10px;

    }


    /* ==================================================
       STATS
    ================================================== */


    .stats {

      display:
        grid;

      grid-template-columns:
        repeat(2, minmax(0, 1fr));

      gap:
        10px;

    }


    .stat-card {

      min-width:
        0;

      padding:
        15px;

      background:
        var(--white);

      border:
        1px solid var(--border);

      border-radius:
        16px;

      box-shadow:
        var(--shadow);

    }


    .stat-icon {

      width:
        31px;

      height:
        31px;

      display:
        flex;

      align-items:
        center;

      justify-content:
        center;

      margin-bottom:
        10px;

      background:
        var(--olive-light);

      color:
        var(--olive-dark);

      border-radius:
        10px;

      font-size:
        15px;

    }


    .stat-label {

      margin-bottom:
        10px;

      color:
        var(--muted);

      font-size:
        11px;

    }


    .stat-value {

      overflow-wrap:
        anywhere;

      font-size:
        18px;

      font-weight:
        800;

      direction:
        rtl;

    }


    .stat-subtitle {

      margin-top:
        5px;

      color:
        var(--muted);

      font-size:
        9px;

    }


    /* ==================================================
       ITEMS
    ================================================== */


    .items {

      display:
        flex;

      flex-direction:
        column;

      gap:
        9px;

    }


    .item-card {

      display:
        flex;

      align-items:
        center;

      justify-content:
        space-between;

      gap:
        12px;

      padding:
        14px;

      background:
        white;

      border:
        1px solid var(--border);

      border-radius:
        15px;

      box-shadow:
        var(--shadow);

    }


    .item-main {

      min-width:
        0;

      flex:
        1;

    }


    .item-title {

      overflow-wrap:
        anywhere;

      font-size:
        12px;

      font-weight:
        700;

    }


    .item-subtitle {

      margin-top:
        5px;

      color:
        var(--muted);

      font-size:
        10px;

      overflow-wrap:
        anywhere;

    }


    .item-value {

      max-width:
        45%;

      color:
        var(--olive-dark);

      font-size:
        12px;

      font-weight:
        800;

      text-align:
        left;

      overflow-wrap:
        anywhere;

    }


    .status {

      display:
        inline-block;

      margin-top:
        6px;

      padding:
        3px 8px;

      background:
        var(--olive-light);

      color:
        var(--success);

      border-radius:
        20px;

      font-size:
        9px;

    }


    .empty {

      padding:
        25px 15px;

      text-align:
        center;

      background:
        white;

      border:
        1px dashed #d7dccd;

      border-radius:
        15px;

      color:
        var(--muted);

      font-size:
        12px;

    }


    /* ==================================================
       FOOTER
    ================================================== */


    .footer {

      padding:
        30px 0 15px;

      text-align:
        center;

      color:
        #a1a59b;

      font-size:
        10px;

    }


    /* ==================================================
       RESPONSIVE
    ================================================== */


    @media (min-width: 600px) {

      #app {

        padding:
          25px;

      }


      .stats {

        grid-template-columns:
          repeat(
            4,
            minmax(0, 1fr)
          );

      }

    }

  </style>

</head>


<body>


<main id="app">

  <div class="loading">

    <div class="spinner"></div>

    <h3>
      در حال راه‌اندازی داشبورد...
    </h3>

    <p>
      لطفاً چند لحظه صبر کنید.
    </p>

  </div>

</main>


<script>

'use strict';


/* ==================================================
   CONFIG
================================================== */


/*
 * Google Apps Script Web App
 *
 * IMPORTANT:
 * بدون ?key
 */

const API_URL =
  'https://script.google.com/macros/s/AKfycbzK62xIUIm8VyTektiy9EKOZBnMeXb1bxIKtcCxKfABIYFezMNEH6yfcrWAeL34zmI/exec';


/* ==================================================
   GLOBALS
================================================== */


let telegramApp =
  null;


let authInitData =
  '';


let dashboardData =
  null;


/* ==================================================
   TELEGRAM
================================================== */


function getTelegramApp() {

  if (
    window.Telegram &&
    window.Telegram.WebApp
  ) {

    return (
      window.Telegram.WebApp
    );

  }

  return null;

}


function initializeTelegram() {

  telegramApp =
    getTelegramApp();


  if (!telegramApp) {

    return false;

  }


  try {

    telegramApp.ready();

    telegramApp.expand();

  } catch (error) {

    console.warn(
      'Telegram initialization warning:',
      error
    );

  }


  authInitData =
    telegramApp.initData || '';


  return Boolean(
    authInitData &&
    authInitData.trim()
  );

}


/* ==================================================
   FIND INIT DATA
================================================== */


function findTelegramInitData() {

  /*
   * Primary
   */

  if (
    window.Telegram &&
    window.Telegram.WebApp &&
    window.Telegram.WebApp.initData
  ) {

    return (
      window.Telegram.WebApp.initData
    );

  }


  /*
   * Secondary
   */

  if (
    telegramApp &&
    telegramApp.initData
  ) {

    return (
      telegramApp.initData
    );

  }


  /*
   * URL fallback
   */

  try {

    const params =
      new URLSearchParams(
        window.location.search
      );


    const urlData =
      params.get(
        'tgWebAppData'
      ) ||
      params.get(
        'tg_init_data'
      );


    if (urlData) {

      return urlData;

    }

  } catch (error) {

    console.warn(
      'URL initData warning:',
      error
    );

  }


  return '';

}


/* ==================================================
   START
================================================== */


function start() {

  const app =
    document.getElementById(
      'app'
    );


  app.innerHTML = `

    <div class="loading">

      <div class="spinner"></div>

      <h3>
        در حال اتصال به تلگرام...
      </h3>

      <p>
        در حال دریافت اطلاعات امنیتی تلگرام
      </p>

    </div>

  `;


  let attempts =
    0;


  const maxAttempts =
    30;


  const timer =
    setInterval(
      function () {

        attempts++;


        initializeTelegram();


        const detected =
          findTelegramInitData();


        if (detected) {

          authInitData =
            detected;


          clearInterval(
            timer
          );


          loadDashboard();


          return;

        }


        if (
          attempts >=
          maxAttempts
        ) {

          clearInterval(
            timer
          );


          showError(
            'اطلاعات ورود تلگرام دریافت نشد.\n' +
            'لطفاً داشبورد را مستقیماً از داخل Telegram باز کنید.'
          );

        }

      },
      200
    );

}


/* ==================================================
   LOAD DASHBOARD
================================================== */


async function loadDashboard() {

  authInitData =
    findTelegramInitData();


  if (
    !authInitData ||
    !authInitData.trim()
  ) {

    showError(
      'اطلاعات ورود تلگرام دریافت نشد.\n' +
      'لطفاً داشبورد را مستقیماً از داخل Telegram باز کنید.'
    );

    return;

  }


  const app =
    document.getElementById(
      'app'
    );


  app.innerHTML = `

    <div class="loading">

      <div class="spinner"></div>

      <h3>
        در حال بارگذاری داشبورد...
      </h3>

      <p>
        اطلاعات حسابگران آرمان در حال دریافت است.
      </p>

    </div>

  `;


  try {

    const response =
      await fetch(
        API_URL,
        {

          method:
            'POST',

          headers: {

            'Content-Type':
              'application/json'

          },

          body:
            JSON.stringify({

              action:
                'getDashboard',

              initData:
                authInitData

            })

        }
      );


    if (
      !response.ok
    ) {

      throw new Error(
        'خطای HTTP: ' +
        response.status
      );

    }


    const result =
      await response.json();


    if (
      !result ||
      result.ok !== true
    ) {

      throw new Error(
        result &&
        result.error
          ? result.error
          : 'دریافت اطلاعات داشبورد ناموفق بود.'
      );

    }


    dashboardData =
      result;


    render(
      result
    );


  } catch (error) {

    console.error(
      'Dashboard error:',
      error
    );


    showError(
      'خطا در دریافت اطلاعات داشبورد:\n' +
      (
        error.message ||
        'خطای نامشخص'
      )
    );

  }

}


/* ==================================================
   ERROR
================================================== */


function showError(
  message
) {

  const app =
    document.getElementById(
      'app'
    );


  app.innerHTML = `

    <div class="error-box">

      <div class="error-icon">
        !
      </div>

      <h3>
        خطا در بارگذاری داشبورد
      </h3>

      <p>
        ${escapeHtml(message)}
      </p>

      <button
        class="retry-btn"
        onclick="retryLoading()">

        تلاش مجدد

      </button>

    </div>

  `;

}


/* ==================================================
   RETRY
================================================== */


function retryLoading() {

  authInitData =
    '';


  telegramApp =
    getTelegramApp();


  if (telegramApp) {

    try {

      telegramApp.ready();

    } catch (error) {

      console.warn(
        error
      );

    }

  }


  authInitData =
    findTelegramInitData();


  if (authInitData) {

    loadDashboard();

  } else {

    start();

  }

}


/* ==================================================
   RENDER
================================================== */


function render(
  result
) {

  const dashboard =
    result.dashboard || {};


  const stats =
    dashboard.stats || {};


  const sections =
    dashboard.sections || [];


  const receivables =
    dashboard.receivables || [];


  const user =
    result.user || {};


  const title =
    dashboard.title ||
    'داشبورد حسابگران آرمان';


  const subtitle =
    dashboard.subtitle ||
    'مدیریت مالی، حسابداری و خدمات مالیاتی';


  const today =
    dashboard.date ||
    new Date().toLocaleDateString(
      'fa-IR'
    );


  const app =
    document.getElementById(
      'app'
    );


  app.innerHTML = `

    <div class="topbar">

      <div class="brand">

        <div class="brand-logo">
          ح
        </div>

        <div>

          <h1>
            حسابگران آرمان
          </h1>

          <p>
            سامانه مدیریت و پایش مالی
          </p>

        </div>

      </div>


      <div class="date-badge">

        ${escapeHtml(
          today
        )}

      </div>

    </div>


    <section class="welcome">

      <small>
        داشبورد مدیریتی
      </small>

      <h2>
        ${escapeHtml(
          title
        )}
      </h2>

      <p>
        ${escapeHtml(
          subtitle
        )}
      </p>

    </section>


    ${renderUser(user)}


    ${renderStats(stats)}


    ${renderReceivables(
      receivables
    )}


    ${renderSections(
      sections
    )}


    <div class="footer">

      حسابگران آرمان
      |
      داشبورد داخلی

    </div>

  `;

}


/* ==================================================
   USER
================================================== */


function renderUser(
  user
) {

  if (
    !user ||
    typeof user !== 'object'
  ) {

    return '';

  }


  const name =
    user.name ||
    user.fullName ||
    (
      (
        user.first_name ||
        ''
      ) +
      ' ' +
      (
        user.last_name ||
        ''
      )
    ).trim();


  if (!name) {

    return '';

  }


  const username =
    user.username
      ? '@' + user.username
      : 'کاربر سامانه';


  return `

    <div class="section-title">

      <h3>
        اطلاعات کاربر
      </h3>

    </div>


    <div class="item-card">

      <div class="item-main">

        <div class="item-title">

          ${escapeHtml(
            name
          )}

        </div>

        <div class="item-subtitle">

          ${escapeHtml(
            username
          )}

        </div>

      </div>

    </div>

  `;

}


/* ==================================================
   STATS
================================================== */


function renderStats(
  stats
) {

  /*
   * Backend currently returns:
   *
   * {
   *   clients: 10,
   *   accounting: 4,
   *   tax: 6,
   *   receivables: 2
   * }
   *
   * بنابراین object را به کارت تبدیل می‌کنیم.
   */


  if (
    !stats ||
    typeof stats !== 'object'
  ) {

    return '';

  }


  const cards = [

    {
      label:
        'مشتریان',

      value:
        stats.clients || 0,

      icon:
        '👥'

    },

    {
      label:
        'حسابداری',

      value:
        stats.accounting || 0,

      icon:
        '📘'

    },

    {
      label:
        'مالیاتی',

      value:
        stats.tax || 0,

      icon:
        '📑'

    },

    {
      label:
        'دریافتنی‌ها',

      value:
        stats.receivables || 0,

      icon:
        '💰'

    }

  ];


  return `

    <div class="section-title">

      <h3>
        خلاصه وضعیت
      </h3>

    </div>


    <div class="stats">

      ${
        cards
          .map(
            function (stat) {

              return `

                <div class="stat-card">

                  <div class="stat-icon">

                    ${escapeHtml(
                      stat.icon
                    )}

                  </div>


                  <div class="stat-label">

                    ${escapeHtml(
                      stat.label
                    )}

                  </div>


                  <div class="stat-value">

                    ${formatValue(
                      stat.value
                    )}

                  </div>

                </div>

              `;

            }
          )
          .join('')
      }

    </div>

  `;

}


/* ==================================================
   RECEIVABLES
================================================== */


function renderReceivables(
  receivables
) {

  if (
    !Array.isArray(
      receivables
    ) ||
    receivables.length === 0
  ) {

    return '';

  }


  const items =
    receivables
      .map(
        function (item) {

          return renderItem(
            item
          );

        }
      )
      .join('');


  return `

    <div class="section-title">

      <h3>
        دریافتنی‌ها
      </h3>

      <span>

        ${receivables.length}
        مورد

      </span>

    </div>


    <div class="items">

      ${items}

    </div>

  `;

}


/* ==================================================
   SECTIONS
================================================== */


function renderSections(
  sections
) {

  if (
    !Array.isArray(
      sections
    ) ||
    sections.length === 0
  ) {

    return '';

  }


  return sections
    .map(
      function (section) {

        if (
          !section ||
          typeof section !==
            'object'
        ) {

          return '';

        }


        const title =
          section.title ||
          section.name ||
          'گزارش';


        const items =
          section.items ||
          section.data ||
          section.rows ||
          [];


        let content = '';


        if (
          Array.isArray(
            items
          )
        ) {

          content =
            items
              .map(
                function (item) {

                  return renderItem(
                    item
                  );

                }
              )
              .join('');

        } else {

          content = `

            <div class="item-card">

              <div class="item-main">

                <div class="item-title">

                  ${escapeHtml(
                    String(items)
                  )}

                </div>

              </div>

            </div>

          `;

        }


        if (!content) {

          content = `

            <div class="empty">

              اطلاعاتی برای نمایش وجود ندارد.

            </div>

          `;

        }


        return `

          <div class="section-title">

            <h3>

              ${escapeHtml(
                String(title)
              )}

            </h3>

          </div>


          <div class="items">

            ${content}

          </div>

        `;

      }
    )
    .join('');

}


/* ==================================================
   ITEM
================================================== */


function renderItem(
  item
) {

  if (
    item === null ||
    item === undefined
  ) {

    return '';

  }


  if (
    typeof item !==
    'object'
  ) {

    return `

      <div class="item-card">

        <div class="item-main">

          <div class="item-title">

            ${escapeHtml(
              String(item)
            )}

          </div>

        </div>

      </div>

    `;

  }


  const title =
    item.title ||
    item.name ||
    item.client ||
    item.customer ||
    item.description ||
    'مورد مالی';


  const subtitle =
    item.subtitle ||
    item.date ||
    item.category ||
    '';


  const value =
    item.value ??
    item.amount ??
    item.total ??
    item.balance ??
    '';


  const status =
    item.status ||
    '';


  return `

    <div class="item-card">

      <div class="item-main">

        <div class="item-title">

          ${escapeHtml(
            String(title)
          )}

        </div>


        ${
          subtitle
            ? `

              <div class="item-subtitle">

                ${escapeHtml(
                  String(subtitle)
                )}

              </div>

            `
            : ''
        }


        ${
          status
            ? `

              <span class="status">

                ${escapeHtml(
                  String(status)
                )}

              </span>

            `
            : ''
        }

      </div>


      ${
        value !== ''
          ? `

            <div class="item-value">

              ${escapeHtml(
                formatValue(
                  value
                )
              )}

            </div>

          `
          : ''
      }

    </div>

  `;

}


/* ==================================================
   FORMAT
================================================== */


function formatValue(
  value
) {

  if (
    value === null ||
    value === undefined
  ) {

    return '-';

  }


  if (
    typeof value ===
    'number'
  ) {

    return value.toLocaleString(
      'fa-IR'
    );

  }


  return String(
    value
  );

}


/* ==================================================
   ESCAPE HTML
================================================== */


function escapeHtml(
  value
) {

  return String(
    value
  )

    .replace(
      /&/g,
      '&amp;'
    )

    .replace(
      /</g,
      '&lt;'
    )

    .replace(
      />/g,
      '&gt;'
    )

    .replace(
      /"/g,
      '&quot;'
    )

    .replace(
      /'/g,
      '&#039;'
    );

}


/* ==================================================
   START APPLICATION
================================================== */


if (
  document.readyState ===
  'loading'
) {

  document.addEventListener(
    'DOMContentLoaded',
    start
  );

} else {

  start();

}

</script>
