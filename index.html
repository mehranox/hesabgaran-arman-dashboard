<style>
:root{
    --bg:#071522;
    --bg2:#0b1c2d;
    --card:rgba(24,65,105,.30);
    --card2:rgba(31,84,135,.36);
    --border:rgba(119,180,239,.18);
    --blue:#3b82f6;
    --blue2:#2563eb;
    --azure:#38bdf8;
    --olive:#8f9f4d;
    --gold:#d8b86c;
    --green:#4ade80;
    --red:#fb7185;
    --orange:#fb923c;
    --text:#f5f9ff;
    --muted:#9eb1c5;
    --radius:22px;
}

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    background:
        radial-gradient(circle at 8% 5%,rgba(37,99,235,.19),transparent 27%),
        radial-gradient(circle at 92% 15%,rgba(56,189,248,.12),transparent 28%),
        radial-gradient(circle at 50% 100%,rgba(214,184,108,.075),transparent 35%),
        linear-gradient(145deg,#06121e,#091a2b 48%,#071522);
    color:var(--text);
    font-family:Tahoma,Arial,sans-serif;
}

body{overflow-x:hidden}

button,input{font:inherit}
button{cursor:pointer}

/* APP */
.app{
    width:min(1450px,100%);
    margin:auto;
    padding:22px;
}

/* HEADER */
.header{
    position:relative;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
    padding:19px 23px;
    margin-bottom:20px;
    background:
        linear-gradient(
            135deg,
            rgba(37,99,235,.17),
            rgba(31,84,135,.10),
            rgba(255,255,255,.035)
        );
    border:1px solid var(--border);
    border-radius:28px;
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    box-shadow:
        0 20px 60px rgba(0,0,0,.27),
        inset 0 1px rgba(255,255,255,.07);
}

.header::before{
    content:"";
    position:absolute;
    width:300px;
    height:300px;
    right:-110px;
    top:-170px;
    background:radial-gradient(circle,rgba(59,130,246,.25),transparent 68%);
    pointer-events:none;
}

.header::after{
    content:"";
    position:absolute;
    width:180px;
    height:180px;
    left:-80px;
    bottom:-120px;
    background:radial-gradient(circle,rgba(214,184,108,.11),transparent 70%);
    pointer-events:none;
}

.brand{
    position:relative;
    z-index:2;
    display:flex;
    align-items:center;
    gap:15px;
}

.logo{
    width:54px;
    height:54px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:17px;
    background:
        linear-gradient(
            145deg,
            rgba(59,130,246,.23),
            rgba(56,189,248,.09),
            rgba(214,184,108,.10)
        );
    border:1px solid rgba(120,184,240,.20);
    box-shadow:
        0 0 30px rgba(37,99,235,.16),
        inset 0 1px rgba(255,255,255,.10);
    font-size:24px;
}

.brand h1{
    margin:0;
    font-family:"Noto Nastaliq Urdu","IranNastaliq",serif;
    font-size:27px;
    font-weight:600;
    line-height:1.7;

    text-shadow:0 2px 15px rgba(37,99,235,.25);
}

.header-status{
    position:relative;
    z-index:2;
    display:flex;
    align-items:center;
    gap:8px;
    color:#b9cadb;
    font-size:12px;
}

.status-dot{
    width:9px;
    height:9px;
    border-radius:50%;
    background:var(--green);
    box-shadow:0 0 12px rgba(74,222,128,.75);
}

/* HERO */
.hero{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:245px;
    margin-bottom:20px;
    overflow:hidden;
    background:
        linear-gradient(
            135deg,
            rgba(31,84,135,.30),
            rgba(19,52,83,.20),
            rgba(255,255,255,.035)
        );
    border:1px solid var(--border);
    border-radius:var(--radius);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    box-shadow:
        0 20px 60px rgba(0,0,0,.23),
        inset 0 1px rgba(255,255,255,.055);
}

.hero::before{
    content:"";
    position:absolute;
    width:620px;
    height:620px;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    background:
        radial-gradient(
            circle,
            rgba(56,189,248,.13),
            rgba(37,99,235,.07) 30%,
            transparent 68%
        );
    animation:heroGlow 4s ease-in-out infinite;
    pointer-events:none;
}

/* =========================================================
   MAGIC ORB
   ========================================================= */

.active-orb-wrap{
    position:relative;
    width:225px;
    height:225px;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:2;
}

/* هاله اصلی */
.active-orb-aura{
    position:absolute;
    inset:-65px;
    border-radius:50%;
    background:
        radial-gradient(
            circle,
            rgba(56,189,248,.34) 0%,
            rgba(37,99,235,.20) 30%,
            rgba(99,102,241,.10) 52%,
            transparent 72%
        );
    filter:blur(20px);
    animation:
        auraPulse 2.7s ease-in-out infinite,
        auraSpin 7s linear infinite;
    pointer-events:none;
}

/* هاله دوم */
.active-orb-aura::before{
    content:"";
    position:absolute;
    inset:18px;
    border-radius:50%;
    background:
        conic-gradient(
            from 0deg,
            transparent,
            rgba(56,189,248,.22),
            transparent 20%,
            rgba(129,140,248,.20),
            transparent 42%,
            rgba(45,212,191,.18),
            transparent 67%,
            rgba(214,184,108,.18),
            transparent
        );
    filter:blur(12px);
    animation:auraSpinReverse 4.5s linear infinite;
}

/* حلقه بیرونی */
.active-orb-ring{
    position:absolute;
    inset:2px;
    border-radius:50%;
    border:1px solid rgba(112,192,255,.30);
    box-shadow:
        0 0 25px rgba(37,99,235,.18),
        0 0 55px rgba(56,189,248,.10);
    animation:ringRotate 7s linear infinite;
}

/* حلقه دوم */
.active-orb-ring::before{
    content:"";
    position:absolute;
    inset:12px;
    border-radius:50%;
    border:1px dashed rgba(123,198,255,.22);
    box-shadow:0 0 15px rgba(56,189,248,.12);
    animation:ringRotateReverse 5s linear infinite;
}

/* حلقه سوم */
.active-orb-ring::after{
    content:"";
    position:absolute;
    inset:25px;
    border-radius:50%;
    border:1px solid rgba(214,184,108,.13);
    animation:ringRotate 9s linear infinite;
}

/* خود گوی */
.active-orb{
    position:relative;
    width:154px;
    height:154px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;

    background:
        radial-gradient(
            circle at 28% 20%,
            rgba(255,255,255,.90) 0%,
            rgba(255,255,255,.28) 5%,
            transparent 17%
        ),
        radial-gradient(
            circle at 38% 32%,
            rgba(255,255,255,.25),
            transparent 27%
        ),
        radial-gradient(
            circle at 53% 53%,
            #62d0ff 0%,
            #2589ee 28%,
            #175fc7 52%,
            #103c91 72%,
            #06183f 100%
        );

    border:1px solid rgba(190,235,255,.65);

    box-shadow:
        inset -24px -27px 40px rgba(0,0,0,.48),
        inset 14px 11px 30px rgba(255,255,255,.23),
        inset 0 0 22px rgba(56,189,248,.25),
        0 0 25px rgba(40,151,255,.50),
        0 0 55px rgba(40,151,255,.35),
        0 0 90px rgba(40,151,255,.20),
        0 0 125px rgba(56,189,248,.12);

    animation:
        orbFloat 2.8s ease-in-out infinite,
        orbPulse 2.4s ease-in-out infinite,
        orbColor 9s ease-in-out infinite;

    transition:transform .25s ease,box-shadow .25s ease;
    z-index:3;
}

/* سطح جادویی */
.active-orb::before{
    content:"";
    position:absolute;
    width:210%;
    height:210%;
    left:-105%;
    top:-105%;
    border-radius:50%;

    background:
        conic-gradient(
            from 0deg,
            transparent 0deg,
            rgba(255,255,255,.10) 25deg,
            transparent 55deg,
            rgba(45,212,191,.13) 90deg,
            transparent 125deg,
            rgba(129,140,248,.14) 175deg,
            transparent 220deg,
            rgba(214,184,108,.11) 265deg,
            transparent 310deg,
            rgba(255,255,255,.10) 345deg,
            transparent 360deg
        );

    animation:orbSurface 4.5s linear infinite;
    pointer-events:none;
}

/* موج داخلی */
.active-orb::after{
    content:"";
    position:absolute;
    inset:8px;
    border-radius:50%;
    background:
        radial-gradient(
            circle at 35% 28%,
            rgba(255,255,255,.18),
            transparent 35%
        ),
        radial-gradient(
            circle at 65% 72%,
            rgba(0,0,0,.18),
            transparent 48%
        );
    box-shadow:
        inset 0 0 20px rgba(255,255,255,.07);
    animation:innerGlow 2s ease-in-out infinite;
    pointer-events:none;
}

/* انعکاس شیشه */
.orb-highlight{
    position:absolute;
    width:54px;
    height:27px;
    top:18px;
    left:27px;
    border-radius:50%;
    background:rgba(255,255,255,.38);
    filter:blur(5px);
    transform:rotate(-28deg);
    opacity:.88;
    z-index:5;
    animation:highlightMove 2.6s ease-in-out infinite;
}

/* محتوای داخل */
.orb-content{
    position:relative;
    z-index:10;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    text-shadow:
        0 2px 12px rgba(0,0,0,.55),
        0 0 18px rgba(255,255,255,.20);
}

.orb-number{
    font-family:Arial,Tahoma,sans-serif;
    font-size:42px;
    line-height:1;
    font-weight:900;
    color:#fff;
    letter-spacing:-1px;
    animation:numberGlow 1.8s ease-in-out infinite;
}

.orb-label{
    margin-top:9px;
    color:rgba(255,255,255,.95);
    font-size:11px;
    font-weight:500;
}

/* ذرات اطراف */
.orb-particle{
    position:absolute;
    width:5px;
    height:5px;
    border-radius:50%;
    background:#b7ebff;
    box-shadow:
        0 0 8px #38bdf8,
        0 0 18px rgba(56,189,248,.8),
        0 0 30px rgba(129,140,248,.4);
    z-index:6;
    animation:particleFloat 2.2s ease-in-out infinite;
}

.p1{
    top:13px;
    right:44px;
}

.p2{
    bottom:25px;
    left:32px;
    animation-delay:.45s;
}

.p3{
    top:83px;
    right:0;
    width:4px;
    height:4px;
    animation-delay:.9s;
}

.p4{
    position:absolute;
    bottom:50px;
    right:22px;
    width:4px;
    height:4px;
    border-radius:50%;
    background:#d8b86c;
    box-shadow:
        0 0 8px #d8b86c,
        0 0 20px rgba(214,184,108,.7);
    animation:particleFloat 1.8s ease-in-out infinite;
    z-index:6;
}

.p5{
    position:absolute;
    top:53px;
    left:13px;
    width:3px;
    height:3px;
    border-radius:50%;
    background:#8b9cff;
    box-shadow:
        0 0 8px #818cf8,
        0 0 18px rgba(129,140,248,.7);
    animation:particleFloat 2s ease-in-out infinite;
    animation-delay:.7s;
    z-index:6;
}

/* =========================================================
   ORB ANIMATIONS
   ========================================================= */

@keyframes orbFloat{
    0%,100%{transform:translateY(0) scale(1)}
    50%{transform:translateY(-7px) scale(1.018)}
}

@keyframes orbPulse{
    0%,100%{
        box-shadow:
            inset -24px -27px 40px rgba(0,0,0,.48),
            inset 14px 11px 30px rgba(255,255,255,.23),
            inset 0 0 22px rgba(56,189,248,.25),
            0 0 25px rgba(40,151,255,.50),
            0 0 55px rgba(40,151,255,.35),
            0 0 90px rgba(40,151,255,.20);
    }
    50%{
        box-shadow:
            inset -24px -27px 40px rgba(0,0,0,.44),
            inset 14px 11px 30px rgba(255,255,255,.28),
            inset 0 0 28px rgba(56,189,248,.34),
            0 0 35px rgba(40,151,255,.68),
            0 0 70px rgba(40,151,255,.45),
            0 0 115px rgba(56,189,248,.25);
    }
}

@keyframes orbSurface{
    from{transform:rotate(0deg) scale(1)}
    50%{transform:rotate(180deg) scale(1.04)}
    to{transform:rotate(360deg) scale(1)}
}

@keyframes innerGlow{
    0%,100%{opacity:.55;transform:scale(.98)}
    50%{opacity:1;transform:scale(1.035)}
}

@keyframes highlightMove{
    0%,100%{transform:translate(0,0) rotate(-28deg);opacity:.70}
    50%{transform:translate(8px,4px) rotate(-25deg);opacity:1}
}

@keyframes ringRotate{
    from{transform:rotate(0deg)}
    to{transform:rotate(360deg)}
}

@keyframes ringRotateReverse{
    from{transform:rotate(0deg)}
    to{transform:rotate(-360deg)}
}

@keyframes auraPulse{
    0%,100%{
        transform:scale(.82);
        opacity:.40;
    }
    50%{
        transform:scale(1.16);
        opacity:.92;
    }
}

@keyframes auraSpin{
    from{transform:rotate(0deg)}
    to{transform:rotate(360deg)}
}

@keyframes auraSpinReverse{
    from{transform:rotate(360deg)}
    to{transform:rotate(0deg)}
}

@keyframes orbColor{
    0%{filter:hue-rotate(0deg) saturate(1)}
    25%{filter:hue-rotate(12deg) saturate(1.10)}
    50%{filter:hue-rotate(27deg) saturate(1.16)}
    75%{filter:hue-rotate(-12deg) saturate(1.08)}
    100%{filter:hue-rotate(0deg) saturate(1)}
}

@keyframes particleFloat{
    0%,100%{
        opacity:.25;
        transform:translate(0,0) scale(.65);
    }
    50%{
        opacity:1;
        transform:translate(5px,-8px) scale(1.5);
    }
}

@keyframes numberGlow{
    0%,100%{
        text-shadow:
            0 2px 12px rgba(0,0,0,.55),
            0 0 8px rgba(255,255,255,.10);
    }
    50%{
        text-shadow:
            0 2px 12px rgba(0,0,0,.55),
            0 0 20px rgba(255,255,255,.35),
            0 0 32px rgba(56,189,248,.20);
    }
}

@keyframes heroGlow{
    0%,100%{transform:translate(-50%,-50%) scale(.88);opacity:.55}
    50%{transform:translate(-50%,-50%) scale(1.12);opacity:1}
}

.active-orb-wrap:hover .active-orb{
    transform:translateY(-8px) scale(1.065);
}

/* STATS */
.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:14px;
    margin-bottom:20px;
}

.stat{
    position:relative;
    overflow:hidden;
    padding:20px;
    background:
        linear-gradient(
            145deg,
            rgba(27,78,126,.29),
            rgba(20,55,90,.19)
        );
    border:1px solid var(--border);
    border-radius:20px;
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
    box-shadow:inset 0 1px rgba(255,255,255,.045);
    transition:transform .25s ease,border-color .25s ease,box-shadow .25s ease;
}

.stat:hover{
    transform:translateY(-3px);
    border-color:rgba(59,130,246,.35);
    box-shadow:
        0 15px 35px rgba(0,0,0,.17),
        0 0 25px rgba(37,99,235,.07);
}

.stat-label{color:#9eb1c5;font-size:11px}
.stat-value{
    margin-top:9px;
    font-size:25px;
    font-weight:900;
    color:#f2f7fc;
}
.stat-note{
    margin-top:5px;
    color:#70869d;
    font-size:10px;
}

/* TOOLBAR */
.toolbar{
    display:flex;
    gap:12px;
    margin-bottom:18px;
}

.search{
    flex:1;
    height:48px;
    padding:0 17px;
    color:#f3f8ff;
    background:
        linear-gradient(
            135deg,
            rgba(31,84,135,.27),
            rgba(255,255,255,.035)
        );
    border:1px solid var(--border);
    border-radius:16px;
    outline:none;
    backdrop-filter:blur(14px);
}

.search::placeholder{color:#6f8499}

.search:focus{
    border-color:rgba(59,130,246,.45);
    box-shadow:0 0 25px rgba(37,99,235,.10);
}

/* TABS */
.tabs{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding-bottom:3px;
}

.tab{
    flex:0 0 auto;
    padding:11px 17px;
    border:1px solid var(--border);
    border-radius:13px;
    background:rgba(255,255,255,.035);
    color:#8fa5ba;
    transition:.22s;
}

.tab:hover{
    color:#dcecff;
    border-color:rgba(59,130,246,.28);
}

.tab.active{
    color:white;
    border-color:rgba(59,130,246,.42);
    background:
        linear-gradient(
            135deg,
            rgba(37,99,235,.29),
            rgba(56,189,248,.11)
        );
    box-shadow:
        0 0 25px rgba(37,99,235,.11),
        inset 0 1px rgba(255,255,255,.07);
}

/* SECTION */
.section{margin-bottom:20px}

.section-title{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:13px;
    font-size:17px;
    font-weight:800;
}

.section-title span{
    color:#8298ad;
    font-size:11px;
    font-weight:normal;
}

/* CARDS */
.items{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:13px;
}

.card{
    position:relative;
    overflow:hidden;
    padding:18px;
    background:
        linear-gradient(
            145deg,
            rgba(31,84,135,.28),
            rgba(16,48,79,.19),
            rgba(255,255,255,.025)
        );
    border:1px solid var(--border);
    border-radius:19px;
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
    box-shadow:inset 0 1px rgba(255,255,255,.04);
    transition:transform .22s ease,border-color .22s ease,box-shadow .22s ease;
}

.card:hover{
    transform:translateY(-2px);
    border-color:rgba(59,130,246,.30);
    box-shadow:0 15px 35px rgba(0,0,0,.16);
}

.card-head{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:12px;
    margin-bottom:12px;
}

.card-title{font-weight:800;font-size:14px}

.card-subtitle{
    color:#8298ad;
    font-size:11px;
    margin-top:5px;
}

.card-row{
    display:flex;
    justify-content:space-between;
    gap:10px;
    padding:7px 0;
    border-bottom:1px solid rgba(255,255,255,.045);
    font-size:11px;
}

.card-row:last-child{border-bottom:0}
.card-row span:first-child{color:#71879d}
.card-row span:last-child{
    color:#d9e7f4;
    text-align:left;
}

/* BADGES */
.badge{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    padding:5px 9px;
    border-radius:999px;
    font-size:10px;
    white-space:nowrap;
    border:1px solid rgba(255,255,255,.08);
}

.badge-urgent{
    color:#ffd3da;
    background:rgba(251,113,133,.12);
    border-color:rgba(251,113,133,.24);
}

.badge-high{
    color:#ffe0bd;
    background:rgba(251,146,60,.11);
    border-color:rgba(251,146,60,.22);
}

.badge-normal{
    color:#c9d7e5;
    background:rgba(255,255,255,.045);
}

.badge-done{
    color:#b9f7ce;
    background:rgba(74,222,128,.10);
    border-color:rgba(74,222,128,.20);
}

/* URGENT */
.urgent-section{
    position:relative;
    overflow:hidden;
    margin-bottom:22px;
    padding:20px;
    border-radius:24px;
    background:
        linear-gradient(
            135deg,
            rgba(37,99,235,.11),
            rgba(251,113,133,.055),
            rgba(214,184,108,.035)
        );
    border:1px solid rgba(103,156,220,.20);
    box-shadow:0 20px 55px rgba(0,0,0,.19);
}

.urgent-section::before{
    content:"";
    position:absolute;
    width:260px;
    height:260px;
    top:-170px;
    right:-80px;
    background:radial-gradient(circle,rgba(59,130,246,.17),transparent 70%);
    pointer-events:none;
}

.urgent-header{
    position:relative;
    z-index:1;
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:15px;
}

.urgent-title-wrap{
    display:flex;
    align-items:center;
    gap:11px;
}

.urgent-icon{
    width:42px;
    height:42px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:13px;
    background:

/* TOUCH LIGHT */
.touch-light{
    position:fixed;
    width:105px;
    height:105px;
    border-radius:50%;
    pointer-events:none;
    z-index:99999;
    transform:translate(-50%,-50%);
    opacity:1;
    background:
        radial-gradient(
            circle,
            var(--touch-main) 0%,
            var(--touch-second) 24%,
            var(--touch-third) 45%,
            transparent 72%
        );
    box-shadow:
        0 0 25px var(--touch-glow),
        0 0 48px var(--touch-glow2),
        0 0 80px var(--touch-glow3);
    animation:
        touchFade
        760ms
        cubic-bezier(.2,.8,.2,1)
        forwards;
    will-change:transform,opacity;
}

.touch-light::before{
    content:"";
    position:absolute;
    inset:13px;
    border-radius:50%;
    background:
        radial-gradient(
            circle,
            rgba(255,255,255,.22),
            transparent 67%
        );
}

.touch-light::after{
    content:"";
    position:absolute;
    inset:-9px;
    border-radius:50%;
    border:1px solid var(--touch-border);
    box-shadow:
        0 0 20px var(--touch-glow2),
        0 0 38px var(--touch-glow3),
        inset 0 0 14px var(--touch-second);
    animation:touchRing 760ms ease-out forwards;
}

@keyframes touchFade{
    from{
        opacity:1;
        transform:translate(-50%,-50%) scale(.25);
    }
    to{
        opacity:0;
        transform:translate(-50%,-50%) scale(1.75);
    }
}

@keyframes touchRing{
    from{
        opacity:1;
        transform:scale(.35);
    }
    to{
        opacity:0;
        transform:scale(1.9);
    }
}

/* HELPERS */

function escapeHtml(value){
    return String(value ?? '')
        .replace(/&/g,'&amp;')
        .replace(/</g,'&lt;')
        .replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;')
        .replace(/'/g,'&#039;');
}

function toNumber(value){

    if(
        value === null ||
        value === undefined ||
        value === ''
    ){
        return 0;
    }

    if(typeof value === 'number'){
        return isFinite(value) ? value : 0;
    }

    const text =
        String(value)
            .replace(/[٬,]/g,'')
            .replace(/[^\d.-]/g,'');

    const number = Number(text);

    return isFinite(number) ? number : 0;
}

function formatNumber(value){

    return new Intl.NumberFormat('fa-IR').format(
        Math.round(toNumber(value))
    );
}

function tomanDisplayValue(value){
    return toNumber(value) / 10;
}

function formatToman(value){

    return (
        formatNumber(tomanDisplayValue(value)) +
        ' تومان'
    );
}

function formatDate(value){
    if(!value){
        return '—';
    }
    return String(value);
}

function normalizeText(value){

    return String(value || '')
        .replace(/ي/g,'ی')
        .replace(/ك/g,'ک')
        .replace(/\u200c/g,' ')
        .trim()
        .toLowerCase();
}

function matchesSearch(item){

    const query =
        normalizeText(
            document
                .getElementById('search')
                ?.value || ''
        );

    if(!query){
        return true;
    }

    return Object
        .values(item || {})
        .join(' ')
        .toLowerCase()
        .includes(query);
}

/* STATUS */

function isCompleted(item){

    const status =
        normalizeText(item?.['وضعیت']);

    return (
        status.includes('انجام شده') &&
        !status.includes('انجام نشده')
    );
}

function isUnfinished(item){
    return !isCompleted(item);
}

function priorityLevel(item){

    const priority =
        normalizeText(item?.['الویت']);

    if(priority.includes('فوری')){
        return 3;
    }

    if(priority.includes('بالا')){
        return 2;
    }

    if(priority.includes('عادی')){
        return 1;
    }

    return 0;
}

function servicePriorityScore(item){

    if(isCompleted(item)){
        return 0;
    }

    return 10 + priorityLevel(item);
}

function sortServices(items){

    return [...items].sort((a,b)=>{

        const scoreA =
            servicePriorityScore(a);

        const scoreB =
            servicePriorityScore(b);

        if(scoreA !== scoreB){
            return scoreB - scoreA;
        }

        const daysA =
            toNumber(a?.['روزهای باقی مانده']);

        const daysB =
            toNumber(b?.['روزهای باقی مانده']);

        return daysA - daysB;
    });
}

/* IMPORTANT TASKS */

function getImportantUnfinishedTasks(dashboard){

    const accounting =
        Array.isArray(dashboard?.Accounting)
            ? dashboard.Accounting
            : [];

    const tax =
        Array.isArray(dashboard?.Tax)
            ? dashboard.Tax
            : [];

    return [
        ...accounting.map(item=>({
            ...item,
            __type:'حسابداری'
        })),

        ...tax.map(item=>({
            ...item,
            __type:'مالیاتی'
        }))
    ]
    .filter(item=>{
        return (
            priorityLevel(item) >= 2 &&
            isUnfinished(item)
        );
    })
    .sort((a,b)=>{

        const priorityDiff =
            priorityLevel(b) -
            priorityLevel(a);

        if(priorityDiff !== 0){
            return priorityDiff;
        }

        const daysA =
            toNumber(a?.['روزهای باقی مانده']);

        const daysB =
            toNumber(b?.['روزهای باقی مانده']);

        return daysA - daysB;
    });
}

function statusBadge(item){

            </div>

        </section>
