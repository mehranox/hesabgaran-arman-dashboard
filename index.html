<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>حسابگران آرمان</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
:root{
    --bg:#071016;
    --bg2:#0b151c;
    --card:rgba(255,255,255,.055);
    --card2:rgba(255,255,255,.075);
    --border:rgba(255,255,255,.10);

    --blue:#38bdf8;
    --blue2:#0ea5e9;

    --olive:#89964a;
    --gold:#d6b56d;

    --green:#4ade80;
    --red:#fb7185;
    --orange:#fb923c;

    --text:#f4f7f9;
    --muted:#94a3b8;

    --radius:22px;
}

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    background:
        radial-gradient(circle at 15% 10%,rgba(56,189,248,.10),transparent 28%),
        radial-gradient(circle at 85% 20%,rgba(137,150,74,.08),transparent 30%),
        radial-gradient(circle at 50% 100%,rgba(214,181,109,.06),transparent 35%),
        var(--bg);
    color:var(--text);
    font-family:
        Tahoma,
        Arial,
        sans-serif;
}

body{
    overflow-x:hidden;
}

button,
input{
    font:inherit;
}

button{
    cursor:pointer;
}

.app{
    width:min(1450px,100%);
    margin:auto;
    padding:22px;
}

/* =========================
   HEADER
========================= */

.header{
    position:relative;
    overflow:hidden;

    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;

    padding:22px 25px;
    margin-bottom:20px;

    background:
        linear-gradient(
            135deg,
            rgba(56,189,248,.08),
            rgba(255,255,255,.035)
        );

    border:1px solid var(--border);
    border-radius:28px;

    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);

    box-shadow:
        0 20px 60px rgba(0,0,0,.22);
}

.header::before{
    content:"";
    position:absolute;
    width:250px;
    height:250px;
    right:-100px;
    top:-130px;

    background:radial-gradient(
        circle,
        rgba(56,189,248,.15),
        transparent 70%
    );

    pointer-events:none;
}

.brand{
    position:relative;
    z-index:1;

    display:flex;
    align-items:center;
    gap:15px;
}

.logo{
    width:55px;
    height:55px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:18px;

    background:
        linear-gradient(
            135deg,
            rgba(56,189,248,.18),
            rgba(214,181,109,.12)
        );

    border:1px solid rgba(255,255,255,.13);

    box-shadow:
        0 0 30px rgba(56,189,248,.10);

    font-size:25px;
}

.brand h1{
    margin:0;
    font-size:21px;
    font-weight:800;
}

.brand p{
    margin:5px 0 0;
    color:var(--muted);
    font-size:12px;
}

.header-status{
    position:relative;
    z-index:1;

    display:flex;
    align-items:center;
    gap:8px;

    color:#b7c4cf;
    font-size:12px;
}

.status-dot{
    width:9px;
    height:9px;
    border-radius:50%;
    background:var(--green);
    box-shadow:0 0 12px rgba(74,222,128,.65);
}

/* =========================
   HERO
========================= */

.hero{
    position:relative;
    overflow:hidden;

    display:grid;
    grid-template-columns:1.6fr 1fr;
    gap:20px;

    margin-bottom:20px;
}

.hero-main,
.hero-side{
    position:relative;
    overflow:hidden;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.075),
            rgba(255,255,255,.025)
        );

    border:1px solid var(--border);
    border-radius:var(--radius);

    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);

    box-shadow:
        0 20px 60px rgba(0,0,0,.20);
}

.hero-main{
    padding:30px;
}

.hero-main::after{
    content:"";
    position:absolute;

    width:300px;
    height:300px;

    left:-120px;
    bottom:-180px;

    background:radial-gradient(
        circle,
        rgba(137,150,74,.15),
        transparent 70%
    );
}

.hero-title{
    position:relative;
    z-index:1;

    font-size:31px;
    line-height:1.5;
    font-weight:900;

    margin:0 0 8px;
}

.hero-subtitle{
    position:relative;
    z-index:1;

    color:var(--muted);
    font-size:13px;
    line-height:1.9;
}

.hero-side{
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:220px;
}

/* =========================
   CIRCLE
========================= */

.circle{
    width:170px;
    height:170px;
    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    position:relative;

    background:
        conic-gradient(
            var(--blue) 0deg,
            var(--olive) 180deg,
            var(--gold) 300deg,
            rgba(255,255,255,.06) 300deg
        );

    box-shadow:
        0 0 40px rgba(56,189,248,.10);
}

.circle::before{
    content:"";
    position:absolute;
    inset:10px;

    border-radius:50%;

    background:#0b151c;

    border:1px solid rgba(255,255,255,.07);
}

.circle-content{
    position:relative;
    z-index:1;
    text-align:center;
}

.circle-number{
    font-size:35px;
    font-weight:900;
}

.circle-label{
    color:var(--muted);
    font-size:11px;
    margin-top:4px;
}

/* =========================
   STATS
========================= */

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:14px;
    margin-bottom:20px;
}

.stat{
    position:relative;
    overflow:hidden;

    padding:20px;

    background:var(--card);

    border:1px solid var(--border);
    border-radius:20px;

    backdrop-filter:blur(15px);
    -webkit-backdrop-filter:blur(15px);

    transition:
        transform .25s ease,
        border-color .25s ease;
}

.stat:hover{
    transform:translateY(-3px);
    border-color:rgba(56,189,248,.25);
}

.stat-label{
    color:var(--muted);
    font-size:11px;
}

.stat-value{
    margin-top:9px;
    font-size:25px;
    font-weight:900;
}

.stat-note{
    margin-top:5px;
    color:#718194;
    font-size:10px;
}

/* =========================
   SEARCH / TABS
========================= */

.toolbar{
    display:flex;
    gap:12px;
    margin-bottom:18px;
}

.search{
    flex:1;

    height:48px;

    padding:0 17px;

    color:var(--text);

    background:rgba(255,255,255,.045);

    border:1px solid var(--border);
    border-radius:16px;

    outline:none;

    backdrop-filter:blur(12px);
}

.search::placeholder{
    color:#657483;
}

.search:focus{
    border-color:rgba(56,189,248,.4);
    box-shadow:0 0 25px rgba(56,189,248,.07);
}

.tabs{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding-bottom:3px;
}

.tab{
    flex:0 0 auto;

    padding:11px 16px;

    border:1px solid var(--border);
    border-radius:13px;

    background:rgba(255,255,255,.04);

    color:var(--muted);

    transition:.2s;
}

.tab.active{
    color:white;

    border-color:rgba(56,189,248,.32);

    background:
        linear-gradient(
            135deg,
            rgba(56,189,248,.15),
            rgba(137,150,74,.08)
        );

    box-shadow:
        0 0 25px rgba(56,189,248,.06);
}

/* =========================
   SECTION
========================= */

.section{
    margin-bottom:20px;
}

.section-title{
    display:flex;
    align-items:center;
    justify-content:space-between;

    margin-bottom:13px;

    font-size:17px;
    font-weight:800;
}

.section-title span{
    color:var(--muted);
    font-size:11px;
    font-weight:normal;
}

/* =========================
   CARDS
========================= */

.items{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:13px;
}

.card{
    position:relative;
    overflow:hidden;

    padding:18px;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.065),
            rgba(255,255,255,.025)
        );

    border:1px solid var(--border);
    border-radius:19px;

    backdrop-filter:blur(15px);
    -webkit-backdrop-filter:blur(15px);

    transition:
        transform .22s ease,
        border-color .22s ease,
        box-shadow .22s ease;
}

.card:hover{
    transform:translateY(-2px);
    border-color:rgba(56,189,248,.22);
}

.card-head{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:12px;

    margin-bottom:12px;
}

.card-title{
    font-weight:800;
    font-size:14px;
}

.card-subtitle{
    color:var(--muted);
    font-size:11px;
    margin-top:5px;
}

.card-row{
    display:flex;
    justify-content:space-between;
    gap:10px;

    padding:7px 0;

    border-bottom:1px solid rgba(255,255,255,.045);

    font-size:11px;
}

.card-row:last-child{
    border-bottom:0;
}

.card-row span:first-child{
    color:#728293;
}

.card-row span:last-child{
    color:#dce5eb;
    text-align:left;
}

.badge{
    display:inline-flex;
    align-items:center;
    justify-content:center;

    padding:5px 9px;

    border-radius:999px;

    font-size:10px;
    white-space:nowrap;

    border:1px solid rgba(255,255,255,.08);
}

.badge-urgent{
    color:#ffd0d7;
    background:rgba(251,113,133,.12);
    border-color:rgba(251,113,133,.22);
}

.badge-high{
    color:#ffd7ad;
    background:rgba(251,146,60,.11);
    border-color:rgba(251,146,60,.22);
}

.badge-normal{
    color:#cbd5df;
    background:rgba(255,255,255,.05);
}

.badge-done{
    color:#b9f7ce;
    background:rgba(74,222,128,.10);
    border-color:rgba(74,222,128,.18);
}

/* =========================
   URGENT REPORT
========================= */

.urgent-section{
    position:relative;
    overflow:hidden;

    margin-bottom:22px;
    padding:20px;

    border-radius:24px;

    background:
        linear-gradient(
            135deg,
            rgba(251,113,133,.075),
            rgba(214,181,109,.035),
            rgba(255,255,255,.025)
        );

    border:1px solid rgba(251,113,133,.16);

    box-shadow:
        0 20px 55px rgba(0,0,0,.18);
}

.urgent-section::before{
    content:"";

    position:absolute;

    width:230px;
    height:230px;

    top:-150px;
    right:-70px;

    background:radial-gradient(
        circle,
        rgba(251,113,133,.16),
        transparent 70%
    );

    pointer-events:none;
}

.urgent-header{
    position:relative;
    z-index:1;

    display:flex;
    align-items:center;
    justify-content:space-between;

    margin-bottom:15px;
}

.urgent-title-wrap{
    display:flex;
    align-items:center;
    gap:11px;
}

.urgent-icon{
    width:40px;
    height:40px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:13px;

    background:rgba(251,113,133,.12);

    border:1px solid rgba(251,113,133,.18);

    font-size:18px;
}

.urgent-title{
    font-size:16px;
    font-weight:900;
}

.urgent-subtitle{
    margin-top:4px;

    color:#8995a3;
    font-size:10px;
}

.urgent-count{
    min-width:34px;
    height:34px;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:0 10px;

    border-radius:12px;

    color:#ffd3da;
    background:rgba(251,113,133,.12);

    border:1px solid rgba(251,113,133,.20);

    font-weight:900;
}

.urgent-grid{
    position:relative;
    z-index:1;

    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
}

.urgent-card{
    position:relative;
    overflow:hidden;

    padding:16px;

    border-radius:17px;

    background:rgba(0,0,0,.16);

    border:1px solid rgba(255,255,255,.07);

    transition:.2s;
}

.urgent-card:hover{
    border-color:rgba(251,113,133,.25);
    transform:translateY(-2px);
}

.urgent-card-top{
    display:flex;
    justify-content:space-between;
    gap:10px;

    margin-bottom:10px;
}

.urgent-client{
    font-size:13px;
    font-weight:800;
}

.urgent-task{
    color:#d9e1e7;
    font-size:12px;
    line-height:1.8;

    margin-bottom:12px;
}

.urgent-meta{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
}

.urgent-empty{
    color:#91a0ad;
    font-size:12px;
    padding:12px 0;
}

/* =========================
   FINANCIAL
========================= */

.financial-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:13px;
}

.money-card{
    padding:20px;

    background:var(--card);

    border:1px solid var(--border);
    border-radius:20px;
}

.money-label{
    color:var(--muted);
    font-size:11px;
}

.money-value{
    margin-top:9px;

    font-size:20px;
    font-weight:900;
}

.money-card.blue{
    box-shadow:inset 0 1px rgba(56,189,248,.15);
}

.money-card.gold{
    box-shadow:inset 0 1px rgba(214,181,109,.15);
}

.money-card.olive{
    box-shadow:inset 0 1px rgba(137,150,74,.15);
}

/* =========================
   LOADING
========================= */

.loading{
    min-height:350px;

    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;

    gap:15px;

    color:var(--muted);
}

.spinner{
    width:38px;
    height:38px;

    border-radius:50%;

    border:3px solid rgba(255,255,255,.08);
    border-top-color:var(--blue);

    animation:spin .8s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

/* =========================
   ERROR
========================= */

.error{
    margin:20px 0;
    padding:20px;

    border-radius:18px;

    background:rgba(251,113,133,.08);

    border:1px solid rgba(251,113,133,.20);

    color:#ffd5dc;

    line-height:1.9;

    font-size:13px;
}

.retry{
    margin-top:12px;

    padding:10px 15px;

    border:1px solid rgba(255,255,255,.10);
    border-radius:12px;

    color:white;

    background:rgba(255,255,255,.06);
}

/* =========================
   FOOTER
========================= */

.footer{
    padding:20px 0 10px;

    text-align:center;

    color:#52606d;

    font-size:10px;
}

/* =========================
   TOUCH LIGHT / RIPPLE
========================= */

.touch-light{
    position:fixed;

    width:95px;
    height:95px;

    border-radius:50%;

    pointer-events:none;

    z-index:99999;

    transform:translate(-50%,-50%);

    background:
        radial-gradient(
            circle,
            rgba(56,189,248,.34) 0%,
            rgba(214,181,109,.20) 27%,
            rgba(137,150,74,.12) 48%,
            transparent 72%
        );

    box-shadow:
        0 0 25px rgba(56,189,248,.28),
        0 0 45px rgba(214,181,109,.18),
        0 0 70px rgba(137,150,74,.10);

    animation:
        touchFade 700ms cubic-bezier(.2,.8,.2,1) forwards;

    will-change:
        transform,
        opacity;
}

.touch-light::before{
    content:"";

    position:absolute;
    inset:15px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(255,255,255,.18),
            transparent 68%
        );
}

.touch-light::after{
    content:"";

    position:absolute;

    inset:-7px;

    border-radius:50%;

    border:1px solid rgba(56,189,248,.38);

    box-shadow:
        0 0 18px rgba(214,181,109,.22),
        0 0 30px rgba(56,189,248,.10),
        inset 0 0 12px rgba(137,150,74,.14);

    animation:
        touchRing 700ms ease-out forwards;
}

@keyframes touchFade{
    from{
        opacity:1;
        transform:
            translate(-50%,-50%)
            scale(.35);
    }

    to{
        opacity:0;
        transform:
            translate(-50%,-50%)
            scale(1.65);
    }
}

@keyframes touchRing{
    from{
        opacity:.95;
        transform:scale(.45);
    }

    to{
        opacity:0;
        transform:scale(1.75);
    }
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:900px){

    .hero{
        grid-template-columns:1fr;
    }

    .stats{
        grid-template-columns:repeat(2,1fr);
    }

    .financial-grid{
        grid-template-columns:1fr;
    }
}

@media(max-width:700px){

    .app{
        padding:12px;
    }

    .header{
        padding:17px;
        border-radius:22px;
    }

    .brand h1{
        font-size:17px;
    }

    .logo{
        width:45px;
        height:45px;
        border-radius:14px;
    }

    .hero-main{
        padding:23px;
    }

    .hero-title{
        font-size:24px;
    }

    .stats{
        grid-template-columns:repeat(2,1fr);
        gap:9px;
    }

    .stat{
        padding:15px;
    }

    .stat-value{
        font-size:20px;
    }

    .items{
        grid-template-columns:1fr;
    }

    .urgent-grid{
        grid-template-columns:1fr;
    }

    .toolbar{
        flex-direction:column;
    }
}

@media(max-width:420px){

    .stats{
        grid-template-columns:1fr 1fr;
    }

    .header-status{
        display:none;
    }

    .hero-side{
        min-height:190px;
    }

    .circle{
        width:145px;
        height:145px;
    }
}
</style>
</head>

<script>

/* =========================================================

const API_URL =

/* =========================================================

const tg =

if(tg){

/* =========================================================
   HELPERS
========================================================= */

function escapeHtml(value){

    return String(value ?? '')
        .replace(/&/g,'&amp;')
        .replace(/</g,'&lt;')
        .replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;')
        .replace(/'/g,'&#039;');
}


function toNumber(value){

    if(value === null || value === undefined || value === '')
        return 0;

    if(typeof value === 'number')
        return isFinite(value) ? value : 0;

    let text = String(value)
        .replace(/[٬,]/g,'')
        .replace(/[^\d.-]/g,'');

    const number = Number(text);

    return isFinite(number) ? number : 0;
}


function formatNumber(value){

    return new Intl.NumberFormat('fa-IR')
        .format(Math.round(toNumber(value)));
}


/*
=========================================================
مهم:

تمام مبالغ منبع ابتدا وارد این تابع می‌شوند.

برای نمایش در داشبورد:
مقدار عددی ÷ 10

بنابراین هیچ مبلغی نباید مستقیماً با
formatNumber()
نمایش داده شود.
=========================================================
*/

function tomanDisplayValue(value){

    return toNumber(value) / 10;
}


function formatToman(value){

    return formatNumber(
        tomanDisplayValue(value)
    ) + ' تومان';
}


function formatTomanPlain(value){

    return formatNumber(
        tomanDisplayValue(value)
    );
}


function formatDate(value){

    if(!value)
        return '—';

    return String(value);
}


function firstLetter(value){

    const text = String(value || '').trim();

    return text ? text.charAt(0) : '؟';
}


function normalizeText(value){

    return String(value || '')
        .replace(/ي/g,'ی')
        .replace(/ك/g,'ک')
        .replace(/\u200c/g,' ')
        .trim()
        .toLowerCase();
}


function matchesSearch(item){

    const query =
        normalizeText(
            document.getElementById('search')?.value || ''
        );

    if(!query)
        return true;

    return Object.values(item || {})
        .join(' ')
        .toLowerCase()
        .includes(query);
}


/* =========================================================
   STATUS
========================================================= */

function isCompleted(item){

    const status =
        normalizeText(item?.['وضعیت']);

    return (
        status.includes('انجام شده') &&
        !status.includes('انجام نشده')
    );
}


function isUnfinished(item){

    return !isCompleted(item);
}


function priorityLevel(item){

    const priority =
        normalizeText(item?.['الویت']);

    if(priority.includes('فوری'))
        return 3;

    if(priority.includes('بالا'))
        return 2;

    if(priority.includes('عادی'))
        return 1;

    return 0;
}


/*
اول:
فوریِ انجام‌نشده

بعد:
بالای انجام‌نشده

بعد:
عادیِ انجام‌نشده

و در آخر:
کارهای انجام‌شده
*/

function servicePriorityScore(item){

    const completed =
        isCompleted(item);

    const priority =
        priorityLevel(item);

    if(completed)
        return 0;

    return priority + 10;
}


function sortServices(items){

    return [...items].sort((a,b)=>{

        const scoreA =
            servicePriorityScore(a);

        const scoreB =
            servicePriorityScore(b);

        if(scoreA !== scoreB)
            return scoreB - scoreA;

        const daysA =
            toNumber(a?.['روزهای باقی مانده']);

        const daysB =
            toNumber(b?.['روزهای باقی مانده']);

        return daysA - daysB;
    });
}


/* =========================================================
   URGENT / HIGH REPORT
========================================================= */

function getImportantUnfinishedTasks(dashboard){

    const accounting =
        Array.isArray(dashboard?.Accounting)
            ? dashboard.Accounting
            : [];

    const tax =
        Array.isArray(dashboard?.Tax)
            ? dashboard.Tax
            : [];

    return [
        ...accounting.map(item=>({
            ...item,
            __type:'حسابداری'
        })),

        ...tax.map(item=>({
            ...item,
            __type:'مالیاتی'
        }))
    ]

    .filter(item=>{

        const priority =
            priorityLevel(item);

        return (
            priority >= 2 &&
            isUnfinished(item)
        );

    })

    .sort((a,b)=>{

        const priorityDiff =
            priorityLevel(b) -
            priorityLevel(a);

        if(priorityDiff !== 0)
            return priorityDiff;

        const completedA =
            isCompleted(a) ? 1 : 0;

        const completedB =
            isCompleted(b) ? 1 : 0;

        if(completedA !== completedB)
            return completedA - completedB;

        const daysA =
            toNumber(a?.['روزهای باقی مانده']);

        const daysB =
            toNumber(b?.['روزهای باقی مانده']);

        return daysA - daysB;
    });
}


/* =========================================================
   BADGES
========================================================= */

function priorityBadge(item){

    const priority =
        normalizeText(item?.['الویت']);

    if(priority.includes('فوری')){

        return `
            <span class="badge badge-urgent">
                فوری
            </span>
        `;
    }

    if(priority.includes('بالا')){

        return `
            <span class="badge badge-high">
                بالا
            </span>
        `;
    }

    return `
        <span class="badge badge-normal">
            ${escapeHtml(item?.['الویت'] || 'عادی')}
        </span>
    `;
}


function statusBadge(item){

    const status =
        String(item?.['وضعیت'] || '');

    if(isCompleted(item)){

        return `
            <span class="badge badge-done">
                انجام شده
            </span>
        `;
    }

    return `
        <span class="badge badge-normal">
            ${escapeHtml(status || 'نامشخص')}
        </span>
    `;
}

        .querySelectorAll('.tab')
        .forEach(tab=>{

                    document
                        .querySelectorAll('.tab')
                        .forEach(x=>
                            x.classList.remove('active')
                        );

                    tab.classList.add('active');

                    renderCurrentTab(
                        tab.dataset.tab
                    );
                }
            );

        });


    renderCurrentTab('overview');
}


/* =========================================================
   TAB RENDER
========================================================= */

function renderCurrentTab(tab){

    const container =
        document.getElementById(
            'dashboardItems'
        );

    if(!container || !dashboardData)
        return;


    if(tab === 'overview'){

        const accounting =
            sortServices(
                (dashboardData.Accounting || [])
                    .filter(matchesSearch)
            );

        const tax =
            sortServices(
                (dashboardData.Tax || [])
                    .filter(matchesSearch)
            );

        container.innerHTML = `

            ${renderServicesSection(
                'کارهای حسابداری',
                accounting,
                'حسابداری'
            )}

            ${renderServicesSection(
                'پرونده‌های مالیاتی',
                tax,
                'مالیاتی'
            )}

        `;

        return;
    }


    if(tab === 'accounting'){

        const items =
            sortServices(
                (dashboardData.Accounting || [])
                    .filter(matchesSearch)
            );

        container.innerHTML =
            renderServicesSection(
                'کارهای حسابداری',
                items,
                'حسابداری'
            );

        return;
    }


    if(tab === 'tax'){

        const items =
            sortServices(
                (dashboardData.Tax || [])
                    .filter(matchesSearch)
            );

        container.innerHTML =
            renderServicesSection(
                'پرونده‌های مالیاتی',
                items,
                'مالیاتی'
            );

        return;
    }


    if(tab === 'clients'){

        const items =
            (dashboardData.Clients || [])
                .filter(matchesSearch);

        container.innerHTML =
            renderClients(items);

        return;
    }


    if(tab === 'receivables'){

        const items =
            (dashboardData.Receivables || [])
                .filter(matchesSearch);

        container.innerHTML = `
            <div class="items">
                ${renderReceivables(items)}
            </div>
        `;

        return;
    }
}


/* =========================================================
   API
========================================================= */

async function loadDashboard(){

    const content =
        document.getElementById('appContent');

    try{

        if(!tg){

            throw new Error(
                'این داشبورد باید از داخل Telegram باز شود.'
            );

        }


        const initData =
            tg.initData || '';

        if(!initData){

            throw new Error(
                'Telegram initData دریافت نشد. داشبورد را از داخل ربات باز کنید.'
            );

        }


        const url =
            API_URL +
            '?action=getDashboard' +
            '&key=' +
            encodeURIComponent(API_KEY) +
            '&initData=' +
            encodeURIComponent(initData);


        const response =
            await fetch(url,{
                method:'GET',
                cache:'no-store'
            });


        const result =
            await response.json();


        if(!result || result.ok !== true){

            throw new Error(
                result?.error ||
                result?.message ||
                'دریافت اطلاعات داشبورد ناموفق بود.'
            );

        }


        if(!result.data){

            throw new Error(
                'اطلاعات داشبورد خالی است.'
            );

        }


        renderDashboard(
            result.data
        );

    }
    catch(error){

        console.error(error);

        content.innerHTML = `

            <div class="error">

                <strong>
                    خطا در دریافت اطلاعات داشبورد
                </strong>

                <div style="margin-top:8px;">
                    ${escapeHtml(
                        error?.message ||
                        String(error)
                    )}
                </div>

                <button
                    class="retry"
                    onclick="loadDashboard()"
                >
                    تلاش مجدد
                </button>

            </div>

        `;
    }
}


/* =========================================================
   TOUCH EFFECT
========================================================= */

function createTouchLight(x,y){

    const light =
        document.createElement('div');

    light.className =
        'touch-light';

    light.style.left =
        `${x}px`;

    light.style.top =
        `${y}px`;

    document.body.appendChild(light);

    setTimeout(
        ()=>{
            light.remove();
        },
        750
    );
}


document.addEventListener(
    'pointerdown',
    event=>{

        if(
            event.pointerType === 'mouse' &&
            event.button !== 0
        )
            return;

        createTouchLight(
            event.clientX,
            event.clientY
        );

    },
    {
        passive:true
    }
);
