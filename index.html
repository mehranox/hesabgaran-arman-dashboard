<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>داشبورد حسابگران آرمان</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: #f5f3ed;
      color: #222;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .box {
      background: white;
      padding: 30px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,.08);
    }
  </style>
</head>

<body>

<div class="box">
  <h2>داشبورد حسابگران آرمان</h2>
  <p id="status">در حال اتصال...</p>
</div>

<script>
const tg = window.Telegram?.WebApp;

if (tg) {
  tg.ready();
  tg.expand();

  document.getElementById('status').textContent =
    '✅ اتصال به Telegram برقرار شد';
} else {
  document.getElementById('status').textContent =
    'داشبورد را از داخل ربات تلگرام باز کنید.';
}
</script>

</body>
</html>
