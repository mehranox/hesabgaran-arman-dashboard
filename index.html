<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>حسابگران آرمان</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      font-family:
        Tahoma,
        Arial,
        sans-serif;
      background: #f4f5f2;
      color: #20251f;
    }

    body {
      min-height: 100vh;
    }

    button {
      font-family: inherit;
    }

    .container {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      padding: 18px;
    }

    /* =========================
       LOADING
    ========================= */

    #loading {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 25px;
    }

    .loading-box {
      background: white;
      border-radius: 22px;
      padding: 35px;
      width: min(420px, 100%);
      box-shadow:
        0 10px 35px rgba(0, 0, 0, 0.07);
    }

    .spinner {
      width: 42px;
      height: 42px;
      margin: 0 auto 18px;
      border: 4px solid #e3e6df;
      border-top-color: #687653;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .loading-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .loading-text {
      font-size: 13px;
      color: #777;
      line-height: 1.8;
    }

    /* =========================
       ERROR
    ========================= */

    #error {
      display: none;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .error-box {
      background: white;
      width: min(500px, 100%);
      border-radius: 22px;
      padding: 30px;
      box-shadow:
        0 10px 35px rgba(0, 0, 0, 0.08);
      text-align: center;
    }

    .error-icon {
      font-size: 42px;
      margin-bottom: 15px;
    }

    .error-title {
      font-size: 19px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .error-message {
      color: #777;
      line-height: 1.9;
      font-size: 14px;
      word-break: break-word;
    }

    .retry-btn {
      margin-top: 20px;
      border: none;
      border-radius: 12px;
      padding: 12px 25px;
      background: #687653;
      color: white;
      cursor: pointer;
      font-size: 14px;
    }

    /* =========================
       DASHBOARD
    ========================= */

    #dashboard {
      display: none;
    }

    .header {
      background: linear-gradient(
        135deg,
        #4e5d3d,
        #7d8966
      );

      color: white;
      border-radius: 25px;
      padding: 25px;
      margin-bottom: 18px;

      box-shadow:
        0 12px 30px rgba(70, 85, 55, 0.18);
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .brand-title {
      font-size: 24px;
      font-weight: 800;
    }

    .brand-subtitle {
      margin-top: 6px;
      font-size: 12px;
      opacity: 0.85;
    }

    .refresh-btn {
      border: 1px solid rgba(255,255,255,.35);
      background: rgba(255,255,255,.12);
      color: white;
      border-radius: 12px;
      padding: 10px 14px;
      cursor: pointer;
      font-size: 13px;
    }

    .refresh-btn:active {
      transform: scale(.97);
    }

    .last-update {
      margin-top: 17px;
      font-size: 11px;
      opacity: .8;
    }

    /* =========================
       STATS
    ========================= */

    .stats-grid {
      display: grid;
      grid-template-columns:
        repeat(4, minmax(0, 1fr));

      gap: 12px;
      margin-bottom: 18px;
    }

    .stat-card {
      background: white;
      border-radius: 18px;
      padding: 18px;

      box-shadow:
        0 5px 20px rgba(0,0,0,.05);
    }

    .stat-label {
      font-size: 12px;
      color: #777;
      margin-bottom: 8px;
    }

    .stat-value {
      font-size: 25px;
      font-weight: 800;
      color: #4e5d3d;
    }

    .stat-extra {
      margin-top: 7px;
      font-size: 11px;
      color: #999;
    }

    /* =========================
       SECTION
    ========================= */

    .section {
      background: white;
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 18px;

      box-shadow:
        0 5px 20px rgba(0,0,0,.05);
    }

    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 15px;
    }

    .section-title h2 {
      margin: 0;
      font-size: 17px;
    }

    .section-count {
      background: #eef1e9;
      color: #596646;
      border-radius: 20px;
      padding: 5px 10px;
      font-size: 11px;
    }

    /* =========================
       IMPORTANT TASKS
    ========================= */

    .task-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .task {
      border: 1px solid #eceee9;
      border-radius: 14px;
      padding: 14px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 15px;
    }

    .task-main {
      min-width: 0;
      flex: 1;
    }

    .task-title {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .task-meta {
      color: #888;
      font-size: 11px;
      line-height: 1.8;
    }

    .task-badge {
      flex-shrink: 0;
      border-radius: 10px;
      padding: 6px 9px;
      font-size: 10px;
    }

    .badge-urgent {
      background: #fbeaea;
      color: #a33;
    }

    .badge-high {
      background: #fff1dc;
      color: #9a6418;
    }

    .badge-normal {
      background: #edf1ea;
      color: #637052;
    }

    /* =========================
       FINANCIAL
    ========================= */

    .financial-grid {
      display: grid;
      grid-template-columns:
        repeat(3, minmax(0, 1fr));

      gap: 12px;
    }

    .financial-card {
      background: #f7f8f5;
      border-radius: 15px;
      padding: 16px;
    }

    .financial-label {
      font-size: 11px;
      color: #777;
      margin-bottom: 8px;
    }

    .financial-value {
      font-size: 18px;
      font-weight: 800;
    }

    /* =========================
       TABS
    ========================= */

    .tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      margin-bottom: 15px;
    }

    .tab {
      flex-shrink: 0;
      border: none;
      background: #eef0eb;
      color: #60685a;

      padding: 10px 15px;
      border-radius: 12px;

      cursor: pointer;
      font-size: 12px;
    }

    .tab.active {
      background: #5f6e4b;
      color: white;
    }

    /* =========================
       DATA CARDS
    ========================= */

    .data-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .data-card {
      border: 1px solid #eceee9;
      border-radius: 15px;
      padding: 15px;
    }

    .data-card-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: flex-start;
    }

    .data-title {
      font-size: 14px;
      font-weight: 700;
    }

    .data-subtitle {
      margin-top: 5px;
      color: #888;
      font-size: 11px;
    }

    .data-details {
      margin-top: 12px;

      display: grid;
      grid-template-columns:
        repeat(2, minmax(0, 1fr));

      gap: 8px;
    }

    .detail {
      background: #f7f8f5;
      border-radius: 10px;
      padding: 9px;
    }

    .detail-label {
      font-size: 9px;
      color: #999;
      margin-bottom: 4px;
    }

    .detail-value {
      font-size: 11px;
      color: #333;
      word-break: break-word;
    }

    .status {
      flex-shrink: 0;
      border-radius: 10px;
      padding: 6px 9px;
      font-size: 10px;
    }

    .status-done {
      background: #e8f3e8;
      color: #427342;
    }

    .status-progress {
      background: #fff1dc;
      color: #936117;
    }

    .status-overdue {
      background: #fbe8e8;
      color: #a33;
    }

    .status-default {
      background: #edf0eb;
      color: #666;
    }

    .empty {
      text-align: center;
      color: #999;
      padding: 25px 10px;
      font-size: 13px;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 750px) {

      .container {
        padding: 12px;
      }

      .stats-grid {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));
      }

      .financial-grid {
        grid-template-columns:
          1fr;
      }

      .brand-title {
        font-size: 20px;
      }

      .header {
        padding: 20px;
        border-radius: 20px;
      }

      .stat-card {
        padding: 15px;
      }

      .stat-value {
        font-size: 22px;
      }
    }

    @media (max-width: 430px) {

      .data-details {
        grid-template-columns: 1fr;
      }

      .task {
        align-items: flex-start;
      }

      .header-top {
        align-items: flex-start;
      }

    }

  </style>
</head>

<body>

  <!-- =========================
       LOADING
  ========================== -->

  <div id="loading">

    <div class="loading-box">

      <div class="spinner"></div>

      <div class="loading-title">
        حسابگران آرمان
      </div>

      <div class="loading-text">
        در حال اتصال به داشبورد...
      </div>

  </div>


  <!-- =========================
       ERROR
  ========================== -->

  <div id="error">

      <div class="error-icon">

  <!-- =========================

  ========================== -->

  <main id="dashboard">

          >

  </main>


  <script>

    /* =================================================
       CONFIG
    ================================================= */

    const API_URL =
      'https://script.google.com/macros/s/AKfycbzK62xIUIm8VyTektiy9EKOZBnMeXb1bxIKtcCxKfABIYFezMNEH6yfcrWAeL34zmI/exec';


    const API_KEY =
      'HesabgaranArman_2026_Bot_7xK9pQ2';


    /* =================================================
       TELEGRAM
    ================================================= */

    const tg =
      window.Telegram &&
      window.Telegram.WebApp
        ? window.Telegram.WebApp
        : null;


    let dashboardData = null;

    let currentTab = 'clients';


    if (tg) {

      try {

        tg.ready();

        tg.expand();

      } catch (error) {

        console.warn(
          'Telegram WebApp initialization warning:',
          error
        );

      }

    }


    /* =================================================
       HELPERS
    ================================================= */

    function showLoading() {

      document
        .getElementById('loading')
        .style.display = 'flex';

      document
        .getElementById('error')
        .style.display = 'none';

      document
        .getElementById('dashboard')
        .style.display = 'none';

    }


    function showError(message) {

      document
        .getElementById('loading')
        .style.display = 'none';

      document
        .getElementById('dashboard')
        .style.display = 'none';

      document
        .getElementById('error')
        .style.display = 'flex';

      document
        .getElementById('errorMessage')
        .textContent = message;

    }


    function showDashboard() {

      document
        .getElementById('loading')
        .style.display = 'none';

      document
        .getElementById('error')
        .style.display = 'none';

      document
        .getElementById('dashboard')
        .style.display = 'block';

    }


    function formatNumber(value) {

      const number =
        Number(value || 0);

      return number.toLocaleString(
        'fa-IR'
      );

    }


    function formatMoney(value) {

      return (
        formatNumber(value) +
        ' ریال'
      );

    }


    function escapeHtml(value) {

      if (
        value === null ||
        value === undefined
      ) {

        return '';

      }

      return String(value)

        .replace(
          /&/g,
          '&amp;'
        )

        .replace(
          /</g,
          '&lt;'
        )

        .replace(
          />/g,
          '&gt;'
        )

        .replace(
          /"/g,
          '&quot;'
        )

        .replace(
          /'/g,
          '&#039;'
        );

    }


    function getStatusClass(status) {

      if (!status) {

        return 'status-default';

      }

      const s =
        String(status)
          .toLowerCase();

      if (
        s.includes('done') ||
        s.includes('انجام') ||
        s.includes('دریافت')
      ) {

        return 'status-done';

      }

      if (
        s.includes('overdue') ||
        s.includes('سررسید') ||
        s.includes('معوق')
      ) {

        return 'status-overdue';

      }

      if (
        s.includes('progress') ||
        s.includes('انجام نشده') ||
        s.includes('در حال')
      ) {

        return 'status-progress';

      }

      return 'status-default';

    }


    function getPriorityClass(priority) {

      if (!priority) {

        return 'badge-normal';

      }

      const p =
        String(priority)
          .toLowerCase();

      if (
        p.includes('urgent') ||
        p.includes('فوری')
      ) {

        return 'badge-urgent';

      }

      if (
        p.includes('high') ||
        p.includes('بالا')
      ) {

        return 'badge-high';

      }

      return 'badge-normal';

    }


    /* =================================================
       LOAD DASHBOARD
    ================================================= */

    async function loadDashboard() {

      showLoading();


      /*
       * مهم:
       *
       * initData باید دقیقاً از Telegram
       * گرفته شود و خودمان آن را decode نکنیم.
       */

      if (
        !tg
      ) {

        showError(
          'این داشبورد باید از داخل Telegram باز شود.'
        );

        return;

      }


      const initData =
        tg.initData;


      if (
        !initData
      ) {

        showError(
          'Telegram initData دریافت نشد. داشبورد را مستقیماً از داخل ربات باز کنید.'
        );

        return;

      }


      try {

        /*
         * URLSearchParams خودش مقدار initData
         * را به شکل صحیح برای URL encode می‌کند.
         */

        const params =
          new URLSearchParams();


        params.set(
          'action',
          'getDashboard'
        );


        params.set(
          'key',
          API_KEY
        );


        params.set(
          'initData',
          initData
        );


        const requestUrl =
          API_URL +
          '?' +
          params.toString();


        const response =
          await fetch(
            requestUrl,
            {
              method: 'GET',
              cache: 'no-store'
            }
          );


        if (
          !response.ok
        ) {

          throw new Error(
            'خطای HTTP: ' +
            response.status
          );

        }


        const result =
          await response.json();


        if (
          !result.ok
        ) {

          throw new Error(
            result.error ||
            'خطای نامشخص از سمت Apps Script'
          );

        }


        if (
          !result.data
        ) {

          throw new Error(
            'اطلاعات داشبورد دریافت نشد.'
          );

        }


        dashboardData =
          result.data;


        renderDashboard();


        showDashboard();


      } catch (error) {

        console.error(
          'Dashboard error:',
          error
        );


        showError(
          error.message ||
          'خطا در دریافت اطلاعات داشبورد.'
        );

      }

    }


    /* =================================================
       RENDER DASHBOARD
    ================================================= */

    function renderDashboard() {

      if (
        !dashboardData
      ) {

        return;

      }


      const summary =
        dashboardData.Summary ||
        {};


      document
        .getElementById('clientsCount')
        .textContent =
          formatNumber(
            summary.ClientsCount
          );


      document
        .getElementById('activeClients')
        .textContent =
          'فعال: ' +
          formatNumber(
            summary.ActiveClients
          );


      document
        .getElementById('accountingCount')
        .textContent =
          formatNumber(
            summary.AccountingCount
          );


      document
        .getElementById('accountingStatus')
        .textContent =
          'انجام‌شده: ' +
          formatNumber(
            summary.AccountingCompleted
          );


      document
        .getElementById('taxCount')
        .textContent =
          formatNumber(
            summary.TaxCount
          );


      document
        .getElementById('taxStatus')
        .textContent =
          'انجام‌شده: ' +
          formatNumber(
            summary.TaxCompleted
          );


      document
        .getElementById('remainingReceivables')
        .textContent =
          formatMoney(
            summary.RemainingReceivables
          );


      document
        .getElementById('receivablesStatus')
        .textContent =
          'معوق: ' +
          formatNumber(
            summary.ReceivablesOverdue
          );


      document
        .getElementById('totalReceivables')
        .textContent =
          formatMoney(
            summary.TotalReceivables
          );


      document
        .getElementById('totalCollected')
        .textContent =
          formatMoney(
            summary.TotalCollected
          );


      document
        .getElementById('remainingFinancial')
        .textContent =
          formatMoney(
            summary.RemainingReceivables
          );


      renderUrgentTasks();


      renderCurrentTab();


      document
        .getElementById('lastUpdate')
        .textContent =
          'آخرین بروزرسانی: ' +
          new Date()
            .toLocaleString(
              'fa-IR'
            );

    }


    /* =================================================
       URGENT TASKS
    ================================================= */

    function renderUrgentTasks() {

      const tax =
        Array.isArray(
          dashboardData.Tax
        )
          ? dashboardData.Tax
          : [];


      const accounting =
        Array.isArray(
          dashboardData.Accounting
        )
          ? dashboardData.Accounting
          : [];


      const all =
        tax.concat(
          accounting
        );


      const urgent =
        all.filter(function(item) {

          const priority =
            String(
              item.priority ||
              item.Priority ||
              ''
            )
            .toLowerCase();


          const status =
            String(
              item.status ||
              item.Status ||
              ''
            )
            .toLowerCase();


          return (

            priority.includes('urgent') ||
            priority.includes('فوری') ||

            (
              status.includes('overdue') ||
              status.includes('معوق') ||
              status.includes('سررسید')
            )

          );

        });


      document
        .getElementById('urgentCount')
        .textContent =
          formatNumber(
            urgent.length
          );


      const container =
        document
          .getElementById('urgentTasks');


      if (
        urgent.length === 0
      ) {

        container.innerHTML =
          '<div class="empty">کار فوری یا معوقی وجود ندارد.</div>';

        return;

      }


      container.innerHTML =
        urgent
          .slice(0, 10)
          .map(function(item) {

            const title =
              item.task ||
              item.title ||
              item.description ||
              item.action ||
              'کار بدون عنوان';


            const client =
              item.client ||
              item.client_name ||
              item.Client ||
              '';


            const due =
              item.due_date ||
              item.dueDate ||
              item.deadline ||
              '';


            const priority =
              item.priority ||
              item.Priority ||
              'فوری';


            return `

              <div class="task">

                <div class="task-main">

                  <div class="task-title">
                    ${escapeHtml(title)}
                  </div>

                  <div class="task-meta">

                    ${
                      client
                        ? escapeHtml(client)
                        : ''
                    }

                    ${
                      due
                        ? ' · سررسید: ' +
                          escapeHtml(due)
                        : ''
                    }

                  </div>

                </div>

                <div class="task-badge ${
                  getPriorityClass(priority)
                }">

                  ${escapeHtml(priority)}

                </div>

              </div>

            `;

          })
          .join('');

    }


    /* =================================================
       TABS
    ================================================= */

    function switchTab(tab) {

      currentTab =
        tab;


      document
        .querySelectorAll('.tab')
        .forEach(function(button) {

          button.classList.toggle(
            'active',
            button.dataset.tab === tab
          );

        });


      renderCurrentTab();

    }


    function renderCurrentTab() {

      const container =
        document
          .getElementById('dataList');


      if (
        !dashboardData
      ) {

        container.innerHTML =
          '<div class="empty">اطلاعاتی وجود ندارد.</div>';

        return;

      }


      let data = [];


      if (
        currentTab === 'clients'
      ) {

        data =
          Array.isArray(
            dashboardData.Clients
          )
            ? dashboardData.Clients
            : [];

      }


      if (
        currentTab === 'accounting'
      ) {

        data =
          Array.isArray(
            dashboardData.Accounting
          )
            ? dashboardData.Accounting
            : [];

      }


      if (
        currentTab === 'tax'
      ) {

        data =
          Array.isArray(
            dashboardData.Tax
          )
            ? dashboardData.Tax
            : [];

      }


      if (
        currentTab === 'receivables'
      ) {

        data =
          Array.isArray(
            dashboardData.Receivables
          )
            ? dashboardData.Receivables
            : [];

      }


      if (
        data.length === 0
      ) {

        container.innerHTML =
          '<div class="empty">موردی برای نمایش وجود ندارد.</div>';

        return;

      }


      if (
        currentTab === 'clients'
      ) {

        renderClients(
          data,
          container
        );

        return;

      }


      if (
        currentTab === 'receivables'
      ) {

        renderReceivables(
          data,
          container
        );

        return;

      }


      renderTasks(
        data,
        container
      );

    }


    /* =================================================
       CLIENTS
    ================================================= */

    function renderClients(
      data,
      container
    ) {

      container.innerHTML =
        data
          .map(function(item) {

            const name =
              item.name ||
              item.client_name ||
              item['نام شخص/شرکت'] ||
              'بدون نام';


            const type =
              item.type ||
              item.client_type ||
              '';


            const service =
              item.package ||
              item.services ||
              item.service ||
              '';


            const mobile =
              item.mobile ||
              item.phone ||
              '';


            const status =
              item.status ||
              '';


            return `

              <div class="data-card">

                <div class="data-card-top">

                  <div>

                    <div class="data-title">
                      ${escapeHtml(name)}
                    </div>

                    <div class="data-subtitle">
                      ${escapeHtml(type)}
                    </div>

                  </div>

                  <div class="status ${
                    getStatusClass(status)
                  }">

                    ${escapeHtml(
                      status || 'فعال'
                    )}

                  </div>

                </div>


                <div class="data-details">

                  <div class="detail">

                    <div class="detail-label">
                      خدمات
                    </div>

                    <div class="detail-value">
                      ${escapeHtml(service)}
                    </div>

                  </div>


                  <div class="detail">

                    <div class="detail-label">
                      تماس
                    </div>

                    <div class="detail-value">
                      ${escapeHtml(mobile)}
                    </div>

                  </div>

                </div>

              </div>

            `;

          })
          .join('');

    }


    /* =================================================
       TASKS
    ================================================= */

    function renderTasks(
      data,
      container
    ) {

      container.innerHTML =
        data
          .map(function(item) {

            const title =
              item.task ||
              item.title ||
              item.description ||
              item.action ||
              'بدون عنوان';


            const client =
              item.client ||
              item.client_name ||
              item.Client ||
              '';


            const period =
              item.period ||
              item.year ||
              '';


            const due =
              item.due_date ||
              item.dueDate ||
              item.deadline ||
              '';


            const status =
              item.status ||
              item.Status ||
              '';


            return `

              <div class="data-card">

                <div class="data-card-top">

                  <div>

                    <div class="data-title">
                      ${escapeHtml(title)}
                    </div>

                    <div class="data-subtitle">

                      ${
                        client
                          ? escapeHtml(client)
                          : ''
                      }

                      ${
                        period
                          ? ' · ' +
                            escapeHtml(period)
                          : ''
                      }

                    </div>

                  </div>


                  <div class="status ${
                    getStatusClass(status)
                  }">

                    ${escapeHtml(
                      status || 'نامشخص'
                    )}

                  </div>

                </div>


                <div class="data-details">

                  <div class="detail">

                    <div class="detail-label">
                      سررسید
                    </div>

                    <div class="detail-value">
                      ${escapeHtml(due)}
                    </div>

                  </div>


                  <div class="detail">

                    <div class="detail-label">
                      اولویت
                    </div>

                    <div class="detail-value">
                      ${escapeHtml(
                        item.priority ||
                        item.Priority ||
                        'عادی'
                      )}
                    </div>

                  </div>

                </div>

              </div>

            `;

          })
          .join('');

    }


    /* =================================================
       RECEIVABLES
    ================================================= */

    function renderReceivables(
      data,
      container
    ) {

      container.innerHTML =
        data
          .map(function(item) {

            const client =
              item.client ||
              item.client_name ||
              item.Client ||
              'بدون نام';


            const service =
              item.service ||
              item.package ||
              '';


            const amount =
              item.amount ||
              item.receivable ||
              item.Receivable ||
              0;


            const due =
              item.due_date ||
              item.dueDate ||
              item.deadline ||
              '';


            const status =
              item.status ||
              '';


            return `

              <div class="data-card">

                <div class="data-card-top">

                  <div>

                    <div class="data-title">
                      ${escapeHtml(client)}
                    </div>

                    <div class="data-subtitle">
                      ${escapeHtml(service)}
                    </div>

                  </div>


                  <div class="status ${
                    getStatusClass(status)
                  }">

                    ${escapeHtml(
                      status || 'نامشخص'
                    )}

                  </div>

                </div>


                <div class="data-details">

                  <div class="detail">

                    <div class="detail-label">
                      مبلغ
                    </div>

                    <div class="detail-value">
                      ${formatMoney(amount)}
                    </div>

                  </div>


                  <div class="detail">

                    <div class="detail-label">
                      سررسید
                    </div>

                    <div class="detail-value">
                      ${escapeHtml(due)}
                    </div>

                  </div>

                </div>

              </div>

            `;

          })
          .join('');

    }


    /* =================================================
       START
    ================================================= */

    document.addEventListener(
      'DOMContentLoaded',
      function() {

        loadDashboard();

      }
    );

  </script>
