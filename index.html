<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>حسابگران آرمان</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap');

    :root {
      --bg: #07131B;
      --bg2: #0B1D25;

      --blue: #38BDF8;
      --blue-dark: #2563EB;

      --gold: #D6B56D;
      --gold-light: #F0D28A;

      --olive: #89964A;
      --olive-light: #A8B85D;

      --text: #F5F7F4;
      --muted: #9CAEB4;

      --glass: rgba(255,255,255,0.065);
      --glass-light: rgba(255,255,255,0.095);
      --border: rgba(255,255,255,0.10);

      --success: #65D6A0;
      --warning: #F4C96B;
      --danger: #FF6675;
      --info: #38BDF8;

      --radius-xl: 25px;
      --radius-lg: 20px;
      --radius-md: 16px;

      --shadow:
        0 18px 55px rgba(0,0,0,0.32),
        inset 0 1px 0 rgba(255,255,255,0.045);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);

      background:
        radial-gradient(
          circle at 0% 0%,
          rgba(56,189,248,0.12),
          transparent 30%
        ),
        radial-gradient(
          circle at 100% 4%,
          rgba(214,181,109,0.11),
          transparent 28%
        ),
        radial-gradient(
          circle at 50% 100%,
          rgba(137,150,74,0.10),
          transparent 32%
        ),
        linear-gradient(
          145deg,
          var(--bg),
          var(--bg2)
        );

      font-family:
        "Vazirmatn",
        Tahoma,
        Arial,
        sans-serif;

      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;

      background:
        linear-gradient(
          rgba(255,255,255,0.012) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(255,255,255,0.012) 1px,
          transparent 1px
        );

      background-size: 42px 42px;

      mask-image:
        linear-gradient(
          to bottom,
          rgba(0,0,0,0.5),
          transparent 80%
        );

      opacity: 0.25;
    }

    button,
    input {
      font-family: inherit;
    }

    .app {
      width: min(1100px, 100%);
      margin: 0 auto;
      padding: 14px 13px 40px;
      position: relative;
      z-index: 1;
    }

    /* =========================================================
       GLASS
    ========================================================= */

    .glass {
      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,0.075),
          rgba(255,255,255,0.035)
        );

      border: 1px solid var(--border);
      box-shadow: var(--shadow);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      position: relative;
      overflow: hidden;
    }

    .glass::before {
      content: "";

      position: absolute;
      top: 0;
      left: 12%;
      right: 12%;

      height: 1px;

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(255,255,255,0.15),
          transparent
        );

      pointer-events: none;
    }

    /* =========================================================
       HERO
    ========================================================= */

    .hero {
      border-radius: var(--radius-xl);
      padding: 21px 20px 18px;
      margin-bottom: 14px;
    }

    .hero::after {
      content: "";

      position: absolute;

      width: 170px;
      height: 170px;

      left: -70px;
      bottom: -100px;

      border-radius: 50%;

      background:
        rgba(56,189,248,0.07);

      filter: blur(30px);

      pointer-events: none;
    }

    .hero-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .brand-wrap {
      min-width: 0;
    }

    .brand {
      margin: 0;

      font-size: 21px;
      line-height: 1.4;
      font-weight: 800;

      letter-spacing: -0.5px;
    }

    .brand-subtitle {
      margin-top: 5px;

      color: var(--muted);

      font-size: 10px;
      font-weight: 400;
    }

    .secure-status {
      display: inline-flex;
      align-items: center;
      gap: 6px;

      white-space: nowrap;

      padding: 7px 10px;

      border-radius: 999px;

      background:
        rgba(101,214,160,0.075);

      border:
        1px solid rgba(101,214,160,0.17);

      color: #B9EED4;

      font-size: 8px;
      flex-shrink: 0;
    }

    .pulse {
      width: 7px;
      height: 7px;

      border-radius: 50%;

      background: var(--success);

      box-shadow:
        0 0 0 0 rgba(101,214,160,0.55);

      animation:
        pulse 2.2s infinite;
    }

    @keyframes pulse {
      0% {
        box-shadow:
          0 0 0 0 rgba(101,214,160,0.5);
      }

      70% {
        box-shadow:
          0 0 0 7px rgba(101,214,160,0);
      }

      100% {
        box-shadow:
          0 0 0 0 rgba(101,214,160,0);
      }
    }

    .hero-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 10px;

      margin-top: 23px;
      padding-top: 13px;

      border-top:
        1px solid rgba(255,255,255,0.07);
    }

    .user-info,
    .telegram-verified {
      font-size: 8px;
      color: var(--muted);
    }

    .telegram-verified {
      color: #A9E9CF;

      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* =========================================================
       STATS
    ========================================================= */

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);

      gap: 10px;

      margin-bottom: 14px;
    }

    .stat-card {
      min-height: 100px;

      padding: 15px;

      border-radius:
        var(--radius-lg);
    }

    .stat-head {
      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 8px;
    }

    .stat-icon {
      width: 31px;
      height: 31px;

      display: grid;
      place-items: center;

      border-radius: 10px;

      background:
        rgba(56,189,248,0.08);

      border:
        1px solid rgba(56,189,248,0.13);

      font-size: 14px;
    }

    .stat-label {
      color: var(--muted);

      font-size: 9px;
      line-height: 1.7;
    }

    .stat-value {
      margin-top: 10px;

      font-size: 22px;
      line-height: 1;

      font-weight: 800;

      direction: ltr;
      text-align: right;
    }

    .stat-card:nth-child(2) .stat-icon {
      color: var(--gold-light);

      background:
        rgba(214,181,109,0.08);

      border-color:
        rgba(214,181,109,0.13);
    }

    .stat-card:nth-child(3) .stat-icon {
      color: var(--olive-light);

      background:
        rgba(137,150,74,0.09);

      border-color:
        rgba(137,150,74,0.14);
    }

    .stat-card:nth-child(4) .stat-icon {
      color: var(--success);

      background:
        rgba(101,214,160,0.08);

      border-color:
        rgba(101,214,160,0.13);
    }

    /* =========================================================
       SECTION
    ========================================================= */

    .section {
      margin-top: 18px;
    }

    .section-title-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;

      gap: 10px;

      margin-bottom: 10px;
      padding: 0 3px;
    }

    .section-title {
      margin: 0;

      font-size: 15px;
      font-weight: 800;
    }

    .section-count {
      color: var(--muted);
      font-size: 9px;
    }

    /* =========================================================
       OVERVIEW
    ========================================================= */

    .overview-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);

      gap: 10px;
    }

    .chart-card {
      min-height: 172px;

      border-radius:
        var(--radius-lg);

      padding: 17px 12px;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .donut {
      width: 105px;
      height: 105px;

      border-radius: 50%;

      display: grid;
      place-items: center;

      position: relative;

      margin-bottom: 11px;
    }

    .donut::after {
      content: "";

      position: absolute;

      width: 75px;
      height: 75px;

      border-radius: 50%;

      background:
        rgba(7,19,27,0.93);

      border:
        1px solid rgba(255,255,255,0.06);

      box-shadow:
        inset 0 0 18px rgba(0,0,0,0.18);
    }

    .donut-center {
      position: relative;
      z-index: 2;

      text-align: center;
    }

    .donut-number {
      font-size: 21px;
      font-weight: 800;

      line-height: 1;

      direction: ltr;
    }

    .donut-unit {
      margin-top: 4px;

      font-size: 7px;

      color: var(--muted);
    }

    .chart-title {
      font-size: 10px;
      color: var(--muted);
    }

    /* =========================================================
       FINANCIAL
    ========================================================= */

    .financial-card {
      border-radius:
        var(--radius-xl);

      padding: 17px;
    }

    .financial-subtitle {
      color: var(--muted);

      font-size: 9px;

      margin-top: 3px;
    }

    .financial-grid {
      display: grid;

      grid-template-columns:
        repeat(2, 1fr);

      gap: 8px;

      margin-top: 15px;
    }

    .financial-item {
      padding: 12px;

      border-radius: 15px;

      background:
        rgba(255,255,255,0.035);

      border:
        1px solid rgba(255,255,255,0.055);
    }

    .financial-label {
      color: var(--muted);
      font-size: 8px;
    }

    .financial-value {
      margin-top: 7px;

      font-size: 12px;
      font-weight: 700;

      line-height: 1.5;

      direction: rtl;
    }

    .financial-value.success {
      color: var(--success);
    }

    .financial-value.gold {
      color: var(--gold-light);
    }

    .financial-value.blue {
      color: var(--blue);
    }

    /* =========================================================
       SERVICES
    ========================================================= */

    .services-header {
      margin-bottom: 10px;
    }

    .search-wrap {
      position: relative;
      margin-bottom: 10px;
    }

    .search-icon {
      position: absolute;

      right: 13px;
      top: 50%;

      transform:
        translateY(-50%);

      color: var(--muted);

      font-size: 12px;

      pointer-events: none;
    }

    .search-input {
      width: 100%;
      height: 43px;

      border-radius: 15px;

      border:
        1px solid var(--border);

      outline: none;

      color: var(--text);

      background:
        rgba(255,255,255,0.055);

      padding:
        0 38px 0 13px;

      font-size: 9px;

      backdrop-filter:
        blur(15px);

      -webkit-backdrop-filter:
        blur(15px);

      transition: 0.2s ease;
    }

    .search-input::placeholder {
      color: #71868D;
    }

    .search-input:focus {
      border-color:
        rgba(56,189,248,0.32);

      background:
        rgba(255,255,255,0.075);

      box-shadow:
        0 0 0 3px
        rgba(56,189,248,0.05);
    }

    .tabs {
      display: flex;

      gap: 7px;

      overflow-x: auto;

      scrollbar-width: none;

      padding-bottom: 2px;
    }

    .tabs::-webkit-scrollbar {
      display: none;
    }

    .tab {
      flex: 0 0 auto;

      border:
        1px solid rgba(255,255,255,0.08);

      background:
        rgba(255,255,255,0.045);

      color: var(--muted);

      padding: 8px 13px;

      border-radius: 999px;

      font-size: 8px;

      cursor: pointer;

      transition: 0.2s ease;
    }

    .tab.active {
      color: #DDF6FF;

      background:
        rgba(56,189,248,0.12);

      border-color:
        rgba(56,189,248,0.23);

      box-shadow:
        inset 0 1px 0
        rgba(255,255,255,0.07);
    }

    .items {
      display: grid;
      gap: 10px;
    }

    /* =========================================================
       ITEM CARDS
    ========================================================= */

    .item-card {
      border-radius:
        var(--radius-lg);

      padding: 15px;

      position: relative;
    }

    .priority-line {
      position: absolute;

      right: 0;
      top: 16px;
      bottom: 16px;

      width: 2px;

      border-radius:
        3px 0 0 3px;

      background:
        var(--olive);

      opacity: 0.75;
    }

    .priority-line.urgent {
      background:
        var(--danger);

      box-shadow:
        0 0 10px
        rgba(255,102,117,0.42);

      opacity: 1;
    }

    .priority-line.high {
      background:
        var(--gold-light);

      box-shadow:
        0 0 8px
        rgba(240,210,138,0.32);

      opacity: 1;
    }

    .priority-line.normal {
      background:
        var(--gold);
    }

    .priority-line.low {
      background:
        var(--olive-light);
    }

    .item-card.priority-urgent-open {
      border-color:
        rgba(255,102,117,0.18);

      box-shadow:
        0 18px 55px rgba(0,0,0,0.32),
        0 0 20px rgba(255,102,117,0.045),
        inset 0 1px 0
        rgba(255,255,255,0.045);
    }

    .item-card.priority-high-open {
      border-color:
        rgba(240,210,138,0.17);

      box-shadow:
        0 18px 55px rgba(0,0,0,0.32),
        0 0 20px rgba(240,210,138,0.035),
        inset 0 1px 0
        rgba(255,255,255,0.045);
    }

    .item-top {
      display: flex;

      align-items: flex-start;
      justify-content: space-between;

      gap: 9px;

      padding-right: 4px;
    }

    .item-name {
      font-size: 12px;
      font-weight: 700;

      line-height: 1.7;
    }

    .item-code {
      color: var(--muted);

      font-size: 7px;

      margin-top: 2px;
    }

    .badge {
      display: inline-flex;

      align-items: center;
      justify-content: center;

      white-space: nowrap;

      border-radius: 999px;

      padding: 5px 8px;

      font-size: 7px;

      border:
        1px solid transparent;
    }

    .badge.success {
      color: #AEEACB;

      background:
        rgba(101,214,160,0.08);

      border-color:
        rgba(101,214,160,0.15);
    }

    .badge.info {
      color: #B6EBFF;

      background:
        rgba(56,189,248,0.08);

      border-color:
        rgba(56,189,248,0.15);
    }

    .badge.warning {
      color: #F7D98C;

      background:
        rgba(244,201,107,0.08);

      border-color:
        rgba(244,201,107,0.15);
    }

    .badge.danger {
      color: #FFAFB8;

      background:
        rgba(255,102,117,0.08);

      border-color:
        rgba(255,102,117,0.15);
    }

    .badge.olive {
      color: #D0DC8A;

      background:
        rgba(137,150,74,0.09);

      border-color:
        rgba(137,150,74,0.15);
    }

    .detail-grid {
      display: grid;

      grid-template-columns:
        repeat(2, 1fr);

      gap: 8px 10px;

      margin-top: 13px;
    }

    .detail {
      min-width: 0;
    }

    .detail-label {
      color: #72878E;

      font-size: 7px;

      margin-bottom: 3px;
    }

    .detail-value {
      color: #D9E0DF;

      font-size: 8px;

      line-height: 1.65;

      overflow-wrap: anywhere;
    }

    .description {
      grid-column:
        1 / -1;

      padding-top: 2px;
    }

    .empty {
      border-radius:
        var(--radius-lg);

      padding: 30px 15px;

      text-align: center;

      color: var(--muted);

      font-size: 9px;
    }

    /* =========================================================
       CLIENTS
    ========================================================= */

    .client-card {
      border-radius:
        var(--radius-lg);

      padding: 15px;
    }

    .client-top {
      display: flex;

      align-items: center;

      gap: 10px;
    }

    .avatar {
      width: 40px;
      height: 40px;

      border-radius: 13px;

      display: grid;
      place-items: center;

      flex-shrink: 0;

      color: #EAF5F2;

      font-size: 14px;
      font-weight: 800;

      background:
        linear-gradient(
          145deg,
          rgba(56,189,248,0.16),
          rgba(137,150,74,0.15)
        );

      border:
        1px solid rgba(255,255,255,0.10);
    }

    .client-name {
      font-size: 11px;
      font-weight: 700;

      line-height: 1.7;
    }

    .client-type {
      color: var(--muted);

      font-size: 7px;

      margin-top: 2px;
    }

    .active-dot {
      margin-right: auto;

      width: 7px;
      height: 7px;

      border-radius: 50%;

      background:
        var(--success);

      box-shadow:
        0 0 9px
        rgba(101,214,160,0.28);
    }

    .client-details {
      margin-top: 13px;

      padding-top: 11px;

      border-top:
        1px solid
        rgba(255,255,255,0.06);
    }

    /* =========================================================
       RECEIVABLES
    ========================================================= */

    .receivables-section {
      grid-column: 1 / -1;

      margin-top: 8px;
    }

    .receivables-container {
      display: grid;
      gap: 10px;
    }

    .receivable-card {
      border-radius:
        var(--radius-lg);

      padding: 15px;
    }

    .money {
      color: var(--gold-light);

      font-weight: 800;

      font-size: 11px;

      direction: rtl;
    }

    .money-small {
      color: var(--muted);
      font-size: 7px;
    }

    /* =========================================================
       TOUCH LIGHT
    ========================================================= */

    .touch-light {
      position: fixed;

      width: 105px;
      height: 105px;

      border-radius: 50%;

      pointer-events: none;

      z-index: 9999;

      transform:
        translate(-50%, -50%)
        scale(0.45);

      background:
        radial-gradient(
          circle,
          rgba(56,189,248,0.30) 0%,
          rgba(56,189,248,0.16) 22%,
          rgba(214,181,109,0.13) 42%,
          rgba(137,150,74,0.08) 57%,
          transparent 74%
        );

      filter:
        blur(2px);

      animation:
        touchLightFade
        700ms
        cubic-bezier(.2,.7,.2,1)
        forwards;
    }

    .touch-light::before {
      content: "";

      position: absolute;

      inset: 10px;

      border-radius: 50%;

      border:
        1.5px solid
        rgba(56,189,248,0.48);

      box-shadow:
        0 0 18px
        rgba(56,189,248,0.25),

        inset 0 0 15px
        rgba(214,181,109,0.10);

      animation:
        touchRing
        700ms
        ease-out
        forwards;
    }

    .touch-light::after {
      content: "";

      position: absolute;

      inset: 27px;

      border-radius: 50%;

      border:
        1px solid
        rgba(240,210,138,0.42);

      box-shadow:
        0 0 14px
        rgba(240,210,138,0.20);
    }

    @keyframes touchLightFade {

      0% {
        opacity: 0.95;

        transform:
          translate(-50%, -50%)
          scale(0.35);
      }

      45% {
        opacity: 0.80;
      }

      100% {
        opacity: 0;

        transform:
          translate(-50%, -50%)
          scale(1.65);
      }
    }

    @keyframes touchRing {

      0% {
        transform: scale(0.35);
        opacity: 0.9;
      }

      100% {
        transform: scale(1.8);
        opacity: 0;
      }
    }

    /* =========================================================
       LOADING
    ========================================================= */

    .loading-screen {
      min-height: 100vh;

      display: grid;
      place-items: center;

      padding: 30px;
    }

    .loading-box {
      width: min(340px, 100%);

      border-radius: 24px;

      padding: 27px 20px;

      text-align: center;
    }

    .loading-logo {
      width: 54px;
      height: 54px;

      margin:
        0 auto 15px;

      border-radius: 17px;

      display: grid;
      place-items: center;

      font-size: 22px;
      font-weight: 800;

      color: var(--gold-light);

      background:
        rgba(214,181,109,0.08);

      border:
        1px solid
        rgba(214,181,109,0.16);
    }

    .loading-title {
      font-size: 13px;
      font-weight: 700;
    }

    .loading-text {
      margin-top: 7px;

      color: var(--muted);

      font-size: 8px;

      line-height: 1.8;
    }

    .spinner {
      width: 25px;
      height: 25px;

      margin:
        17px auto 0;

      border:
        2px solid
        rgba(255,255,255,0.08);

      border-top-color:
        var(--blue);

      border-right-color:
        var(--gold);

      border-radius: 50%;

      animation:
        spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* =========================================================
       ERROR
    ========================================================= */

    .error-box {
      max-width: 420px;

      margin: 60px auto;

      padding: 25px 20px;

      text-align: center;

      border-radius: 24px;
    }

    .error-icon {
      font-size: 30px;
      margin-bottom: 10px;
    }

    .error-title {
      font-size: 13px;
      font-weight: 700;
    }

    .error-message {

  /* =========================================================
     HELPERS
  ========================================================= */

  function escapeHtml(value) {

    if (
      value === null ||
      value === undefined
    ) {
      return '—';
    }

    return String(value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');

  }


  function toNumber(value) {

    if (
      value === null ||
      value === undefined ||
      value === ''
    ) {
      return 0;
    }

    if (typeof value === 'number') {
      return value;
    }

    let text =
      String(value)
        .replace(/,/g, '')
        .replace(/٬/g, '')
        .replace(/٫/g, '.');

    text =
      text.replace(
        /[۰-۹]/g,
        d =>
          '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)
      );

    text =
      text.replace(
        /[٠-٩]/g,
        d =>
          '٠١٢٣٤٥٦٧٨٩'.indexOf(d)
      );

    return Number(text) || 0;

  }


  function formatNumber(value) {

    return new Intl.NumberFormat(
      'fa-IR'
    ).format(
      Math.round(
        toNumber(value)
      )
    );

  }


  /*
   * =========================================================
   * تبدیل قطعی ریال به تومان
   *
   * داده‌های JSON ریالی هستند.
   *
   * مثال:
   *
   * 100,000,000 ریال
   *        ↓
   * 10,000,000 تومان
   *
   * این تابع تنها محل تبدیل مبالغ مالی است.
   * =========================================================
   */

  function rialToToman(value) {

    return (
      toNumber(value) / 10
    );

  }


  function formatToman(value) {

    const toman =
      rialToToman(value);

    return (
      formatNumber(toman) +
      ' تومان'
    );

  }


  function formatDate(value) {

    if (!value) {
      return '—';
    }

    return escapeHtml(value);

  }


  function firstLetter(name) {

    if (!name) {
      return 'آ';
    }

    const text =
      String(name).trim();

    if (!text) {
      return 'آ';
    }

    return text.charAt(0);

  }


  function normalizeText(value) {

    if (
      value === null ||
      value === undefined
    ) {
      return '';
    }

    return String(value)
      .toLowerCase()
      .replace(/ي/g, 'ی')
      .replace(/ك/g, 'ک');

  }


  function matchesSearch(item) {

    if (!searchTerm) {
      return true;
    }

    const text =
      normalizeText(
        Object
          .values(item || {})
          .join(' ')
      );

    return text.includes(
      normalizeText(searchTerm)
    );

  }


  /* =========================================================
     TASK SORTING
  ========================================================= */

  function isCompleted(item) {

    const status =
      normalizeText(
        item?.['وضعیت']
      );

    return (
      status.includes('انجام شده')
    );

  }


  function isOpenTask(item) {

    const status =
      normalizeText(
        item?.['وضعیت']
      );

    return (
      status.includes('انجام نشده') ||
      status.includes('در حال انجام')
    );

  }


  function priorityScore(item) {

    const priority =
      normalizeText(
        item?.['الویت']
      );

    const open =
      isOpenTask(item);

    const completed =
      isCompleted(item);


    /*
     * امتیاز بالاتر = بالاتر در لیست
     */

    if (
      open &&
      priority.includes('فوری')
    ) {
      return 100;
    }

    if (
      open &&
      priority.includes('بالا')
    ) {
      return 90;
    }

    if (
      open &&
      priority.includes('عادی')
    ) {
      return 80;
    }

    if (
      open &&
      priority.includes('پایین')
    ) {
      return 70;
    }

    /*
     * سایر کارهای باز
     */

    if (open) {
      return 60;
    }

    /*
     * انجام‌شده‌ها همیشه پایین‌تر
     */

    if (completed) {
      return 10;
    }

    return 20;

  }


  function sortTasks(items) {

    return [...items].sort(
      (a, b) => {

        const scoreA =
          priorityScore(a);

        const scoreB =
          priorityScore(b);

        return scoreB - scoreA;

      }
    );

  }


  /* =========================================================
     STATUS
  ========================================================= */

  function statusClass(status) {

    if (!status) {
      return 'info';
    }

    const s =
      String(status);

    if (
      s.includes('انجام شده')
    ) {
      return 'success';
    }

    if (
      s.includes('در حال انجام')
    ) {
      return 'info';
    }

    if (
      s.includes('انجام نشده')
    ) {
      return 'warning';
    }

    if (
      s.includes('فوری') ||
      s.includes('خطر') ||
      s.includes('منقضی')
    ) {
      return 'danger';
    }

    return 'info';

  }


  function priorityClass(priority) {

    if (!priority) {
      return 'low';
    }

    const p =
      String(priority);

    if (
      p.includes('فوری')
    ) {
      return 'urgent';
    }

    if (
      p.includes('بالا')
    ) {
      return 'high';
    }

    if (
      p.includes('عادی')
    ) {
      return 'normal';
    }

    return 'low';

  }


  function dueClass(value) {

    if (!value) {
      return 'info';
    }

    const s =
      String(value);

    if (
      s.includes('انجام شده')
    ) {
      return 'success';
    }

    if (
      s.includes('تا ۳ روز') ||
      s.includes('امروز') ||
      s.includes('منقضی')
    ) {
      return 'danger';
    }

    if (
      s.includes('۳۰ روز')
    ) {
      return 'warning';
    }

    return 'info';

  }


  function taskCardClass(item) {

    const priority =
      priorityClass(

    const open =
      isOpenTask(item);

    if (
      open &&
      priority === 'urgent'
    ) {
      return 'priority-urgent-open';
    }

    if (
      open &&
      priority === 'high'
    ) {
      return 'priority-high-open';
    }

    return '';

  }


  /* =========================================================
     API
  ========================================================= */

  async function loadDashboard() {

    const root =
      document.getElementById(
        'root'
      );

    try {

      if (
        !tg ||
        !tg.initData
      ) {

        throw new Error(
          'لطفاً داشبورد را از داخل Telegram باز کنید.'
        );

      }


      const url =
        API_URL +
        '?action=getDashboard' +
        '&key=' +
        encodeURIComponent(API_KEY) +
        '&initData=' +
        encodeURIComponent(tg.initData) +
        '&_=' +
        Date.now();


      const response =
        await fetch(
          url,
          {
            method: 'GET',
            cache: 'no-store'
          }
        );


      const raw =
        await response.text();


      console.log(
        'API RAW:',
        raw
      );


      if (!response.ok) {

        throw new Error(
          'HTTP ' +
          response.status +
          ': ' +
          raw
        );

      }


      let result;

      try {

        result =
          JSON.parse(raw);

      } catch (e) {

        throw new Error(
          'پاسخ سرور JSON معتبر نیست.'
        );

      }


      if (!result.ok) {

        throw new Error(
          result.error ||
          'خطا در دریافت اطلاعات داشبورد'
        );

      }


      if (!result.data) {

        throw new Error(
          'ساختار اطلاعات داشبورد ناقص است.'
        );

      }


      if (
        !result.data.Summary ||
        !Array.isArray(
          result.data.Clients
        ) ||
        !Array.isArray(
          result.data.Accounting
        ) ||
        !Array.isArray(
          result.data.Tax
        ) ||
        !Array.isArray(
          result.data.Receivables
        )
      ) {

        throw new Error(
          'ساختار داده‌های داشبورد معتبر نیست.'
        );

      }


      dashboard =
        result.data;


      renderDashboard();

    } catch (error) {

      console.error(
        'Dashboard error:',
        error
      );


      root.innerHTML = `

              class="retry"

              تلاش مجدد
            </button>

          </div>

        </div>

      `;

    }

  }

  /* =========================================================
     OVERVIEW
  ========================================================= */

  function renderOverview() {

    const s =
      dashboard.Summary;


    const totalServices =
      toNumber(
        s.AccountingCount
      ) +
      toNumber(
        s.TaxCount
      );


    const completedServices =
      toNumber(
        s.AccountingCompleted
      ) +
      toNumber(
        s.TaxCompleted
      );


    const activeServices =
      Math.max(
        0,
        totalServices -
        completedServices
      );


    const completionPercent =
      totalServices > 0
        ? Math.round(
            completedServices /
            totalServices *
            100
          )
        : 0;


    const activePercent =
      totalServices > 0
        ? Math.round(
            activeServices /
            totalServices *
            100
          )
        : 0;


    const completionDeg =
      Math.max(
        0,
        Math.min(

          completionPercent
        )

    const activeDeg =
      Math.max(

        Math.min(

          activePercent
        )
      ) * 3.6;


    return `

                </div>

              </div>

            </div>


            <div class="chart-title">

    `;

  }

  /* =========================================================

  ========================================================= */

  function bindEvents() {

    const input =
      document.getElementById(
        'searchInput'
      );


    if (input) {

      input.addEventListener(
        'input',
        function(e) {

          searchTerm =
            e.target.value.trim();

          renderItems();

        }
      );

    }


    document
      .querySelectorAll('.tab')
      .forEach(tab => {

        tab.addEventListener(
          'click',
          function() {

            currentTab =
              this.dataset.tab;


            document
              .querySelectorAll('.tab')
              .forEach(t =>
                t.classList.remove(
                  'active'
                )
              );


            this.classList.add(
              'active'
            );


            renderItems();

          }
        );

      });

  }


  /* =========================================================
     ITEMS
  ========================================================= */

  function renderItems() {

    const container =
      document.getElementById(
        'items'
      );


    const count =
      document.getElementById(
        'serviceCount'
      );


    if (!container) {
      return;
    }


    let html = '';

    let totalCount = 0;


    /*
     * حسابداری
     */

    if (
      currentTab === 'all' ||
      currentTab === 'accounting'
    ) {

      const accounting =
        sortTasks(
          dashboard.Accounting
            .filter(
              matchesSearch
            )
        );


      totalCount +=
        accounting.length;


      if (
        currentTab === 'accounting'
      ) {

        html +=
          accounting
            .map(
              renderAccounting
            )
            .join('');

      }


      if (
        currentTab === 'all'
      ) {

        html +=
          accounting
            .map(
              renderAccounting
            )
            .join('');

      }

    }


    /*
     * مالیاتی
     */

    if (
      currentTab === 'all' ||
      currentTab === 'tax'
    ) {

      const tax =
        sortTasks(
          dashboard.Tax
            .filter(
              matchesSearch
            )
        );


      totalCount +=
        tax.length;


      if (
        currentTab === 'tax'
      ) {

        html +=
          tax
            .map(
              renderTax
            )
            .join('');

      }


      if (
        currentTab === 'all'
      ) {

        html +=
          tax
            .map(
              renderTax
            )
            .join('');

      }

    }


    /*
     * مشتریان
     */

    if (
      currentTab === 'clients'
    ) {

      const clients =
        dashboard.Clients
          .filter(
            matchesSearch
          );


      totalCount =
        clients.length;


      html =
        clients
          .map(
            renderClient
          )
          .join('');

    }


    /*
     * Empty state
     */

    if (!html) {

      html = `

        <div class="empty glass">
          موردی برای نمایش پیدا نشد.
        </div>

      `;

    }


    container.innerHTML =
      html;


    if (count) {

      count.textContent =
        formatNumber(
          totalCount
        ) +
        ' مورد';

    }


    renderReceivablesIfNeeded();

  }

  /* =========================================================
     RECEIVABLES
  ========================================================= */

  function renderReceivablesIfNeeded() {

    if (
      currentTab !== 'all'
    ) {
      return;
    }


    const container =
      document.getElementById(
        'items'
      );


    if (!container) {
      return;
    }


    const receivables =
      dashboard.Receivables
        .filter(
          matchesSearch
        );


    if (
      !receivables.length
    ) {
      return;
    }


    const section =
      document.createElement(
        'section'
      );


    section.className =
      'receivables-section';


    section.innerHTML = `

      <div class="section-title-row">

        <h2 class="section-title">
          دریافتنی‌ها
        </h2>

        <span class="section-count">

          ${formatNumber(
            receivables.length
          )}

          مورد

        </span>

      </div>


      <div class="receivables-container">

        ${receivables
          .map(
            renderReceivable
          )
          .join('')}

      </div>

    `;


    container.appendChild(
      section
    );

  }

            'تاریخ دریافت',

  /* =========================================================
     TOUCH LIGHT
  ========================================================= */

  function createTouchLight(
    x,
    y
  ) {

    const light =
      document.createElement(
        'div'
      );


    light.className =
      'touch-light';


    light.style.left =
      x + 'px';


    light.style.top =
      y + 'px';


    document.body.appendChild(
      light
    );


    setTimeout(
      () => {

        if (
          light &&
          light.parentNode
        ) {

          light.remove();

        }

      },
      750
    );

  }


  /*
   * pointerdown برای موبایل و دسکتاپ
   */

  document.addEventListener(
    'pointerdown',
    function(e) {

      createTouchLight(
        e.clientX,
        e.clientY
      );

    },
    {
      passive: true
    }
  );


  /* =========================================================
     START
  ========================================================= */

  loadDashboard();

</script>
