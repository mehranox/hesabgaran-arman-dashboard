<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    داشبورد حسابگران آرمان
  </title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {

      margin: 0;

      font-family:
        Tahoma,
        Arial,
        sans-serif;

      background:
        linear-gradient(
          135deg,
          #f5f3ed,
          #ebe7dc
        );

      color: #222;

      min-height: 100vh;

      padding: 20px;

    }


    .container {

      width: 100%;

      max-width: 1100px;

      margin:
        0 auto;

    }


    .header {

      background: white;

      border-radius: 24px;

      padding: 25px;

      margin-bottom: 20px;

      box-shadow:
        0 10px 35px
        rgba(0,0,0,.08);

    }


    .header h1 {

      margin:
        0 0 8px;

      font-size: 25px;

    }


    .header p {

      margin: 0;

      color: #777;

      font-size: 14px;

    }


    .status {

      background: white;

      border-radius: 20px;

      padding: 20px;

      margin-bottom: 20px;

      box-shadow:
        0 8px 25px
        rgba(0,0,0,.06);

    }


    .status-title {

      font-weight: bold;

      margin-bottom: 12px;

    }


    #status {

      line-height: 2;

      font-size: 14px;

      white-space: pre-wrap;

      word-break: break-word;

    }


    .loading {

      display: inline-block;

      width: 10px;

      height: 10px;

      border-radius: 50%;

      background: #b08d57;

      margin-left: 8px;

      animation:
        pulse 1s infinite;

    }


    @keyframes pulse {

      0% {
        opacity: .3;
      }

      50% {
        opacity: 1;
      }

      100% {
        opacity: .3;
      }

    }


    .user-card {

      display: none;

      background: white;

      border-radius: 20px;

      padding: 20px;

      margin-bottom: 20px;

      box-shadow:
        0 8px 25px
        rgba(0,0,0,.06);

    }


    .user-name {

      font-size: 18px;

      font-weight: bold;

    }


    .user-id {

      margin-top: 6px;

      color: #888;

      font-size: 13px;

    }


    .stats {

      display: grid;

      grid-template-columns:
        repeat(
          auto-fit,
          minmax(
            180px,
            1fr
          )
        );

      gap: 15px;

      margin-bottom: 20px;

    }


    .stat {

      background: white;

      border-radius: 20px;

      padding: 22px;

      box-shadow:
        0 8px 25px
        rgba(0,0,0,.06);

    }


    .stat-title {

      color: #777;

      font-size: 13px;

      margin-bottom: 10px;

    }


    .stat-value {

      font-size: 30px;

      font-weight: bold;

    }


    .sections {

      display: grid;

      gap: 18px;

    }


    .section {

      background: white;

      border-radius: 20px;

      padding: 22px;

      box-shadow:
        0 8px 25px
        rgba(0,0,0,.06);

    }


    .section h2 {

      margin:
        0 0 15px;

      font-size: 19px;

    }


    .item {

      border-top:
        1px solid #eee;

      padding:
        13px 0;

    }


    .item:first-child {

      border-top: none;

    }


    .item-title {

      font-weight: bold;

      margin-bottom: 5px;

    }


    .item-text {

      color: #666;

      font-size: 13px;

      line-height: 1.8;

    }


    .error {

      color: #b42318;

    }


    .success {

      color: #16803c;

    }


    .warning {

      color: #a15c00;

    }


    .hidden {

      display: none !important;

    }


    .retry {

      margin-top: 15px;

      border: none;

      border-radius: 12px;

      padding:
        12px 20px;

      background: #222;

      color: white;

      cursor: pointer;

      font-family: inherit;

    }


    .footer {

      text-align: center;

      color: #999;

      font-size: 12px;

      padding: 25px 0;

    }

  </style>

</head>


<body>


<div class="container">


  <!-- HEADER -->

  <div class="header">

    <h1>
      📊 داشبورد حسابگران آرمان
    </h1>

    <p>
      سامانه مدیریت اطلاعات مؤسسه
    </p>

  </div>


  <!-- STATUS -->

  <div class="status">

    <div class="status-title">
      وضعیت اتصال
    </div>

    <div id="status">
      <span class="loading"></span>
      در حال راه‌اندازی...
    </div>

    <button
      id="retryButton"
      class="retry hidden"
      onclick="startApp()"
    >
      تلاش مجدد
    </button>

  </div>


  <!-- USER -->

  <div
    id="userCard"
    class="user-card"
  >

    <div
      id="userName"
      class="user-name"
    ></div>

    <div
      id="userId"
      class="user-id"
    ></div>

  </div>


  <!-- STATS -->

  <div
    id="stats"
    class="stats hidden"
  >

    <div class="stat">

      <div class="stat-title">
        مشتریان
      </div>

      <div
        id="clientsCount"
        class="stat-value"
      >
        0
      </div>

    </div>


    <div class="stat">

      <div class="stat-title">
        خدمات حسابداری
      </div>

      <div
        id="accountingCount"
        class="stat-value"
      >
        0
      </div>

    </div>


    <div class="stat">

      <div class="stat-title">
        خدمات مالیاتی
      </div>

      <div
        id="taxCount"
        class="stat-value"
      >
        0
      </div>

    </div>


    <div class="stat">

      <div class="stat-title">
        مطالبات
      </div>

      <div
        id="receivablesCount"
        class="stat-value"
      >
        0
      </div>

    </div>

  </div>


  <!-- SECTIONS -->

  <div
    id="sections"
    class="sections hidden"
  ></div>


  <div class="footer">
    حسابگران آرمان © ۱۴۰۵
  </div>


</div>


<script>


/* ==================================================
   CONFIG
================================================== */

const GAS_API =
  'https://script.google.com/macros/s/AKfycbzK62xIUIm8VyTektiy9EKOZBnMeXb1bxIKtcCxKfABIYFezMNEH6yfcrWAeL34zmI/exec';


/* ==================================================
   TELEGRAM
================================================== */

const tg =
  window.Telegram &&
  window.Telegram.WebApp
    ? window.Telegram.WebApp
    : null;


/* ==================================================
   DOM HELPERS
================================================== */

function setStatus(
  message,
  type = ''
) {

  const element =
    document.getElementById(
      'status'
    );

  element.className =
    type;

  element.innerHTML =
    message;

}


function showRetry() {

  document
    .getElementById(
      'retryButton'
    )
    .classList.remove(
      'hidden'
    );

}


function hideRetry() {

  document
    .getElementById(
      'retryButton'
    )
    .classList.add(
      'hidden'
    );

}


/* ==================================================
   START APP
================================================== */

function startApp() {

  hideRetry();


  /*
   * -----------------------------------------------
   * Step 1
   * -----------------------------------------------
   */

  setStatus(
    '<span class="loading"></span>' +
    'در حال اتصال به Telegram...'
  );


  if (!tg) {

    setStatus(
      '❌ Telegram WebApp پیدا نشد.<br><br>' +
      'این صفحه باید از طریق دکمه داشبورد داخل ربات باز شود.',
      'error'
    );

    showRetry();

    return;

  }


  /*
   * Telegram initialization
   */

  try {

    tg.ready();

    tg.expand();

  } catch (error) {

    console.error(
      error
    );

  }


  /*
   * -----------------------------------------------
   * Step 2
   * -----------------------------------------------
   */

  setStatus(
    '✅ اتصال به Telegram برقرار شد.<br>' +
    '<span class="loading"></span>' +
    'در حال دریافت اطلاعات امنیتی Telegram...'
  );


  /*
   * -----------------------------------------------
   * initData
   * -----------------------------------------------
   */

  const initData =
    tg.initData || '';


  console.log(
    'Telegram initData length:',
    initData.length
  );


  if (!initData) {

    setStatus(
      '❌ اطلاعات ورود Telegram دریافت نشد.<br><br>' +
      'صفحه را باید مستقیماً از دکمه «📊 ورود به داشبورد» داخل ربات باز کنید.',
      'error'
    );

    showRetry();

    return;

  }


  /*
   * -----------------------------------------------
   * Step 3
   * -----------------------------------------------
   */

  setStatus(
    '✅ Telegram تأیید شد.<br>' +
    '<span class="loading"></span>' +
    'در حال اتصال به سرور حسابگران آرمان...'
  );


  /*
   * -----------------------------------------------
   * Create JSONP callback
   * -----------------------------------------------
   */

  const callbackName =
    'dashboardCallback_' +
    Date.now();


  /*
   * -----------------------------------------------
   * Global callback
   * -----------------------------------------------
   */

  window[callbackName] =
    function(result) {

      try {

        console.log(
          'Apps Script response:',
          result
        );


        /*
         * Remove script
         */

        cleanup();


        /*
         * Process response
         */

        handleDashboardResult(
          result
        );


      } catch (error) {

        console.error(
          error
        );

        setStatus(
          '❌ خطا هنگام پردازش اطلاعات داشبورد:<br><br>' +
          escapeHtml(
            error.message
          ),
          'error'
        );

        showRetry();

      }

    };


  /*
   * -----------------------------------------------
   * Create script
   * -----------------------------------------------
   */

  const script =
    document.createElement(
      'script'
    );


  /*
   * Build URL
   *
   * encodeURIComponent is essential because
   * initData contains special characters.
   */

  const url =
    GAS_API +
    '?action=getDashboard' +
    '&callback=' +
    encodeURIComponent(
      callbackName
    ) +
    '&initData=' +
    encodeURIComponent(
      initData
    );


  console.log(
    'Apps Script URL:',
    url
  );


  script.src =
    url;


  script.async =
    true;


  /*
   * -----------------------------------------------
   * Load error
   * -----------------------------------------------
   */

  script.onerror =
    function() {

      cleanup();


      setStatus(
        '❌ اتصال به سرور حسابگران آرمان برقرار نشد.<br><br>' +
        'Apps Script پاسخ قابل دریافت نداد.<br><br>' +
        '<small>' +
        escapeHtml(
          GAS_API
        ) +
        '</small>',
        'error'
      );


      showRetry();

    };


  /*
   * -----------------------------------------------
   * Timeout
   * -----------------------------------------------
   */

  const timeout =
    setTimeout(
      function() {

        cleanup();


        setStatus(
          '❌ زمان اتصال به سرور تمام شد.<br><br>' +
          'Apps Script در زمان مقرر پاسخ نداد.',
          'error'
        );


        showRetry();

      },
      15000
    );


  /*
   * Store timeout
   */

  script.dataset.timeout =
    timeout;


  /*
   * -----------------------------------------------
   * Cleanup
   * -----------------------------------------------
   */

  function cleanup() {

    clearTimeout(
      timeout
    );


    if (
      script.parentNode
    ) {

      script.parentNode
        .removeChild(
          script
        );

    }


    try {

      delete window[
        callbackName
      ];

    } catch (error) {

      window[
        callbackName
      ] = undefined;

    }

  }


  /*
   * -----------------------------------------------
   * Add script to page
   * -----------------------------------------------
   */

  document.body.appendChild(
    script
  );

}


/* ==================================================
   DASHBOARD RESULT
================================================== */

function handleDashboardResult(
  result
) {

  /*
   * -----------------------------------------------
   * Invalid response
   * -----------------------------------------------
   */

  if (
    !result
  ) {

    setStatus(
      '❌ پاسخ خالی از سرور دریافت شد.',
      'error'
    );

    showRetry();

    return;

  }


  /*
   * -----------------------------------------------
   * Backend error
   * -----------------------------------------------
   */

  if (
    result.ok !== true
  ) {

    setStatus(

      '❌ سرور داشبورد خطا داد.<br><br>' +

      '<strong>' +

      escapeHtml(
        result.error ||
        'خطای نامشخص'
      ) +

      '</strong>',

      'error'

    );


    showRetry();

    return;

  }


  /*
   * -----------------------------------------------
   * Success
   * -----------------------------------------------
   */

  setStatus(
    '✅ اتصال کامل برقرار شد.<br>' +
    '✅ Telegram تأیید شد.<br>' +
    '✅ اطلاعات داشبورد دریافت شد.',
    'success'
  );


  /*
   * User
   */

  renderUser(
    result.user
  );


  /*
   * Dashboard
   */

  renderDashboard(
    result.dashboard
  );

}


/* ==================================================
   RENDER USER
================================================== */

function renderUser(
  user
) {

  if (
    !user
  ) {

    return;

  }


  const card =
    document.getElementById(
      'userCard'
    );


  const name =
    document.getElementById(
      'userName'
    );


  const id =
    document.getElementById(
      'userId'
    );


  let fullName = '';


  if (
    user.first_name
  ) {

    fullName +=
      user.first_name;

  }


  if (
    user.last_name
  ) {

    fullName +=
      ' ' +
      user.last_name;

  }


  if (
    !fullName
  ) {

    fullName =
      user.username
        ? '@' +
          user.username
        : 'کاربر Telegram';

  }


  name.textContent =
    '👤 ' +
    fullName;


  id.textContent =
    'Telegram ID: ' +
    (
      user.id || '-'
    );


  card.style.display =
    'block';

}


/* ==================================================
   RENDER DASHBOARD
================================================== */

function renderDashboard(
  dashboard
) {

  if (
    !dashboard
  ) {

    setStatus(
      '❌ داده داشبورد خالی است.',
      'error'
    );

    showRetry();

    return;

  }


  /*
   * -----------------------------------------------
   * Stats
   * -----------------------------------------------
   */

  const stats =
    dashboard.stats || {};


  document.getElementById(
    'clientsCount'
  ).textContent =
    formatNumber(
      stats.clients || 0
    );


  document.getElementById(
    'accountingCount'
  ).textContent =
    formatNumber(
      stats.accounting || 0
    );


  document.getElementById(
    'taxCount'
  ).textContent =
    formatNumber(
      stats.tax || 0
    );


  document.getElementById(
    'receivablesCount'
  ).textContent =
    formatNumber(
      stats.receivables || 0
    );


  document.getElementById(
    'stats'
  ).classList.remove(
    'hidden'
  );


  /*
   * -----------------------------------------------
   * Sections
   * -----------------------------------------------
   */

  const sections =
    dashboard.sections || [];


  renderSections(
    sections
  );

}


/* ==================================================
   RENDER SECTIONS
================================================== */

function renderSections(
  sections
) {

  const container =
    document.getElementById(
      'sections'
    );


  container.innerHTML =
    '';


  if (
    !Array.isArray(sections) ||
    !sections.length
  ) {

    container.innerHTML =

      '<div class="section">' +

      '<h2>📋 اطلاعات داشبورد</h2>' +

      '<div class="item-text">' +

      'اتصال برقرار شد، اما در فایل JSON ' +
      'اطلاعاتی برای نمایش وجود ندارد.' +

      '</div>' +

      '</div>';

    container.classList.remove(
      'hidden'
    );

    return;

  }


  sections.forEach(
    function(section) {

      const sectionElement =
        document.createElement(
          'div'
        );


      sectionElement.className =
        'section';


      const title =
        document.createElement(
          'h2'
        );


      title.textContent =
        section.title ||
        section.id ||
        'بخش';


      sectionElement.appendChild(
        title
      );


      const items =
        Array.isArray(
          section.items
        )
          ? section.items
          : [];


      if (
        !items.length
      ) {

        const empty =
          document.createElement(
            'div'
          );


        empty.className =
          'item-text';


        empty.textContent =
          'اطلاعاتی وجود ندارد.';


        sectionElement.appendChild(
          empty
        );

      }


      items.forEach(
        function(item) {

          sectionElement.appendChild(
            createItemElement(
              item
            )
          );

        }
      );


      container.appendChild(
        sectionElement
      );

    }
  );


  container.classList.remove(
    'hidden'
  );

}


/* ==================================================
   CREATE ITEM
================================================== */

function createItemElement(
  item
) {

  const element =
    document.createElement(
      'div'
    );


  element.className =
    'item';


  /*
   * Object
   */

  if (
    item &&
    typeof item === 'object'
  ) {

    const title =
      document.createElement(
        'div'
      );


    title.className =
      'item-title';


    const possibleTitle =

      item.title ||
      item.name ||
      item.Name ||
      item.client ||
      item.Client ||
      item.subject ||
      item.Subject ||
      item.id ||
      'مورد';


    title.textContent =
      possibleTitle;


    element.appendChild(
      title
    );


    const text =
      document.createElement(
        'div'
      );


    text.className =
      'item-text';


    const keys =
      Object.keys(
        item
      );


    const values =
      keys
        .filter(
          function(key) {

            return ![
              'title',
              'name',
              'Name',
              'client',
              'Client'
            ].includes(
              key
            );

          }
        )
        .map(
          function(key) {

            return (
              key +
              ': ' +
              formatValue(
                item[key]
              )
            );

          }
        );


    text.textContent =
      values.join(
        ' | '
      );


    element.appendChild(
      text
    );

  }


  /*
   * Primitive value
   */

  else {

    element.textContent =
      String(
        item
      );

  }


  return element;

}


/* ==================================================
   FORMAT VALUE
================================================== */

function formatValue(
  value
) {

  if (
    value === null ||
    value === undefined
  ) {

    return '-';

  }


  if (
    typeof value === 'object'
  ) {

    try {

      return JSON.stringify(
        value
      );

    } catch (error) {

      return String(
        value
      );

    }

  }


  return String(
    value
  );

}


/* ==================================================
   NUMBER FORMAT
================================================== */

function formatNumber(
  value
) {

  const number =
    Number(
      value
    );


  if (
    Number.isNaN(
      number
    )
  ) {

    return '0';

  }


  return number.toLocaleString(
    'fa-IR'
  );

}


/* ==================================================
   HTML ESCAPE
================================================== */

function escapeHtml(
  value
) {

  return String(
    value
  )

    .replace(
      /&/g,
      '&amp;'
    )

    .replace(
      /</g,
      '&lt;'
    )

    .replace(
      />/g,
      '&gt;'
    )

    .replace(
      /"/g,
      '&quot;'
    )

    .replace(
      /'/g,
      '&#039;'
    );

}


/* ==================================================
   START
================================================== */

startApp();


</script>


</body>

</html>
