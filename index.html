<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>حسابگران آرمان</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --bg: #07131b;
      --bg2: #0b1d25;

      --blue: #38bdf8;
      --blue2: #2563eb;

      --gold: #d6b56d;
      --gold2: #f0d28a;

      --olive: #89964a;
      --olive2: #a8b85d;

      --text: #f5f7f4;
      --muted: #9caeb4;

      --glass: rgba(255,255,255,.065);
      --glass2: rgba(255,255,255,.095);

      --border: rgba(255,255,255,.10);

      --success: #65d6a0;
      --danger: #ff6675;
      --warning: #f4c96b;
    }

    html {
      background: var(--bg);
    }

    body {
      margin: 0;
      padding: 0;

      min-height: 100vh;

      background:
        radial-gradient(
          circle at 15% 10%,
          rgba(56,189,248,.10),
          transparent 30%
        ),
        radial-gradient(
          circle at 85% 15%,
          rgba(214,181,109,.09),
          transparent 28%
        ),
        radial-gradient(
          circle at 50% 100%,
          rgba(137,150,74,.08),
          transparent 35%
        ),
        linear-gradient(
          145deg,
          var(--bg),
          var(--bg2)
        );

      color: var(--text);

      font-family:
        Tahoma,
        Arial,
        sans-serif;

      overflow-x: hidden;
    }

    body::before {
      content: "";

      position: fixed;

      inset: 0;

      pointer-events: none;

      background:
        linear-gradient(
          120deg,
          transparent 0%,
          rgba(255,255,255,.015) 50%,
          transparent 100%
        );

      z-index: 0;
    }

    #root {
      position: relative;
      z-index: 1;

      min-height: 100vh;
    }

    .app {
      width: 100%;
      max-width: 1100px;

      margin: 0 auto;

      padding:
        14px
        14px
        30px;
    }

    /* ======================================================
       HERO
    ====================================================== */

    .hero {
      position: relative;

      overflow: hidden;

      padding: 20px;

      margin-bottom: 14px;

      border-radius: 24px;

      background:
        linear-gradient(
          135deg,
          rgba(255,255,255,.095),
          rgba(255,255,255,.035)
        );

      border: 1px solid var(--border);

      box-shadow:
        0 20px 60px rgba(0,0,0,.28),
        inset 0 1px 0 rgba(255,255,255,.07);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .hero::after {
      content: "";

      position: absolute;

      width: 220px;
      height: 220px;

      left: -100px;
      top: -120px;

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(56,189,248,.16),
          transparent 68%
        );

      pointer-events: none;
    }

    .hero-top {
      position: relative;
      z-index: 2;

      display: flex;

      justify-content: space-between;

      align-items: center;

      gap: 12px;
    }

    .brand {
      display: flex;

      align-items: center;

      gap: 12px;
    }

    .brand-icon {
      width: 52px;
      height: 52px;

      display: flex;

      align-items: center;
      justify-content: center;

      border-radius: 16px;

      font-size: 27px;

      color: var(--gold2);

      background:
        linear-gradient(
          145deg,
          rgba(214,181,109,.20),
          rgba(56,189,248,.08)
        );

      border: 1px solid rgba(214,181,109,.25);

      box-shadow:
        0 8px 30px rgba(214,181,109,.08),
        inset 0 1px 0 rgba(255,255,255,.08);
    }

    .brand h1 {
      margin: 0;

      font-size: 21px;

      font-weight: 800;

      letter-spacing: -.5px;
    }

    .brand p {
      margin: 5px 0 0;

      color: var(--muted);

      font-size: 11px;
    }

    .connection {
      display: flex;

      align-items: center;

      gap: 7px;

      white-space: nowrap;

      color: var(--success);

      font-size: 10px;

      background: rgba(101,214,160,.07);

      border: 1px solid rgba(101,214,160,.14);

      border-radius: 30px;

      padding: 7px 10px;
    }

    .pulse {
      width: 7px;
      height: 7px;

      border-radius: 50%;

      background: var(--success);

      box-shadow:
        0 0 0 4px rgba(101,214,160,.08),
        0 0 15px rgba(101,214,160,.6);
    }

    .user-line {
      position: relative;
      z-index: 2;

      display: flex;

      justify-content: space-between;

      gap: 10px;

      margin-top: 17px;

      padding-top: 14px;

      border-top:
        1px solid
        rgba(255,255,255,.07);

      color: var(--muted);

      font-size: 10px;
    }

    .user-name {
      color: var(--gold2);

      font-weight: 700;
    }

    /* ======================================================
       STATS
    ====================================================== */

    .stats {
      display: grid;

      grid-template-columns:
        repeat(4, minmax(0,1fr));

      gap: 10px;

      margin-bottom: 14px;
    }

    .stat {
      min-width: 0;

      padding: 15px 12px;

      text-align: center;

      border-radius: 18px;

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.075),
          rgba(255,255,255,.035)
        );

      border:
        1px solid
        rgba(255,255,255,.08);

      box-shadow:
        0 10px 35px rgba(0,0,0,.18),
        inset 0 1px 0 rgba(255,255,255,.05);

      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .stat-icon {
      margin-bottom: 8px;

      font-size: 19px;

      color: var(--blue);
    }

    .stat-number {
      overflow: hidden;

      font-size: 18px;

      font-weight: 800;

      color: var(--text);

      white-space: nowrap;

      text-overflow: ellipsis;
    }

    .stat-label {
      margin-top: 5px;

      color: var(--muted);

      font-size: 9px;
    }

    /* ======================================================
       SECTIONS
    ====================================================== */

    .section {
      margin-bottom: 14px;

      padding: 16px;

      border-radius: 22px;

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.065),
          rgba(255,255,255,.025)
        );

      border:
        1px solid
        rgba(255,255,255,.08);

      box-shadow:
        0 15px 45px rgba(0,0,0,.20),
        inset 0 1px 0 rgba(255,255,255,.045);

      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .section-title {
      display: flex;

      justify-content: space-between;

      align-items: baseline;

      gap: 10px;

      margin-bottom: 14px;
    }

    .section-title h2 {
      margin: 0;

      font-size: 15px;

      font-weight: 800;
    }

    .section-title span {
      color: var(--muted);

      font-size: 9px;
    }

    /* ======================================================
       OVERVIEW
    ====================================================== */

    .overview {
      display: grid;

      grid-template-columns:
        repeat(2, minmax(0,1fr));

      gap: 12px;
    }

    .circle-card {
      padding: 15px;

      text-align: center;

      border-radius: 18px;

      background:
        rgba(0,0,0,.13);

      border:
        1px solid
        rgba(255,255,255,.055);
    }

    .donut {
      position: relative;

      width: 135px;
      height: 135px;

      margin: 0 auto 12px;

      border-radius: 50%;

      display: flex;

      align-items: center;
      justify-content: center;

      box-shadow:
        0 12px 35px rgba(0,0,0,.25);
    }

    .donut::after {
      content: "";

      position: absolute;

      width: 101px;
      height: 101px;

      border-radius: 50%;

      background:
        linear-gradient(
          145deg,
          #0b1d25,
          #07131b
        );

      box-shadow:
        inset 0 0 25px rgba(0,0,0,.3);
    }

    .donut-center {
      position: relative;

      z-index: 2;

      text-align: center;
    }

    .donut-number {
      font-size: 22px;

      font-weight: 800;
    }

    .donut-label {
      margin-top: 3px;

      color: var(--muted);

      font-size: 8px;
    }

    .legend {
      display: flex;

      justify-content: center;

      gap: 15px;

      color: var(--muted);

      font-size: 8px;
    }

    .legend-item {
      display: flex;

      align-items: center;

      gap: 5px;
    }

    .legend-dot {
      width: 7px;
      height: 7px;

      border-radius: 50%;
    }

    .legend-dot.blue {
      background: var(--blue);

      box-shadow:
        0 0 9px
        rgba(56,189,248,.5);
    }

    .legend-dot.olive {
      background: var(--olive);

      box-shadow:
        0 0 9px
        rgba(137,150,74,.5);
    }

    .legend-dot.gold {
      background: var(--gold);

      box-shadow:
        0 0 9px
        rgba(214,181,109,.5);
    }

    /* ======================================================
       SEARCH
    ====================================================== */

    .search {
      display: block;

      width: 100%;

      height: 43px;

      margin-bottom: 10px;

      padding:
        0
        14px;

      border-radius: 14px;

      border:
        1px solid
        rgba(255,255,255,.09);

      outline: none;

      color: var(--text);

      background:
        rgba(0,0,0,.18);

      font-family: inherit;

      font-size: 11px;

      direction: rtl;
    }

    .search::placeholder {
      color: #72868c;
    }

    .search:focus {
      border-color:
        rgba(56,189,248,.38);

      box-shadow:
        0 0 0 3px
        rgba(56,189,248,.06);
    }

    /* ======================================================
       TABS
    ====================================================== */

    .tabs {
      display: flex;

      gap: 7px;

      overflow-x: auto;

      padding-bottom: 3px;

      scrollbar-width: none;
    }

    .tabs::-webkit-scrollbar {
      display: none;
    }

    .tab {
      flex: 0 0 auto;

      border: 1px solid
        rgba(255,255,255,.08);

      background:
        rgba(255,255,255,.035);

      color: var(--muted);

      border-radius: 12px;

      padding:
        9px
        13px;

      font-family: inherit;

      font-size: 9px;

      cursor: pointer;
    }

    .tab.active {
      color: #fff;

      background:
        linear-gradient(
          135deg,
          rgba(56,189,248,.20),
          rgba(37,99,235,.12)
        );

      border-color:
        rgba(56,189,248,.30);

      box-shadow:
        0 6px 20px
        rgba(56,189,248,.08);
    }

    /* ======================================================
       ITEMS
    ====================================================== */

    .items {
      display: grid;

      gap: 9px;
    }

    .item {
      position: relative;

      padding: 14px;

      border-radius: 17px;

      background:
        rgba(0,0,0,.14);

      border:
        1px solid
        rgba(255,255,255,.065);

      overflow: hidden;
    }

    .item::before {
      content: "";

      position: absolute;

      right: 0;
      top: 0;
      bottom: 0;

      width: 3px;

      background: var(--blue);

      opacity: .7;
    }

    .item.priority-high::before {
      background: var(--danger);
    }

    .item.priority-medium::before {
      background: var(--warning);
    }

    .item.priority-low::before {
      background: var(--olive);
    }

    .item-head {
      display: flex;

      align-items: flex-start;

      justify-content: space-between;

      gap: 10px;
    }

    .item-title {
      min-width: 0;

      font-size: 12px;

      font-weight: 800;

      line-height: 1.8;
    }

    .item-code {
      color: var(--gold);

      font-size: 9px;

      margin-left: 5px;
    }

    .item-description {
      margin-top: 6px;

      color: var(--muted);

      font-size: 9px;

      line-height: 1.9;
    }

    .badge {
      flex: 0 0 auto;

      padding:
        5px
        8px;

      border-radius: 9px;

      font-size: 8px;

      white-space: nowrap;
    }

    .badge-done {
      color: var(--success);

      background:
        rgba(101,214,160,.08);

      border:
        1px solid
        rgba(101,214,160,.12);
    }

    .badge-progress {
      color: var(--blue);

      background:
        rgba(56,189,248,.08);

      border:
        1px solid
        rgba(56,189,248,.12);
    }

    .badge-pending {
      color: var(--warning);

      background:
        rgba(244,201,107,.07);

      border:
        1px solid
        rgba(244,201,107,.11);
    }

    .item-meta {
      display: grid;

      grid-template-columns:
        repeat(2, minmax(0,1fr));

      gap: 7px;

      margin-top: 12px;
    }

    .meta {
      min-width: 0;

      padding: 8px;

      border-radius: 10px;

      background:
        rgba(255,255,255,.025);
    }

    .meta-label {
      color: #70838a;

      font-size: 7px;

      margin-bottom: 3px;
    }

    .meta-value {
      overflow: hidden;

      color: #d8e0e2;

      font-size: 8px;

      line-height: 1.6;

      white-space: nowrap;

      text-overflow: ellipsis;
    }

    /* ======================================================
       CLIENTS
    ====================================================== */

    .client {
      display: grid;

      grid-template-columns:
        44px
        minmax(0,1fr)
        auto;

      align-items: center;

      gap: 10px;

      padding: 12px;

      border-radius: 16px;

      background:
        rgba(0,0,0,.14);

      border:
        1px solid
        rgba(255,255,255,.065);
    }

    .avatar {
      width: 44px;
      height: 44px;

      display: flex;

      align-items: center;
      justify-content: center;

      border-radius: 14px;

      color: var(--gold2);

      font-size: 18px;

      font-weight: 800;

      background:
        linear-gradient(
          145deg,
          rgba(214,181,109,.16),
          rgba(56,189,248,.08)
        );

      border:
        1px solid
        rgba(214,181,109,.16);
    }

    .client-info {
      min-width: 0;
    }

    .client-name {
      overflow: hidden;

      font-size: 11px;

      font-weight: 800;

      white-space: nowrap;

      text-overflow: ellipsis;
    }

    .client-type {
      margin-top: 4px;

      color: var(--muted);

      font-size: 8px;

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;
    }

    .client-fee {
      min-width: 70px;

      text-align: left;
    }

    .fee-number {
      color: var(--gold2);

      font-size: 10px;

      font-weight: 800;
    }

    .fee-label {
      margin-top: 3px;

      color: #71858b;

      font-size: 7px;
    }

    /* ======================================================
       LOADING
    ====================================================== */

    .loading {
      min-height: 100vh;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      gap: 15px;

      padding: 30px;

      text-align: center;
    }

    .loading-spinner {
      width: 42px;
      height: 42px;

      border-radius: 50%;

      border:
        3px solid
        rgba(255,255,255,.08);

      border-top-color:
        var(--blue);

      animation:
        spin .8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .loading-text {
      color: var(--muted);

      font-size: 11px;

      line-height: 2;
    }

    .debug-box {
      width: 100%;
      max-width: 700px;

      max-height: 280px;

      overflow: auto;

      direction: ltr;

      text-align: left;

      padding: 12px;

      border-radius: 12px;

      background:
        rgba(0,0,0,.30);

      border:
        1px solid
        rgba(255,255,255,.08);

      color: #a9c6d0;

      font-family:
        Consolas,
        monospace;

      font-size: 9px;

      white-space: pre-wrap;

      word-break: break-word;
    }

    /* ======================================================
       TOUCH LIGHT
    ====================================================== */

    .touch-light {
      position: fixed;

      width: 12px;
      height: 12px;

      margin-left: -6px;
      margin-top: -6px;

      border-radius: 50%;

      pointer-events: none;

      z-index: 9999;

      animation:
        touchLight .85s ease-out forwards;
    }

    @keyframes touchLight {

      0% {
        opacity: .9;

        transform:
          scale(.7);
      }

      100% {
        opacity: 0;

        transform:
          scale(5);
      }

    }

    /* ======================================================
       FOOTER
    ====================================================== */

    footer {
      padding: 20px 10px 8px;

      text-align: center;

      color: #61757c;

      font-size: 8px;
    }

    footer strong {
      margin-right: 6px;

      color: var(--gold);
    }

    /* ======================================================
       RESPONSIVE
    ====================================================== */

    @media (max-width: 600px) {

      .stats {
        grid-template-columns:
          repeat(2, minmax(0,1fr));
      }

      .hero {
        padding: 17px;
      }

      .brand h1 {
        font-size: 18px;
      }

      .brand-icon {
        width: 46px;
        height: 46px;
      }

    }

    @media (min-width: 700px) {

      .item-meta {
        grid-template-columns:
          repeat(4, minmax(0,1fr));
      }

      .client {
        padding: 15px;
      }

    }

  </style>

</head>


<body>

  <div id="root">

    <div class="loading">

      <div class="loading-spinner"></div>

      <div class="loading-text">
        در حال اتصال به داشبورد...
      </div>

    </div>

  </div>


  <script>

    /* ==========================================================
       CONFIG
    ========================================================== */

    const GAS_API =
      "https://script.google.com/macros/s/AKfycbzK62xIUIm8VyTektiy9EKOZBnMeXb1bxIKtcCxKfABIYFezMNEH6yfcrWAeL34zmI/exec";


    /* ==========================================================
       TELEGRAM
    ========================================================== */

    const tg =
      window.Telegram?.WebApp || null;


    if (tg) {

      tg.ready();

      tg.expand();

      try {

        tg.setHeaderColor("#07131b");

        tg.setBackgroundColor("#07131b");

      } catch (e) {}

    }


    /* ==========================================================
       STATE
    ========================================================== */

    let dashboard = null;

    let activeTab = "all";

    let searchText = "";


    /* ==========================================================
       HELPERS
    ========================================================== */

    function esc(value) {

      if (
        value === null ||
        value === undefined
      ) {

        return "";

      }

      return String(value)

        .replaceAll("&", "&amp;")

        .replaceAll("<", "&lt;")

        .replaceAll(">", "&gt;")

        .replaceAll('"', "&quot;")

        .replaceAll("'", "&#039;");

    }


    function arr(value) {

      return Array.isArray(value)
        ? value
        : [];

    }


    function normalizeKey(value) {

      return String(
        value ?? ""
      )

        .replace(
          /[\u200c\u200d\u200e\u200f\ufeff]/g,
          ""
        )

        .replace(
          /\s+/g,
          ""
        )

        .replace(
          /[_\-]/g,
          ""
        )

        .trim()

        .toLowerCase();

    }


    function get(
      obj,
      ...keys
    ) {

      if (
        !obj ||
        typeof obj !== "object"
      ) {

        return "";

      }


      const objectKeys =
        Object.keys(obj);


      for (
        const wantedKey of keys
      ) {

        const wanted =
          normalizeKey(
            wantedKey
          );


        for (
          const realKey of objectKeys
        ) {

          if (
            normalizeKey(
              realKey
            ) === wanted
          ) {

            const value =
              obj[realKey];


            if (
              value !== undefined &&
              value !== null &&
              value !== ""
            ) {

              return value;

            }

          }

        }

      }


      return "";

    }


    /* ==========================================================
       MONEY
    ========================================================== */

    function formatMoney(value) {

      if (
        value === null ||
        value === undefined ||
        value === ""
      ) {

        return "—";

      }


      const n =
        Number(
          String(value)
            .replaceAll(",", "")
            .replace(/[^\d.-]/g, "")
        );


      if (
        !Number.isFinite(n)
      ) {

        return "—";

      }


      if (n === 0) {

        return "۰";

      }


      return new Intl.NumberFormat(
        "fa-IR"
      ).format(n);

    }


    function formatMoneyShort(value) {

      if (
        value === null ||
        value === undefined ||
        value === ""
      ) {

        return "—";

      }


      const n =
        Number(
          String(value)
            .replaceAll(",", "")
            .replace(/[^\d.-]/g, "")
        );


      if (
        !Number.isFinite(n)
      ) {

        return "—";

      }


      if (
        n >= 1000000000
      ) {

        return (
          new Intl.NumberFormat(
            "fa-IR",
            {
              maximumFractionDigits: 1
            }
          ).format(
            n / 1000000000
          ) +
          " میلیارد"
        );

      }


      if (
        n >= 1000000
      ) {

        return (
          new Intl.NumberFormat(
            "fa-IR",
            {
              maximumFractionDigits: 1
            }
          ).format(
            n / 1000000
          ) +
          " میلیون"
        );

      }


      return formatMoney(n);

    }


    /* ==========================================================
       STATUS
    ========================================================== */

    function statusClass(status) {

      const s =
        String(
          status || ""
        );


      if (
        s.includes("انجام شده")
      ) {

        return "badge-done";

      }


      if (
        s.includes("در حال انجام")
      ) {

        return "badge-progress";

      }


      return "badge-pending";

    }


    function priorityClass(priority) {

      const p =
        String(
          priority || ""
        );


      if (
        p.includes("بالا") ||
        p.includes("فوری")

    function summaryValue(
      ...keys
    ) {

      const summary =
        summaryData();


      for (
        const key of keys
      ) {

        if (
          summary[key] !== undefined &&
          summary[key] !== null
        ) {

          return summary[key];

        }

      }


      return 0;

    }


    /* ==========================================================
       PARSE SERVER RESPONSE
    ========================================================== */

    function parseDashboardData(
      result
    ) {

      console.log(
        "========== RAW JSONP RESULT =========="
      );

      console.log(
        result
      );

      console.log(
        "Result type:",
        typeof result
      );


      if (
        result &&
        typeof result === "object"
      ) {

        console.log(
          "Result keys:",
          Object.keys(result)
        );

      }


      let data = null;


      /*
       * 1
       * { ok:true, data:{...} }
       */

      if (
        result &&
        result.data !== undefined &&
        result.data !== null
      ) {

        data =
          result.data;

      }


      /*
       * 2
       * { ok:true, dashboard:{...} }
       */

      else if (
        result &&
        result.dashboard !== undefined &&
        result.dashboard !== null
      ) {

        data =
          result.dashboard;

      }


      /*
       * 3
       * خود result همان داشبورد است
       */

      else if (
        result &&
        typeof result === "object" &&
        (
          result.Summary ||
          result.Clients ||
          result.Accounting ||
          result.Tax ||
          result.Receivables
        )
      ) {

        data =
          result;

      }


      /*
       * 4
       * { ok:true, result:{...} }
       */

      else if (
        result &&
        result.result !== undefined &&
        result.result !== null
      ) {

        data =
          result.result;

      }


      /*
       * 5
       * { ok:true, payload:{...} }
       */

      else if (
        result &&
        result.payload !== undefined &&
        result.payload !== null
      ) {

        data =
          result.payload;

      }


      console.log(
        "Detected data:",
        data
      );


      /*
       * String JSON
       */

      if (
        typeof data === "string"
      ) {

        const text =
          data.trim();


        if (!text) {

          throw new Error(
            "سرور پاسخ خالی ارسال کرده است."
          );

        }


        try {

          data =
            JSON.parse(
              text
            );

        } catch (error) {

          console.error(
            "JSON parse error:",
            error
          );

          throw new Error(
            "داده دریافتی از سرور JSON معتبر نیست."
          );

        }

      }


      /*
       * nested data
       */

      if (
        data &&
        typeof data === "object" &&
        data.data &&
        !data.Summary &&
        !data.Clients &&
        !data.Accounting &&
        !data.Tax &&
        !data.Receivables
      ) {

        data =
          data.data;


        if (
          typeof data === "string"
        ) {

          try {

            data =
              JSON.parse(
                data
              );

          } catch (error) {

            throw new Error(
              "ساختار داخلی اطلاعات داشبورد قابل پردازش نیست."
            );

          }

        }

      }


      /*
       * final validation
       */

      if (
        !data ||
        typeof data !== "object"
      ) {

        throw new Error(
          "Apps Script پاسخ داد، اما اطلاعات داشبورد داخل پاسخ وجود ندارد."
        );

      }


      const hasStructure =
        !!(
          data.Summary ||
          data.Clients ||
          data.Accounting ||
          data.Tax ||
          data.Receivables
        );


      if (!hasStructure) {

        console.error(
          "Unknown dashboard structure:",
          data
        );

        throw new Error(
          "پاسخ سرور دریافت شد، اما ساختار داشبورد در آن پیدا نشد."
        );

      }


      return data;

    }

    /* ==========================================================
       LOAD DASHBOARD
    ========================================================== */

    function loadDashboard() {

      const root =
        document.getElementById(
          "root"
        );


      if (
        !tg ||
        !tg.initData
      ) {

        showError(
          "داشبورد باید از داخل ربات تلگرام باز شود."
        );

        return;

      }


      /*
       * نمایش Loading
       */

      if (root) {

        root.innerHTML = `

          <div class="loading">

            <div class="loading-spinner"></div>

            <div class="loading-text">
              در حال دریافت اطلاعات داشبورد...
            </div>

          </div>

        `;

      }


      const callbackName =
        "dashboardCallback_" +
        Date.now() +
        "_" +
        Math.floor(
          Math.random() * 100000
        );


      window[callbackName] =
        function(result) {

          try {

            console.log(
              "Telegram initData exists:",
              !!tg.initData
            );


            console.log(
              "Apps Script callback received:",
              result
            );


            /*
             * فقط false بودن ok را خطا می‌گیریم.
             *
             * قبلاً وجود نداشتن ok را هم
             * خطا حساب می‌کردیم.
             */

            if (
              !result
            ) {

              throw new Error(
                "پاسخ خالی از سرور دریافت شد."
              );

            }


            if (
              result.ok === false
            ) {

              throw new Error(
                result.error ||
                "Apps Script خطا برگرداند."
              );

            }


            dashboard =
              parseDashboardData(
                result
              );


            console.log(
              "========== DASHBOARD =========="
            );

            console.log(
              dashboard
            );


            console.log(
              "Summary:",
              dashboard.Summary
            );

            console.log(
              "Clients:",
              dashboard.Clients
            );

            console.log(
              "Accounting:",
              dashboard.Accounting
            );

            console.log(
              "Tax:",
              dashboard.Tax
            );

            console.log(
              "Receivables:",
              dashboard.Receivables
            );


            render();


          } catch (error) {

            console.error(
              "Dashboard processing error:",
              error
            );


            let debug = "";

            try {

              debug =
                JSON.stringify(
                  result,
                  null,
                  2
                );

            } catch (e) {

              debug =
                String(result);

            }


            showError(
              error.message ||
              "خطای ناشناخته",
              debug
            );


          } finally {

            delete window[
              callbackName
            ];

          }

        };


      const url =
        GAS_API +
        "?action=getDashboard" +
        "&initData=" +
        encodeURIComponent(
          tg.initData
        ) +
        "&callback=" +
        encodeURIComponent(
          callbackName
        ) +
        "&t=" +
        Date.now();


      console.log(
        "Request URL:",
        url.replace(
          /initData=[^&]+/,
          "initData=HIDDEN"
        )
      );


      const script =
        document.createElement(
          "script"
        );


      script.src =
        url;


      script.onerror =
        function() {

          delete window[
            callbackName
          ];


          showError(
            "ارتباط با Apps Script برقرار نشد."
          );

        };


      document.body.appendChild(
        script
      );

    }

                `
                : ""
            }


            ${
              remainingDays !== ""
                ? `
                  <div class="meta">

                    <div class="meta-label">
                      روز باقی‌مانده
                    </div>

                    <div class="meta-value">
                      ${esc(
                        remainingDays
                      )}
                    </div>

                  </div>
                `
                : ""
            }


            ${
              deadlineStatus
                ? `
                  <div class="meta">

                    <div class="meta-label">
                      وضعیت سررسید
                    </div>

                    <div class="meta-value">
                      ${esc(
                        deadlineStatus
                      )}
                    </div>

                  </div>
                `
                : ""
            }


            ${
              startDate
                ? `
                  <div class="meta">

                    <div class="meta-label">
                      شروع
                    </div>

                    <div class="meta-value">
                      ${esc(
                        startDate
                      )}
                    </div>

                  </div>
                `
                : ""
            }

          </div>

        </article>

      `;

    }


    /* ==========================================================
       CLIENTS
    ========================================================== */

    function renderClients(
      container
    ) {

      let clients =
        clientsData();


      if (searchText) {

        clients =
          clients.filter(
            client => {

              return JSON.stringify(
                client
              )
              .toLowerCase()
              .includes(
                searchText
              );

            }
          );

      }


      if (!clients.length) {

        container.innerHTML = `

          <div class="item">

            <div class="item-title">
              مشتری پیدا نشد
            </div>

          </div>

        `;

        return;

      }


      container.innerHTML =
        clients
          .map(
            clientCard
          )
          .join("");

    }


    function clientCard(
      client
    ) {

      const name =
        get(
          client,
          "نام شخص/شرکت"
        ) ||
        "بدون نام";


      const type =
        get(
          client,
          "نوع شخصیت"
        ) ||
        "—";


      const activity =
        get(
          client,
          "نوع فعالیت"
        ) ||
        "—";


      const fee =
        get(
          client,
          "حق الزحمه ماهانه"
        );


      const status =
        get(
          client,
          "وضعیت همکاری"
        );


      const serviceType =
        get(
          client,
          "نوع خدمات"
        );


      const city =
        get(
          client,
          "شهر"
        );


      const firstLetter =
        String(name)
          .trim()
          .charAt(0) ||
        "م";


      return `

        <div class="client">

          <div class="avatar">
            ${esc(firstLetter)}
          </div>


          <div class="client-info">

            <div class="client-name">
              ${esc(name)}
            </div>


            <div class="client-type">
              ${esc(type)}
              ·
              ${esc(activity)}
            </div>


            ${
              serviceType
                ? `
                  <div
                    style="
                      margin-top:4px;
                      color:#71858b;
                      font-size:8px;
                    "
                  >
                    ${esc(serviceType)}
                  </div>
                `
                : ""
            }


            ${
              city
                ? `
                  <div
                    style="
                      margin-top:3px;
                      color:#657a80;
                      font-size:8px;
                    "
                  >
                    📍 ${esc(city)}
                  </div>
                `
                : ""
            }

          </div>


          <div class="client-fee">

            <div class="fee-number">

              ${
                fee !== null &&
                fee !== undefined &&
                fee !== ""
                  ? formatMoney(fee)
                  : "موردی"
              }

            </div>


            <div class="fee-label">

              ${
                fee !== null &&
                fee !== undefined &&
                fee !== ""
                  ? "حق‌الزحمه"
                  : "نوع همکاری"
              }

            </div>


            <div
              style="
                margin-top:5px;
                color:${
                  status === "فعال"
                    ? "#65d6a0"
                    : "#ff6675"
                };
                font-size:8px;
              "
            >
              ${esc(
                status || "—"
              )}
            </div>

          </div>

        </div>

      `;

    }


    /* ==========================================================
       START
    ========================================================== */

    loadDashboard();

  </script>

</body>

</html>
