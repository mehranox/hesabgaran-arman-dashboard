<script>

  /* ==========================================================
     CONFIG
  ========================================================== */

  const GAS_API =
    "https://script.google.com/macros/s/AKfycbzK62xIUIm8VyTektiy9EKOZBnMeXb1bxIKtcCxKfABIYFezMNEH6yfcrWAeL34zmI/exec";


  /* ==========================================================
     TELEGRAM
  ========================================================== */

  const tg = window.Telegram?.WebApp;

  if (tg) {
    tg.ready();
    tg.expand();

    try {
      tg.setHeaderColor("#07131b");
      tg.setBackgroundColor("#07131b");
    } catch (e) {}
  }


  /* ==========================================================
     STATE
  ========================================================== */

  let dashboard = null;
  let activeTab = "all";
  let searchText = "";


  /* ==========================================================
     HELPERS
  ========================================================== */

  function esc(value) {

    if (value === null || value === undefined) {
      return "";
    }

    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

  }


  function arr(value) {

    return Array.isArray(value) ? value : [];

  }


  /*
     نرمال‌سازی کلیدهای JSON

     این قسمت مهم است چون در JSON شما بعضی کلیدها
     به صورت چندخطی ذخیره شده‌اند:

     "کد مراجعه
     کننده"

     و بعضی فاصله‌های متفاوت دارند.
  */

  function normalizeKey(value) {

    return String(value ?? "")
      .replace(/[\u200c\u200d\u200e\u200f]/g, "")
      .replace(/\s+/g, "")
      .replace(/[_\-]/g, "")
      .trim()
      .toLowerCase();

  }


  /*
     پیدا کردن مقدار بر اساس چند نام احتمالی کلید
  */

  function get(obj, ...keys) {

    if (!obj || typeof obj !== "object") {
      return "";
    }


    const objectKeys = Object.keys(obj);


    for (const wantedKey of keys) {

      const wanted = normalizeKey(wantedKey);


      for (const realKey of objectKeys) {

        if (normalizeKey(realKey) === wanted) {

          const value = obj[realKey];

          if (
            value !== undefined &&
            value !== null &&
            value !== ""
          ) {

            return value;

          }

        }

      }

    }


    return "";

  }


  function formatMoney(value) {

    if (
      value === null ||
      value === undefined ||
      value === ""
    ) {

      return "—";

    }


    const n = Number(
      String(value)
        .replaceAll(",", "")
        .replace(/[^\d.-]/g, "")
    );


    if (!Number.isFinite(n)) {
      return "—";
    }


    if (n === 0) {
      return "۰";
    }


    return new Intl.NumberFormat("fa-IR").format(n);

  }


  function formatMoneyShort(value) {

    if (
      value === null ||
      value === undefined ||
      value === ""
    ) {
      return "—";
    }


    const n = Number(value);


    if (!Number.isFinite(n)) {
      return "—";
    }


    if (n >= 1000000000) {

      return (
        new Intl.NumberFormat("fa-IR", {
          maximumFractionDigits: 1
        }).format(n / 1000000000)
        + " میلیارد"
      );

    }


    if (n >= 1000000) {

      return (
        new Intl.NumberFormat("fa-IR", {
          maximumFractionDigits: 1
        }).format(n / 1000000)
        + " میلیون"
      );

    }


    return formatMoney(n);

  }


  function statusClass(status) {

    const s = String(status || "");


    if (s.includes("انجام شده")) {
      return "badge-done";
    }


    if (s.includes("در حال انجام")) {
      return "badge-progress";
    }


    return "badge-pending";

  }


  function priorityClass(priority) {

    const p = String(priority || "");


    if (
      p.includes("بالا") ||
      p.includes("فوری")
    ) {

      return "priority-high";

    }


    if (p.includes("متوسط")) {

      return "priority-medium";

    }


    return "priority-low";

  }


  function statusIcon(status) {

    const s = String(status || "");


    if (s.includes("انجام شده")) {
      return "✓";
    }


    if (s.includes("در حال انجام")) {
      return "◐";
    }


    return "○";

  }


  /* ==========================================================
     DATA
  ========================================================== */

  function summaryData() {

    return dashboard?.Summary || {};

  }


  function accountingData() {

    return arr(
      dashboard?.Accounting
    );

  }


  function taxData() {

    return arr(
      dashboard?.Tax
    );

  }


  function clientsData() {

    return arr(
      dashboard?.Clients
    );

  }


  function receivablesData() {

    return arr(
      dashboard?.Receivables
    );

  }


  /* ==========================================================
     SUMMARY HELPERS
  ========================================================== */

  function summaryValue(...keys) {

    const summary = summaryData();

    for (const key of keys) {

      if (
        summary[key] !== undefined &&
        summary[key] !== null
      ) {

        return summary[key];

      }

    }

    return 0;

  }


  /* ==========================================================
     TOUCH LIGHT
  ========================================================== */

  document.addEventListener(
    "pointerdown",
    function(e) {

      const light =
        document.createElement("div");

      light.className =
        "touch-light";


      const colors = [
        "#38bdf8",
        "#d6b56d",
        "#9aa94f",
        "#67e8f9"
      ];


      const color =
        colors[
          Math.floor(
            Math.random() * colors.length
          )
        ];


      light.style.left =
        e.clientX + "px";

      light.style.top =
        e.clientY + "px";

      light.style.background =
        color;

      light.style.boxShadow =
        `
        0 0 12px ${color},
        0 0 35px ${color},
        0 0 70px ${color}
        `;


      document.body.appendChild(light);


      setTimeout(
        () => light.remove(),
        850
      );

    }
  );


  /* ==========================================================
     LOAD DASHBOARD
  ========================================================== */

  function loadDashboard() {

    if (!tg || !tg.initData) {

      document.getElementById("root").innerHTML = `

        <div class="loading">

          <div style="font-size:35px">
            🔐
          </div>

          <div class="loading-text">
            داشبورد را از داخل ربات تلگرام باز کنید.
          </div>

        </div>

      `;

      return;

    }


    const callbackName =
      "dashboardCallback_" +
      Date.now() +
      "_" +
      Math.floor(
        Math.random() * 100000
      );


    window[callbackName] =
      function(result) {

        try {

          if (
            !result ||
            !result.ok
          ) {

            throw new Error(
              result?.error ||
              "خطا در دریافت اطلاعات"
            );

          }


          dashboard =
            result.data;


          render();


        } catch (err) {

          showError(
            err.message
          );


        } finally {

          delete window[
            callbackName
          ];

        }

      };


    const script =
      document.createElement("script");


    const url =
      GAS_API +
      "?action=getDashboard" +
      "&initData=" +
      encodeURIComponent(
        tg.initData
      ) +
      "&callback=" +
      encodeURIComponent(
        callbackName
      ) +
      "&t=" +
      Date.now();


    script.src = url;


    script.onerror =
      function() {

        showError(
          "ارتباط با سرور داشبورد برقرار نشد."
        );

      };


    document.body.appendChild(
      script
    );

  }


  /* ==========================================================
     ERROR
  ========================================================== */

  function showError(message) {

    document.getElementById("root")
      .innerHTML = `

        <div class="loading">

          <div style="font-size:38px">
            ⚠️
          </div>

          <div class="loading-text">
            ${esc(message)}
          </div>

          <button
            class="tab active"
            onclick="location.reload()"
          >
            تلاش مجدد
          </button>

        </div>

      `;

  }


  /* ==========================================================
     RENDER
  ========================================================== */

  function render() {

    const accounting =
      accountingData();

    const tax =
      taxData();

    const clients =
      clientsData();

    const allServices = [
      ...accounting,
      ...tax
    ];


    const summary =
      summaryData();


    /*
       آمار اصلی را مستقیماً از Summary می‌گیریم.
    */

    const clientsCount =
      summaryValue(
        "ClientsCount"
      );


    const accountingCount =
      summaryValue(
        "AccountingCount"
      );


    const taxCount =
      summaryValue(
        "TaxCount"
      );


    const completed =
      summaryValue(
        "TaxCompleted"
      ) +
      summaryValue(
        "AccountingCompleted"
      );


    const totalServices =
      accountingCount +
      taxCount;


    const completion =
      totalServices > 0
        ? Math.round(
            (
              completed /
              totalServices
            ) * 100
          )
        : 0;


    const progress =
      allServices.filter(
        item =>
          String(
            get(
              item,
              "وضعیت"
            )
          ).includes(
            "در حال انجام"
          )
      ).length;


    const remaining =
      Math.max(
        0,
        totalServices -
        completed
      );


    document.getElementById("root")
      .innerHTML = `

      <main class="app">


        <!-- HERO -->

        <section class="hero">

          <div class="hero-top">

            <div class="brand">

              <div class="brand-icon">
                ◈
              </div>

              <div>

                <h1>
                  حسابگران آرمان
                </h1>

                <p>
                  سامانه مدیریت اطلاعات مؤسسه
                </p>

              </div>

            </div>


            <div class="connection">

              <span class="pulse"></span>

              اتصال امن

            </div>

          </div>


          <div class="user-line">

            <div>
              کاربر:
              <span class="user-name">
                ${
                  esc(
                    get(
                      dashboard,
                      "userName",
                      "username",
                      "user"
                    ) ||
                    "کاربر تلگرام"
                  )
                }
              </span>
            </div>


            <div>
              ✓ Telegram تأیید شد
            </div>

          </div>

        </section>


        <!-- STATS -->

        <section class="stats">

          ${statCard(
            "👥",
            clientsCount,
            "مشتری"
          )}


          ${statCard(
            "▣",
            accountingCount,
            "خدمات حسابداری"
          )}


          ${statCard(
            "◉",
            taxCount,
            "خدمات مالیاتی"
          )}


          ${statCard(
            "✓",
            completed,
            "تکمیل شده"
          )}

        </section>


        <!-- OVERVIEW -->

        <section class="section">

          <div class="section-title">

            <h2>
              نمای کلی
            </h2>

            <span>
              وضعیت جاری خدمات
            </span>

          </div>


          <div class="overview">


            <!-- COMPLETION -->

            <div class="circle-card">

              <div
                class="donut"
                style="
                  background:
                    conic-gradient(
                      var(--blue)
                      0deg
                      ${Math.max(
                        1,
                        completion
                      ) * 3.6}deg,

                      var(--olive)
                      ${Math.max(
                        1,
                        completion
                      ) * 3.6}deg
                      360deg
                    );
                "
              >

                <div class="donut-center">

                  <div class="donut-number">
                    ${completion}%
                  </div>

                  <div class="donut-label">
                    تکمیل خدمات
                  </div>

                </div>

              </div>


              <div class="legend">

                <div class="legend-item">

                  <span
                    class="legend-dot blue"
                  ></span>

                  تکمیل

                </div>


                <div class="legend-item">

                  <span
                    class="legend-dot olive"
                  ></span>

                  باقی‌مانده

                </div>

              </div>

            </div>


            <!-- ACTIVE -->

            <div class="circle-card">

              <div
                class="donut"
                style="
                  background:
                    conic-gradient(
                      var(--gold)
                      0deg
                      ${
                        allServices.length
                          ? Math.max(
                              1,
                              Math.round(
                                progress /
                                allServices.length *
                                360
                              )
                            )
                          : 1
                      }deg,

                      var(--blue)
                      ${
                        allServices.length
                          ? Math.max(
                              1,
                              Math.round(
                                progress /
                                allServices.length *
                                360
                              )
                            )
                          : 1
                      }deg
                      360deg
                    );
                "
              >

                <div class="donut-center">

                  <div class="donut-number">
                    ${progress}
                  </div>

                  <div class="donut-label">
                    در حال انجام
                  </div>

                </div>

              </div>


              <div class="legend">

                <div class="legend-item">

                  <span
                    class="legend-dot gold"
                  ></span>

                  فعال

                </div>


                <div class="legend-item">

                  <span
                    class="legend-dot blue"
                  ></span>

                  خدمات

                </div>

              </div>

            </div>

          </div>

        </section>


        <!-- RECEIVABLES -->

        <section class="section">

          <div class="section-title">

            <h2>
              وضعیت مالی
            </h2>

            <span>
              دریافتنی‌ها
            </span>

          </div>


          <div class="stats">


            ${statCard(
              "💰",
              formatMoneyShort(
                summaryValue(
                  "TotalReceivables"
                )
              ),
              "کل دریافتنی"
            )}


            ${statCard(
              "✓",
              formatMoneyShort(
                summaryValue(
                  "TotalCollected"
                )
              ),
              "دریافت شده"
            )}


            ${statCard(
              "◷",
              formatMoneyShort(
                summaryValue(
                  "RemainingReceivables"
                )
              ),
              "مانده دریافتنی"
            )}


            ${statCard(
              "!",
              summaryValue(
                "ReceivablesCount"
              ),
              "صورتحساب"
            )}

          </div>

        </section>


        <!-- SERVICES -->

        <section class="section">

          <div class="section-title">

            <h2>
              خدمات
            </h2>

            <span>
              ${allServices.length} مورد
            </span>

          </div>


          <input
            class="search"
            id="search"
            placeholder="جستجو در خدمات و مشتریان..."
            value="${esc(searchText)}"
            oninput="setSearch(this.value)"
          >


          <div class="tabs">

            <button
              class="tab ${
                activeTab === "all"
                  ? "active"
                  : ""
              }"
              onclick="setTab('all')"
            >
              همه
            </button>


            <button
              class="tab ${
                activeTab === "accounting"
                  ? "active"
                  : ""
              }"
              onclick="setTab('accounting')"
            >
              حسابداری
            </button>


            <button
              class="tab ${
                activeTab === "tax"
                  ? "active"
                  : ""
              }"
              onclick="setTab('tax')"
            >
              مالیاتی
            </button>


            <button
              class="tab ${
                activeTab === "clients"
                  ? "active"
                  : ""
              }"
              onclick="setTab('clients')"
            >
              مشتریان
            </button>

          </div>


          <div
            class="items"
            id="items"
            style="margin-top:10px"
          ></div>

        </section>


        <footer>

          حسابگران آرمان

          <strong>
            © ۱۴۰۵
          </strong>

        </footer>


      </main>

    `;


    renderItems();

  }


  /* ==========================================================
     STAT CARD
  ========================================================== */

  function statCard(
    icon,
    number,
    label
  ) {

    return `

      <div class="stat">

        <div class="stat-icon">
          ${icon}
        </div>

        <div class="stat-number">
          ${esc(number)}
        </div>

        <div class="stat-label">
          ${esc(label)}
        </div>

      </div>

    `;

  }


  /* ==========================================================
     TABS
  ========================================================== */

  function setTab(tab) {

    activeTab = tab;

    render();

  }


  function setSearch(value) {

    searchText =
      String(value || "")
        .trim()
        .toLowerCase();


    renderItems();

  }


  /* ==========================================================
     RENDER ITEMS
  ========================================================== */

  function renderItems() {

    const container =
      document.getElementById(
        "items"
      );


    if (!container) {
      return;
    }


    let data = [];


    if (
      activeTab ===
      "accounting"
    ) {

      data =
        accountingData();

    }


    else if (
      activeTab ===
      "tax"
    ) {

      data =
        taxData();

    }


    else if (
      activeTab ===
      "clients"
    ) {

      renderClients(
        container
      );

      return;

    }


    else {

      data = [
        ...accountingData(),
        ...taxData()
      ];

    }


    /* SEARCH */

    if (searchText) {

      data =
        data.filter(
          item => {

            const text =
              JSON.stringify(
                item
              )
              .toLowerCase();


            return text.includes(
              searchText
            );

          }
        );

    }


    if (!data.length) {

      container.innerHTML = `

        <div class="item">

          <div class="item-title">
            موردی پیدا نشد
          </div>

          <div class="item-description">
            برای این جستجو اطلاعاتی وجود ندارد.
          </div>

        </div>

      `;

      return;

    }


    container.innerHTML =
      data
        .map(
          serviceCard
        )
        .join("");

  }


  /* ==========================================================
     SERVICE CARD
  ========================================================== */

  function serviceCard(item) {

    const title =
      get(
        item,
        "نام مراجعه کننده",
        "نام مشتری",
        "مشتری"
      ) ||
      "بدون نام";


    const code =
      get(
        item,
        "کد مراجعه کننده",
        "کد"
      );


    const service =
      get(
        item,
        "نوع کار",
        "نوع پرونده",
        "نوع خدمت",
        "نوع"
      );


    const description =
      get(
        item,
        "شرح کار",
        "شرح"
      );


    const status =
      get(
        item,
        "وضعیت"
      );


    const priority =
      get(
        item,
        "الویت",
        "اولویت"
      );


    const due =
      get(
        item,
        "تاریخ سررسید",
        "سررسید"
      );


    const waiting =
      get(
        item,
        "منتظر چه کسی",
        "در انتظار"
      );


    const remainingDays =
      get(
        item,
        "روزهای باقی مانده"
      );


    const period =
      get(
        item,
        "دوره مالی"
      );


    const deadlineStatus =
      get(
        item,
        "وضعیت سررسید"
      );


    const startDate =
      get(
        item,
        "تاریخ شروع"
      );


    return `

      <article
        class="
          item
          ${priorityClass(priority)}
        "
      >


        <div class="item-head">


          <div class="item-title">

            <span class="item-code">
              #${esc(code)}
            </span>

            ${esc(title)}

          </div>


          <div
            class="
              badge
              ${statusClass(status)}
            "
          >

            ${statusIcon(status)}

            ${esc(
              status ||
              "در انتظار"
            )}

          </div>


        </div>


        <div class="item-description">

          ${esc(
            description ||
            "خدمت ثبت شده در سامانه"
          )}

        </div>


        <div class="item-meta">


          <div class="meta">

            <div class="meta-label">
              نوع کار
            </div>

            <div class="meta-value">
              ${esc(
                service || "—"
              )}
            </div>

          </div>


          <div class="meta">

            <div class="meta-label">
              سررسید
            </div>

            <div class="meta-value">
              ${esc(
                due || "—"
              )}
            </div>

          </div>


          <div class="meta">

            <div class="meta-label">
              اولویت
            </div>

            <div class="meta-value">
              ${esc(
                priority || "—"
              )}
            </div>

          </div>


          <div class="meta">

            <div class="meta-label">
              در انتظار
            </div>

            <div class="meta-value">
              ${esc(
                waiting || "—"
              )}
            </div>

          </div>


          ${
            period !== ""
              ? `
                <div class="meta">

                  <div class="meta-label">
                    دوره مالی
                  </div>

                  <div class="meta-value">
                    ${esc(period)}
                  </div>

                </div>
              `
              : ""
          }


          ${
            remainingDays !== ""
              ? `
                <div class="meta">

                  <div class="meta-label">
                    روز باقی‌مانده
                  </div>

                  <div class="meta-value">
                    ${esc(
                      remainingDays
                    )}
                  </div>

                </div>
              `
              : ""
          }


          ${
            deadlineStatus
              ? `
                <div class="meta">

                  <div class="meta-label">
                    وضعیت سررسید
                  </div>

                  <div class="meta-value">
                    ${esc(
                      deadlineStatus
                    )}
                  </div>

                </div>
              `
              : ""
          }


          ${
            startDate
              ? `
                <div class="meta">

                  <div class="meta-label">
                    شروع
                  </div>

                  <div class="meta-value">
                    ${esc(
                      startDate
                    )}
                  </div>

                </div>
              `
              : ""
          }

        </div>


      </article>

    `;

  }


  /* ==========================================================
     CLIENTS
  ========================================================== */

  function renderClients(
    container
  ) {

    let clients =
      clientsData();


    if (searchText) {

      clients =
        clients.filter(
          client => {

            return JSON.stringify(
              client
            )
            .toLowerCase()
            .includes(
              searchText
            );

          }
        );

    }


    if (!clients.length) {

      container.innerHTML = `

        <div class="item">

          <div class="item-title">
            مشتری پیدا نشد
          </div>

        </div>

      `;

      return;

    }


    container.innerHTML =
      clients
        .map(
          clientCard
        )
        .join("");

  }


  function clientCard(
    client
  ) {

    const name =
      get(
        client,
        "نام شخص/شرکت"
      ) ||
      "بدون نام";


    const type =
      get(
        client,
        "نوع شخصیت"
      ) ||
      "—";


    const activity =
      get(
        client,
        "نوع فعالیت"
      ) ||
      "—";


    const fee =
      get(
        client,
        "حق الزحمه ماهانه"
      );


    const status =
      get(
        client,
        "وضعیت همکاری"
      );


    const serviceType =
      get(
        client,
        "نوع خدمات"
      );


    const city =
      get(
        client,
        "شهر"
      );


    const mobile =
      get(
        client,
        "شماره موبایل"
      );


    const firstLetter =
      String(name)
        .trim()
        .charAt(0) ||
      "م";


    return `

      <div class="client">


        <div class="avatar">
          ${esc(firstLetter)}
        </div>


        <div class="client-info">

          <div class="client-name">

            ${esc(name)}

          </div>


          <div class="client-type">

            ${esc(type)}

            ·

            ${esc(activity)}

          </div>


          ${
            serviceType
              ? `
                <div
                  style="
                    margin-top:4px;
                    color:#71858b;
                    font-size:8px;
                  "
                >
                  ${esc(serviceType)}
                </div>
              `
              : ""
          }


          ${
            city
              ? `
                <div
                  style="
                    margin-top:3px;
                    color:#657a80;
                    font-size:8px;
                  "
                >
                  📍 ${esc(city)}
                </div>
              `
              : ""
          }


        </div>


        <div class="client-fee">


          <div class="fee-number">

            ${
              fee !== null &&
              fee !== undefined &&
              fee !== ""
                ? formatMoney(fee)
                : "موردی"
            }

          </div>


          <div class="fee-label">

            ${
              fee !== null &&
              fee !== undefined &&
              fee !== ""
                ? "حق‌الزحمه"
                : "نوع همکاری"
            }

          </div>


          <div
            style="
              margin-top:5px;
              color:${
                status === "فعال"
                  ? "#65d6a0"
                  : "#ff6675"
              };
              font-size:8px;
            "
          >
            ${esc(status || "—")}
          </div>


        </div>


      </div>

    `;

  }


  /* ==========================================================
     START
  ========================================================== */

  loadDashboard();

</script>
