<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>حسابگران آرمان</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

* {
  box-sizing: border-box;
}

body {

  margin: 0;

  background:
    #07131B;

  color:
    #F5F7F4;

  font-family:
    Tahoma,
    Arial,
    sans-serif;

}

.container {

  width: 100%;

  max-width: 1100px;

  margin: auto;

  padding: 20px;

}

.hero {

  background:
    rgba(255,255,255,.06);

  border:
    1px solid rgba(255,255,255,.1);

  border-radius:
    22px;

  padding:
    25px;

  margin-bottom:
    18px;

}

.hero h1 {

  margin:
    0 0 8px;

  color:
    #F0D28A;

}

.hero p {

  margin:
    0;

  color:
    #9CAEB4;

}

.status {

  margin-top:
    15px;

  color:
    #65D6A0;

}

.grid {

  display:
    grid;

  grid-template-columns:
    repeat(2, 1fr);

  gap:
    12px;

}

.card {

  background:
    rgba(255,255,255,.065);

  border:
    1px solid rgba(255,255,255,.1);

  border-radius:
    18px;

  padding:
    20px;

}

.number {

  font-size:
    28px;

  font-weight:
    bold;

  color:
    #38BDF8;

  margin-top:
    8px;

}

.label {

  color:
    #9CAEB4;

}

pre {

  white-space:
    pre-wrap;

  word-break:
    break-word;

  direction:
    ltr;

  text-align:
    left;

  color:
    #65D6A0;

  font-size:
    12px;

}

.error {

  color:
    #FF6675;

}

@media (max-width:600px) {

  .grid {

    grid-template-columns:
      1fr;

  }

}

</style>

</head>


<body>

<div class="container">

  <div class="hero">

    <h1>
      حسابگران آرمان
    </h1>

    <p>
      سامانه مدیریت اطلاعات مؤسسه
    </p>

    <div
      id="connection"
      class="status"
    >
      در حال اتصال...
    </div>

  </div>


  <div
    id="stats"
    class="grid"
  ></div>


  <div
    id="debug"
    class="card"
    style="margin-top:15px;"
  >

    <div class="label">
      وضعیت API
    </div>

    <pre id="output">
در حال دریافت اطلاعات...
    </pre>

  </div>

</div>


<script>

const API_URL =
  "https://script.google.com/macros/s/AKfycbzK62xIUIm8VyTektiy9EKOZBnMeXb1bxIKtcCxKfABIYFezMNEH6yfcrWAeL34zmI/exec";


async function loadDashboard() {

  const output =
    document.getElementById("output");

  const connection =
    document.getElementById("connection");


  try {

    const tg =
      window.Telegram &&
      window.Telegram.WebApp;


    if (tg) {

      tg.ready();

      tg.expand();

    }


    let url =
      API_URL;


    // برای تست فعلی
    url +=
      "?test=1";


    const response =
      await fetch(url);


    const raw =
      await response.text();


    console.log(
      "API STATUS:",
      response.status
    );


    console.log(
      "API RESPONSE:",
      raw
    );


    if (!response.ok) {

      throw new Error(
        "HTTP " +
        response.status +
        ": " +
        raw.substring(0,300)
      );

    }


    let result;


    try {

      result =
        JSON.parse(raw);

    } catch (e) {

      throw new Error(
        "Apps Script به جای JSON این را برگرداند:\n\n" +
        raw.substring(0,500)
      );

    }


    if (!result.ok) {

      throw new Error(
        result.error ||
        "خطای نامشخص در Apps Script"
      );

    }


    connection.textContent =
      "● اتصال به Apps Script برقرار است";


    connection.style.color =
      "#65D6A0";


    output.textContent =
      JSON.stringify(
        result,
        null,
        2
      );


    renderStats(
      result.data.Summary
    );


  } catch (error) {

    connection.textContent =
      "● اتصال ناموفق";


    connection.style.color =
      "#FF6675";


    output.className =
      "error";


    output.textContent =
      error.message;


    console.error(error);

  }

}


function renderStats(summary) {

  const stats =
    document.getElementById("stats");


  const items = [

    [
      "مراجعین",
      summary.ClientsCount
    ],

    [
      "خدمات حسابداری",
      summary.AccountingCount
    ],

    [
      "خدمات مالیاتی",
      summary.TaxCount
    ],

    [
      "مطالبات",
      summary.ReceivablesCount
    ]

  ];


  stats.innerHTML =
    items.map(function(item) {

      return `

        <div class="card">

          <div class="label">
            ${item[0]}
          </div>

          <div class="number">
            ${item[1]}
          </div>

        </div>

      `;

    }).join("");

}


loadDashboard();

</script>

</body>

</html>
